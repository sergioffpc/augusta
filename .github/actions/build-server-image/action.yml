name: Build and scan the server image
description: >
  Builds the server image into the runner's Docker (loaded, not pushed), from
  the registry layer cache and the Linux jobs' vcpkg binary cache, and fails on
  a high or critical CVE trivy finds in it. ci.yml's container-verify runs it
  for the image container-publish-x64-linux then pushes, so what it publishes
  is an image that was scanned, and on main container-publish-arm64-linux for
  the arm64 image it pushes itself. Tags it sha-<12> (sha-<12>-arm64 with
  arch-suffix); the branch tag is the publishing job's. Assumes the repository is checked out with its submodules,
  buildx is set up, and the toolchain too (setup-toolchain), whose trivy scans
  the image; a job that reads or writes the cache logs in to GHCR first.
inputs:
  preset:
    description: >
      The Dockerfile's PRESET, the kind of build (ADR-0074): "linux", a
      Development build, on container-verify's push to develop;
      "linux-shipping" on a push to main, its arm64 build and every pull
      request. Each kind has its own layer cache, buildcache for Shipping and
      buildcache-dev for Development, so one kind's pushes never evict the
      other's layers.
    required: true
  cache-to:
    description: >
      Whether to write the registry layer cache: "true" only on
      container-verify's push run, so a push writes it once and a pull request
      never does.
    required: false
    default: "false"
  arch-suffix:
    description: >
      "-arm64" on main's arm64 build (ci.yml's container-publish-arm64-linux):
      the image is tagged sha-<12>-arm64, and its
      layers cached at buildcache-arm64, so the plain tags can become the index
      of both architectures. Empty, the default, builds the amd64 image as ever.
    required: false
    default: ""
outputs:
  short-sha:
    description: >
      The first 12 characters of the commit, as the sha-<12> tag has them.
    value: ${{ steps.short-sha.outputs.value }}
  build-args:
    description: >
      The build args the image's build stage was built with, the preset and the
      runner's toolchain: a job building another target from the same layer
      cache (the debuginfo stage) passes them too, or misses the build stage's
      layers.
    value: |
      PRESET=${{ inputs.preset }}
      ${{ steps.toolchain.outputs.args }}
  cache-from:
    description: >
      The layer caches the image was built from, which that job reads too.
    value: ${{ steps.cache.outputs.from }}
runs:
  using: composite
  steps:
    # The Linux jobs' vcpkg binaries, which the Dockerfile's dependency install
    # restores from rather than build all its packages from source, when that
    # layer isn't cached already.
    - uses: ./.github/actions/restore-vcpkg-cache
    # The architecture variant the runner's apt takes, and the clang-21 the
    # archive has for it now, as setup-linux-build installs it on the jobs
    # whose vcpkg binaries the build stage restores (Dockerfile says why). The
    # candidate, not what this runner has installed, which can trail it.
    - name: Read the runner's toolchain
      id: toolchain
      shell: bash
      run: |
        eval "$(apt-config shell variants APT::Architecture-Variants)"
        sudo apt-get update -qq
        clang=$(apt-cache policy clang-21 | awk '/Candidate:/ { print $2 }')
        if [ -z "$clang" ] || [ "$clang" = "(none)" ]; then
          echo "::error::The archive has no clang-21 for this runner"
          exit 1
        fi
        echo "Architecture variants: ${variants:-(none)}; clang-21 $clang"
        {
          echo "args<<EOF"
          echo "APT_ARCHITECTURE_VARIANTS=${variants:-}"
          echo "CLANG_VERSION=$clang"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
    - id: short-sha
      shell: bash
      run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
    # The layer cache of the preset's kind, which a push writes. The amd64
    # build reads the other kind's too, written by the other branch's pushes:
    # its layers before the preset's first use (the toolchain, vcpkg's
    # bootstrap) are both kinds' alike, and the PRESET build arg keeps every
    # later one its own kind's. arm64 builds only Shipping, so has one cache.
    - name: Name the layer caches
      id: cache
      shell: bash
      env:
        PRESET: ${{ inputs.preset }}
        ARCH_SUFFIX: ${{ inputs.arch-suffix }}
        REPOSITORY: ghcr.io/${{ github.repository_owner }}/augustad
      run: |
        if [[ "${PRESET}" == linux-shipping ]]; then
          own=buildcache
          other=buildcache-dev
        else
          own=buildcache-dev
          other=buildcache
        fi
        {
          echo "to=type=registry,ref=${REPOSITORY}:${own}${ARCH_SUFFIX},mode=max"
          echo "from<<EOF"
          echo "type=registry,ref=${REPOSITORY}:${own}${ARCH_SUFFIX}"
          if [[ -z "${ARCH_SUFFIX}" ]]; then
            echo "type=registry,ref=${REPOSITORY}:${other}"
          fi
          echo "EOF"
        } >> "${GITHUB_OUTPUT}"
    - name: Build server image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        # Into the runner's Docker, for the scan below - published only once
        # it passes.
        load: true
        # The rootfs stage is rebuilt every time, so the slices chisel cuts are
        # of Ubuntu's current packages, security updates included, rather than
        # a cached layer's (ADR-0054).
        no-cache-filters: rootfs
        # Reported as augustad_build_info's commit label (ADR-0049), the
        # preset the build stage builds with and the toolchain it installs.
        build-args: |
          AUGUSTA_COMMIT=${{ steps.short-sha.outputs.value }}
          PRESET=${{ inputs.preset }}
          ${{ steps.toolchain.outputs.args }}
        # Mounted read-only by the dependency install alone (see Dockerfile).
        build-contexts: vcpkg-bincache=.vcpkg-bincache
        # sha-<first 12 characters of the commit> is the tag the chart runs:
        # Flux versions a Git-sourced chart <version>+<the same 12 characters>.
        tags: ghcr.io/${{ github.repository_owner }}/augustad:sha-${{ steps.short-sha.outputs.value }}${{ inputs.arch-suffix }}
        # A commit that leaves src/ alone reuses the cached build. The layers
        # live in GHCR, next to the image, not in the Actions cache: at several
        # GB they took most of its 10 GB, and GitHub evicted the vcpkg caches
        # every pull request restores from develop. A fork's pull request, not
        # logged in, reads nothing and builds from scratch. Each architecture
        # and each kind of build has its own (the caches step above).
        cache-from: ${{ steps.cache.outputs.from }}
        cache-to: ${{ inputs.cache-to == 'true' && steps.cache.outputs.to || '' }}
    - name: Scan server image
      # Fails on a high or critical CVE that has a fix. A failure here leaves
      # the commit unpublished, and so undeployed: Flux's upgrade times out
      # waiting for its image rather than run a vulnerable one. trivy fetches
      # its vulnerability database each run, so a CVE published since can fail
      # an unchanged commit - as intended.
      shell: bash
      run: >-
        trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 ghcr.io/${{ github.repository_owner }}/augustad:sha-${{ steps.short-sha.outputs.value }}${{ inputs.arch-suffix }}
