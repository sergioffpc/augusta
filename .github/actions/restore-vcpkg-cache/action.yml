name: Restore the vcpkg binary cache
description: >
  Restores into .vcpkg-bincache the newest vcpkg binary cache any Linux job saved (see save-vcpkg-cache), and records what it restored, and under which prefix, for save-vcpkg-cache. The directory exists afterwards even when nothing was restored, so a job can always hand it on.

inputs:
  prefix:
    description: >
      A cache of the job's own, by its key prefix, for a job that installs ports the others don't (the nightly's client-linux, with the manifest's client feature): their saves keep only the packages they installed, so in the shared cache the job's ports would be dropped by the next save. With nothing saved under it yet, the shared x64 cache is restored. Empty for the shared cache. It must not begin with another cache's prefix, which would then restore and prune its entries.

    required: false
    default: ""
runs:
  using: composite
  steps:
    # The key never matches, so the prefix picks the newest
    # entry, this branch's first and then the base branch's. vcpkg names each
    # archive by its package's ABI hash, so an entry holding packages this job
    # doesn't need costs nothing but the download.
    #
    # The ABI hash covers the compiler that built a package and the toolchain
    # file it built through: vcpkg builds its ports with the project's own
    # LLVM toolchain (triplets/, ADR-0008). So every Linux job, and the server
    # image's dependency layer on the same Ubuntu, can share the entry; an
    # archive another compiler built just never matches - as when Ubuntu
    # updates clang and the runner image and the image's cached apt layer
    # hold different builds of it, until both catch up.
    #
    # An arm64 runner's packages (the release's and main's arm64 builds) never
    # match an x64 job's ABI hashes, so they get a prefix of their own:
    # sharing x64's, an arm64 save would be the newest entry every x64 job
    # restores, and miss on.
    - name: Name the vcpkg cache
      id: prefix
      shell: bash
      env:
        OWN_PREFIX: ${{ inputs.prefix }}
      run: |
        if [ -n "$OWN_PREFIX" ]; then
          echo "value=$OWN_PREFIX" >> "$GITHUB_OUTPUT"
          echo "fallback=vcpkg-bincache-linux-clang-" >> "$GITHUB_OUTPUT"
        elif [ "$RUNNER_ARCH" = ARM64 ]; then
          echo "value=vcpkg-bincache-linux-arm64-" >> "$GITHUB_OUTPUT"
        else
          echo "value=vcpkg-bincache-linux-clang-" >> "$GITHUB_OUTPUT"
        fi
    - name: Restore vcpkg binaries
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .vcpkg-bincache
        key: ${{ steps.prefix.outputs.value }}restore-${{ github.run_id }}
        restore-keys: |
          ${{ steps.prefix.outputs.value }}
          ${{ steps.prefix.outputs.fallback }}
    - name: Record the restored vcpkg binaries
      # What save-vcpkg-cache compares against, to save only when this job
      # added a package.
      shell: bash
      run: |
        mkdir -p .vcpkg-bincache
        echo "VCPKG_BINCACHE_RESTORED=$(find .vcpkg-bincache -type f | sort | sha256sum | cut -c1-64)" >> "$GITHUB_ENV"
        echo "VCPKG_BINCACHE_PREFIX=${{ steps.prefix.outputs.value }}" >> "$GITHUB_ENV"
