name: Set up a Linux build
description: >
  Installs the Linux toolchain the presets expect, sets up sccache and restores
  its cache (unless told not to), restores the vcpkg binary cache, and
  bootstraps vcpkg - everything a Linux job needs before `cmake --preset`.
  Assumes the repository is checked out with its submodules and the job sets
  VCPKG_BINARY_SOURCES to the .vcpkg-bincache files provider (see ci.yml's
  server-x64-linux job for why not the NuGet feed). A job saves the vcpkg cache
  with save-vcpkg-cache after it configures, and sccache's with
  save-sccache-cache after it builds.
inputs:
  extra-packages:
    description: >
      Additional apt packages a job needs on top of the build toolchain (e.g.
      clang-tidy).
    required: false
    default: ""
  sccache:
    description: >
      Whether to put sccache on PATH, where the root CMakeLists.txt picks it up
      as the compiler launcher. "false" for CodeQL: a cache hit never runs the
      compiler, so CodeQL's tracer would see nothing to extract.
    required: false
    default: "true"
  sccache-name:
    description: >
      Another job's sccache cache, by its job id, for a job that compiles what
      that one does (see restore-sccache-cache). Empty for this job's own.
    required: false
    default: ""
  vcpkg-cache-prefix:
    description: >
      A vcpkg binary cache of the job's own, by its key prefix (see
      restore-vcpkg-cache), for a job installing ports the others don't. Empty
      for the one every Linux job of the runner's architecture shares.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install build tools
      # The LLVM toolchain the Linux presets and triplets build with, through
      # the Ninja generator (ADR-0008): clang, lld, llvm (its binary tools),
      # libc++, libc++abi, libunwind, whose -dev package Ubuntu names only by
      # the distro clang's major, and compiler-rt (libclang-rt-dev).
      # autoconf/autoconf-archive/automake/libtool: vcpkg's libsodium port
      # builds via autotools on Linux (vcpkg_run_autoreconf) and needs these
      # from the system package manager - not bundled with vcpkg itself.
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y clang lld llvm libc++-dev libc++abi-dev libunwind-21-dev libclang-rt-dev ninja-build autoconf autoconf-archive automake libtool ${{ inputs.extra-packages }}
    - name: Pin vcpkg's tools
      # vcpkg runs the runner image's CMake when it is recent enough, and that
      # CMake's version is part of every package's ABI hash: an image update
      # bumping it (4.4.3 -> 4.4.4) missed every cached package, and while
      # GitHub rolls an image out, jobs on the old and the new one each saved
      # the cache in their own ABIs, so the next job on the other rebuilt them
      # all. vcpkg's own downloads are the versions its submodule pins, the
      # same the server image's dependency layer uses (Dockerfile).
      shell: bash
      run: echo "VCPKG_FORCE_DOWNLOADED_BINARIES=1" >> "$GITHUB_ENV"
    - uses: ./.github/actions/restore-sccache-cache
      if: inputs.sccache == 'true'
      with:
        name: ${{ inputs.sccache-name }}
    - uses: ./.github/actions/restore-vcpkg-cache
      with:
        prefix: ${{ inputs.vcpkg-cache-prefix }}
    - name: Bootstrap vcpkg
      shell: bash
      run: ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics
