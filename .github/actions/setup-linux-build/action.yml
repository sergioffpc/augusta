name: Set up a Linux build
description: >
  Installs the Linux toolchain the presets expect, starts sccache, restores the
  vcpkg binary cache, and bootstraps vcpkg - everything a Linux job needs before
  `cmake --preset`. Assumes the repository is checked out with its submodules
  and the job sets VCPKG_BINARY_SOURCES to the .vcpkg-bincache files provider
  (see ci.yml's build-server for why not the NuGet feed).

inputs:
  extra-packages:
    description: Additional apt packages a job needs on top of the build toolchain (e.g. clang-tidy).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install build tools
      # clang: the Linux presets compile with it (ADR-0008), through the Ninja
      # generator. autoconf/autoconf-archive/automake/libtool: vcpkg's
      # libsodium port builds via autotools on Linux (vcpkg_run_autoreconf) and
      # needs these from the system package manager - not bundled with vcpkg
      # itself.
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y clang ninja-build autoconf autoconf-archive automake libtool ${{ inputs.extra-packages }}

    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

    - name: Cache vcpkg binaries
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .vcpkg-bincache
        key: vcpkg-bincache-${{ hashFiles('vcpkg.json') }}
        restore-keys: |
          vcpkg-bincache-

    - name: Bootstrap vcpkg
      shell: bash
      run: ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics
