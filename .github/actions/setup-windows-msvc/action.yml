name: Set up MSVC on Windows
description: >
  Loads the Visual Studio x64 developer environment for every later step of the
  job, as scripts/vcenv.cmd does for a local build: INCLUDE, LIB and PATH, the
  MSVC STL, the CRT and the Windows SDK that clang-cl and lld-link build against
  (ADR-0008), and the cl.exe vcpkg's ports build with.
runs:
  using: composite
  steps:
    - name: Load the Visual Studio developer environment
      shell: pwsh
      # vcvars64.bat changes only the cmd.exe that runs it, so that cmd.exe
      # prints its environment, and every variable that differs from this
      # step's goes to GITHUB_ENV.
      run: |
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $vsroot = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        if (-not $vsroot) { throw 'No Visual Studio with the x64 C++ tools found.' }
        $vars = cmd /c "`"$vsroot\VC\Auxiliary\Build\vcvars64.bat`" >nul && set"
        if ($LASTEXITCODE -ne 0) { throw 'vcvars64.bat failed.' }
        foreach ($line in $vars) {
          $name, $value = $line -split '=', 2
          if ([Environment]::GetEnvironmentVariable($name) -ne $value) {
            "$name=$value" >> $env:GITHUB_ENV
          }
        }
    # A step of its own, which sees the environment the one above wrote.
    - name: Check the developer environment
      shell: bash
      run: |
        command -v cl.exe
        test -n "$INCLUDE" && test -n "$LIB"
