name: Sign a published artifact
description: >
  Signs an artifact published to GHCR by digest with cosign, keyless (a Fulcio
  certificate for the workflow's GitHub OIDC token, logged in Rekor), and
  verifies the signature at once against the identity the cluster admits it by,
  so a publish the cluster would refuse fails here. ci.yml runs it for each
  augustad image it publishes (container-publish-x64-linux's and
  container-publish-arm64-linux's, through sign-and-attest-server-image, and
  container-index's index of both), which
  clusters/onprem/policies/verify-image-signatures.yaml admits from develop or
  main (ADR-0057), and for develop's chart (chart-publish), which develop's
  OCIRepository (clusters/onprem/apps/sources.yaml) takes from develop alone.
  The job needs id-token: write and packages: write, is logged in to GHCR, and
  has set up the toolchain (setup-toolchain), whose cosign signs: the one
  docs/runbooks/cut-release.md verifies with.
inputs:
  digest:
    description: The artifact's manifest digest, sha256:..., as GHCR serves it.
    required: true
  repository:
    description: The artifact's repository, under the owner's on GHCR.
    default: augustad
  branches:
    description: >
      The branches whose ci.yml the cluster admits the artifact from, as
      alternatives of a regular expression.
    default: develop|main
runs:
  using: composite
  steps:
    - name: Sign the artifact
      shell: bash
      env:
        ARTIFACT: ghcr.io/${{ github.repository_owner }}/${{ inputs.repository }}@${{ inputs.digest }}
      run: cosign sign --yes "$ARTIFACT"
    # The cluster's identity: this workflow on one of those branches. cosign
    # verify also accepts the provenance and SBOM attestations the same
    # workflow pushes beside an image (as Kyverno does), so the output must
    # hold a signature proper, not only those: an artifact this step signed
    # nothing for fails.
    - name: Verify the signature
      shell: bash
      env:
        ARTIFACT: ghcr.io/${{ github.repository_owner }}/${{ inputs.repository }}@${{ inputs.digest }}
        IDENTITY: ^https://github\.com/sergioffpc/augusta/\.github/workflows/ci\.yml@refs/heads/(${{ inputs.branches }})$
      run: |
        cosign verify "$ARTIFACT" \
          --certificate-identity-regexp "$IDENTITY" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          | jq --exit-status 'any(.[]; .critical.type == "https://sigstore.dev/cosign/sign/v1")' >/dev/null
