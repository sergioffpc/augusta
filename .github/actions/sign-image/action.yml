name: Sign the server image
description: >
  Signs a published augustad image by digest with cosign, keyless (a Fulcio certificate for the workflow's GitHub OIDC token, logged in Rekor), and verifies the signature at once against the identity the cluster admits (clusters/onprem/policies/verify-image-signatures.yaml, ADR-0057), so a publish whose image the cluster would refuse fails here. ci.yml runs it for each image it publishes: container-publish's, container-publish-arm64's and container-index's index of both. The job needs id-token: write and packages: write, and is logged in to GHCR.

inputs:
  digest:
    description: The image's manifest digest, sha256:..., as GHCR serves it.
    required: true
runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
    - name: Sign the image
      shell: bash
      env:
        IMAGE: ghcr.io/${{ github.repository_owner }}/augustad@${{ inputs.digest }}
      run: cosign sign --yes "$IMAGE"
    # The policy's identity: this workflow on develop or main. cosign verify
    # also accepts the provenance and SBOM attestations the same workflow
    # pushes (as Kyverno does), so the output must hold a signature proper,
    # not only those: an image this step signed nothing for fails.
    - name: Verify the signature
      shell: bash
      env:
        IMAGE: ghcr.io/${{ github.repository_owner }}/augustad@${{ inputs.digest }}
      run: |
        cosign verify "$IMAGE" \
          --certificate-identity-regexp '^https://github\.com/sergioffpc/augusta/\.github/workflows/ci\.yml@refs/heads/(develop|main)$' \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          | jq --exit-status 'any(.[]; .critical.type == "https://sigstore.dev/cosign/sign/v1")' >/dev/null
