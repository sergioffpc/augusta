name: Cache cleanup
# A pull request's caches are scoped to refs/pull/<n>/merge, which only that
# pull request's own runs can restore: once it closes, merged or not, nothing
# reads them again. A branch's or tag's caches, scoped to its ref, are read by
# nothing once it is deleted. Left to expire, either pushes the caches every
# pull request restores from develop out of the repository's 10 GB.
#
# The delete event runs main's copy of this workflow, whatever branch is
# deleted: a change to it takes effect for deletions once it is on main.
on:
  pull_request:
    types: [closed]
  delete:
permissions:
  actions: write
jobs:
  delete-caches:
    runs-on: ubuntu-26.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # A delete event's ref is the short name; ref_type says which namespace.
      REF: ${{ github.event_name == 'delete' && format('refs/{0}/{1}', github.event.ref_type == 'tag' && 'tags' || 'heads', github.event.ref) || format('refs/pull/{0}/merge', github.event.pull_request.number) }}
    steps:
      - name: Delete the ref's caches
        run: |
          gh cache list --ref "$REF" --limit 1000 --json id --jq '.[].id' | while read -r id; do
            gh cache delete "$id" || echo "::warning::Could not delete cache $id."
          done
