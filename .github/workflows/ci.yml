name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHubPackages,readwrite"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      run_build: ${{ steps.filter.outputs.run_build }}
      run_container: ${{ steps.filter.outputs.run_container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            echo "run_container=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" "${{ github.sha }}")"

          if echo "$changed" \
              | grep -qE '^(src/|tests/|CMakeLists\.txt$|CMakePresets\.json$|vcpkg\.json$|third_party$|\.clang-format$|\.clang-tidy$|\.github/workflows/ci\.yml$)'; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed" \
              | grep -qE '^(Dockerfile$|\.dockerignore$|charts/|\.github/workflows/ci\.yml$)'; then
            echo "run_container=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_container=false" >> "$GITHUB_OUTPUT"
          fi

  format:
    needs: changes
    if: needs.changes.outputs.run_build == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: find src tests \( -name '*.cpp' -o -name '*.h' \) | xargs clang-format --dry-run --Werror

  build-client:
    needs: [changes, format]
    if: needs.changes.outputs.run_build == 'true'
    # Pinned rather than windows-latest, so the toolchain doesn't shift
    # underneath us when GitHub migrates the "latest" runner image.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Ninja
        run: choco install ninja -y
        shell: pwsh

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\third_party\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure vcpkg NuGet cache
        shell: pwsh
        run: |
          $nugetPath = & ".\third_party\vcpkg\vcpkg" fetch nuget | Select-Object -Last 1
          & $nugetPath sources add -Name GitHubPackages -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -Username "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText
          & $nugetPath setapikey "${{ secrets.GITHUB_TOKEN }}" -Source GitHubPackages

      - name: Configure
        run: cmake --preset windows
        shell: pwsh

      - name: Build
        run: cmake --build --preset windows

      - name: Test
        run: ctest --preset windows

  build-server:
    needs: [changes, format]
    if: needs.changes.outputs.run_build == 'true'
    # Pinned rather than ubuntu-latest - see build-client. This also makes
    # clang-tidy's version stable without needing to pull it from
    # apt.llvm.org (a stable runner image already gives a stable distro
    # package version).
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install clang-tidy + mono
        run: sudo apt-get update && sudo apt-get install -y clang-tidy ninja-build mono-complete

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Bootstrap vcpkg
        run: ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure vcpkg NuGet cache
        run: |
          nuget_path=$(./third_party/vcpkg/vcpkg fetch nuget | tail -n 1)
          mono "$nuget_path" sources add -Name GitHubPackages -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -Username "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText
          mono "$nuget_path" setapikey "${{ secrets.GITHUB_TOKEN }}" -Source GitHubPackages

      - name: Configure
        run: cmake --preset linux

      - name: Lint (clang-tidy)
        run: find src -name '*.cpp' | xargs clang-tidy -p build/x64-linux

      - name: Build
        run: cmake --build --preset linux

      - name: Test
        run: ctest --preset linux

  sanitizers:
    needs: [changes, format]
    if: needs.changes.outputs.run_build == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install mono
        run: sudo apt-get update && sudo apt-get install -y mono-complete

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Bootstrap vcpkg
        run: ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure vcpkg NuGet cache
        run: |
          nuget_path=$(./third_party/vcpkg/vcpkg fetch nuget | tail -n 1)
          mono "$nuget_path" sources add -Name GitHubPackages -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -Username "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText

      - name: Configure (ASan + UBSan)
        run: cmake --preset linux-san

      - name: Build
        run: cmake --build --preset linux-san

      - name: Test
        run: ctest --preset linux-san

  container:
    needs: changes
    if: needs.changes.outputs.run_container == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint Helm chart
        run: helm lint charts/augustad

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Only main/develop pushes publish - PRs (including from forks) just
      # validate that the image builds, same reasoning as ADR-0026's decision
      # to keep this pipeline off a self-hosted runner.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          # github.ref_name is only a plain branch name (safe as a Docker
          # tag) on push - for pull_request it's "<pr-number>/merge", which
          # contains a "/" and Docker rejects as a tag.
          tags: ghcr.io/${{ github.repository_owner }}/augustad:${{ github.event_name == 'push' && github.ref_name || github.sha }}
