name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
# A pull request's newer push cancels its older run. A push to main/develop gets
# a group per commit, so a newer push neither cancels it nor replaces it while
# it is pending: Flux deploys every one of those commits (docs/ENGINEERING.md).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
  # Deleting superseded cache entries (.github/actions/prune-cache).
  actions: write
env:
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHubPackages,readwrite"
jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      run_build: ${{ steps.filter.outputs.run_build }}
      run_container: ${{ steps.filter.outputs.run_container }}
      run_manifests: ${{ steps.filter.outputs.run_manifests }}
      run_tools: ${{ steps.filter.outputs.run_tools }}
      run_yaml: ${{ steps.filter.outputs.run_yaml }}
      run_lua: ${{ steps.filter.outputs.run_lua }}
      run_toml: ${{ steps.filter.outputs.run_toml }}
      run_lint: ${{ steps.filter.outputs.run_lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            {
              echo "run_build=true"
              echo "run_container=true"
              echo "run_manifests=true"
              echo "run_tools=true"
              echo "run_yaml=true"
              echo "run_lua=true"
              echo "run_toml=true"
              echo "run_lint=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" "${{ github.sha }}")"

          # Writes "<output>=true" when a changed path matches the extended
          # regex, "<output>=false" otherwise.
          set_output() {
            local -r output="${1}"
            local -r regex="${2}"
            if echo "${changed}" | grep -qE "${regex}"; then
              echo "${output}=true" >> "${GITHUB_OUTPUT}"
            else
              echo "${output}=false" >> "${GITHUB_OUTPUT}"
            fi
          }

          # The paths more than one output matches, each written only here.
          ci_workflow='\.github/workflows/ci\.yml$'
          tools_project='tools/(pyproject\.toml|uv\.lock)$'
          charts='charts/'
          # The server and what builds its image.
          server='src/|cmake/|CMakeLists\.txt$|CMakePresets\.json$|vcpkg\.json$|third_party/|scripts/augustad-seccomp\.sh$|clusters/onprem/node/augustad-seccomp\.json$|Dockerfile$|\.dockerignore$|chisel/'

          set_output run_build \
            "^(${server}|tests/|tools/agent/|tools/composer/examples/|tools/pack/native/|${tools_project}|config/|\.clang-format$|\.clang-tidy$|${ci_workflow}|\.github/actions/)"

          set_output run_container \
            "^(${server}|\.hadolint\.yaml$|${charts}|${ci_workflow}|\.github/actions/(build-server-image|restore-vcpkg-cache)/)"

          # What Flux applies to the cluster: its own manifests, the chart the
          # HelmReleases there install, and the Kyverno policies (and their
          # negative fixtures) both are checked against, all under clusters/;
          # and the k3s release they run on.
          set_output run_manifests \
            "^(${charts}|clusters/|scripts/bootstrap-node\.sh$|${ci_workflow})"

          # The offline tools (tools/pack, tools/composer), and the golden
          # output of theirs the runtime's tests load, which the tools job checks
          # they still write; and the node's end of augusta-publish, which its
          # tests run. tools/docs is the docs workflow's, not theirs.
          set_output run_tools \
            "^(tools/(pack|composer)/|${tools_project}|tests/fixtures/example-packs/|clusters/onprem/node/augusta-publish-receive\.sh$|${ci_workflow})"

          set_output run_yaml \
            '(^\.(yamlfmt|yamllint|yamlignore|gitignore)$|(^|/)[^/]+\.ya?ml$)'

          # The scenarios' Lua scripts, and the rules they are formatted and
          # linted by.
          set_output run_lua \
            "(\.lua$|^(stylua\.toml$|\.luacheckrc$|${ci_workflow}))"

          set_output run_toml "(\.toml$|^${ci_workflow})"

          # Python, shell, Markdown, CMake and the workflows, and
          # the rules each is formatted and linted by.
          set_output run_lint \
            '(\.(py|sh|md|cmake)$|(^|/)CMakeLists\.txt$|^\.githooks/|^\.github/workflows/|^\.github/actionlint\.yaml$|^(ruff\.toml|\.shellcheckrc|\.gersemirc|\.pymarkdown\.json|\.prettierrc\.yaml|\.editorconfig)$)'
  format:
    needs: changes
    if: >-
      needs.changes.outputs.run_build == 'true' || needs.changes.outputs.run_yaml == 'true' || needs.changes.outputs.run_lua == 'true' || needs.changes.outputs.run_toml == 'true' || needs.changes.outputs.run_lint == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: needs.changes.outputs.run_yaml == 'true' || needs.changes.outputs.run_lint == 'true'
        with:
          enable-cache: true
      - name: Install yamlfmt
        if: needs.changes.outputs.run_yaml == 'true'
        shell: bash
        run: |
          version=0.21.0
          asset="yamlfmt_${version}_Linux_x86_64.tar.gz"
          install_dir="$RUNNER_TEMP/yamlfmt"
          mkdir -p "$install_dir"
          curl -fsSLo "$install_dir/$asset" "https://github.com/google/yamlfmt/releases/download/v${version}/$asset"
          printf '%s  %s\n' \
            '1f300d9257b232bb3b541d7fb1b0e6b3c121bcbab381c86cd38cb8722be8a566' \
            "$install_dir/$asset" | sha256sum --check --status
          tar -xzf "$install_dir/$asset" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Install clang-format
        if: needs.changes.outputs.run_build == 'true'
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check C++ formatting
        if: needs.changes.outputs.run_build == 'true'
        run: find src tests tools \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Check the tests' requirement markers
        # Every requirement a test names is one docs/REQUIREMENTS.md has, and
        # every marker is directly above a test (ADR-0013).
        if: needs.changes.outputs.run_build == 'true' || needs.changes.outputs.run_lint == 'true'
        run: python3 scripts/requirements-matrix.py --check
      - name: Check YAML formatting and lint
        if: needs.changes.outputs.run_yaml == 'true'
        run: |
          yamlfmt -conf .yamlfmt -lint
          uv tool run --from yamllint==1.37.1 yamllint --strict -c .yamllint .
      - name: Install StyLua and luacheck
        if: needs.changes.outputs.run_lua == 'true'
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/lua-tools"
          mkdir -p "$install_dir"
          curl -fsSLo "$install_dir/stylua.zip" \
            https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          curl -fsSLo "$install_dir/luacheck" \
            https://github.com/lunarmodules/luacheck/releases/download/v1.2.0/luacheck
          printf '%s  %s\n' \
            'bcb0d855e91f102f28a370e850f8566b3b44b79e6274d806ea5246837c0fd5ab' "$install_dir/stylua.zip" \
            'd68da17fca0697d9e2fb04201f3884abd259fa558b3a449bccaed47f1390defc' "$install_dir/luacheck" \
            | sha256sum --check --status
          unzip -q "$install_dir/stylua.zip" -d "$install_dir"
          chmod +x "$install_dir/stylua" "$install_dir/luacheck"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Check Lua formatting and lint
        if: needs.changes.outputs.run_lua == 'true'
        run: |
          git ls-files -z -- '*.lua' | xargs -0 stylua --check
          git ls-files -z -- '*.lua' | xargs -0 luacheck
      - name: Install taplo
        if: needs.changes.outputs.run_toml == 'true'
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/taplo"
          mkdir -p "$install_dir"
          curl -fsSLo "$install_dir/taplo.gz" \
            https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz
          printf '%s  %s\n' '8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156' "$install_dir/taplo.gz" \
            | sha256sum --check --status
          gunzip "$install_dir/taplo.gz"
          chmod +x "$install_dir/taplo"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Check TOML formatting and lint
        if: needs.changes.outputs.run_toml == 'true'
        run: |
          git ls-files -z -- '*.toml' ':!:third_party/*' | xargs -0 taplo fmt --check
          git ls-files -z -- '*.toml' ':!:third_party/*' | xargs -0 taplo lint
      # uv runs the rest at pinned versions, as the Makefile's format-check and
      # the git hooks do.
      - name: Check Python formatting and lint
        if: needs.changes.outputs.run_lint == 'true'
        run: |
          git ls-files -z -- '*.py' ':!:third_party/*' | xargs -0 uv tool run ruff@0.16.10 format --check
          git ls-files -z -- '*.py' ':!:third_party/*' | xargs -0 uv tool run ruff@0.16.10 check
      - name: Check shell formatting and lint
        if: needs.changes.outputs.run_lint == 'true'
        run: |
          git ls-files -z -- '*.sh' '.githooks/*' | xargs -0 uv tool run --from shfmt-py==4.2.0 shfmt -d
          git ls-files -z -- '*.sh' '.githooks/*' | xargs -0 uv tool run --from shellcheck-py==0.11.0.1 shellcheck
      - name: Lint the workflows
        if: needs.changes.outputs.run_lint == 'true'
        run: uv tool run --from actionlint-py==1.7.12.25 --with shellcheck-py==0.11.0.1 actionlint
      - name: Check CMake formatting
        if: needs.changes.outputs.run_lint == 'true'
        run: |
          git ls-files -z -- 'CMakeLists.txt' '*/CMakeLists.txt' '*.cmake' ':!:third_party/*' \
            | xargs -0 uv tool run gersemi@0.29.2 --check
      - name: Check Markdown formatting and lint
        if: needs.changes.outputs.run_lint == 'true'
        run: |
          git ls-files -z -- '*.md' ':!:third_party/*' ':!:CHANGELOG.md' \
            | xargs -0 uv tool run --from nodejs-wheel==24.19.0 npx --yes prettier@3.9.9 --log-level warn --check
          git ls-files -z -- '*.md' ':!:third_party/*' ':!:CHANGELOG.md' \
            | xargs -0 uv tool run --from pymarkdownlnt==0.9.40 pymarkdown --config .pymarkdown.json scan
  client-x64-windows:
    needs: [changes, format]
    if: needs.changes.outputs.run_build == 'true'
    # Pinned rather than windows-latest, so the toolchain doesn't shift
    # underneath us when GitHub migrates the "latest" runner image.
    runs-on: windows-2025
    # Git Bash, as everywhere else: no PowerShell in the repository.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the submodules
        # vcpkg and NVTX, the only submodules.
        run: git submodule update --init --depth 1 third_party/vcpkg third_party/nvtx
      - uses: ./.github/actions/setup-windows-msvc
      # clang-cl and lld-link, which the windows preset builds with (ADR-0008),
      # and the clang-tidy the Lint step runs.
      - uses: ./.github/actions/setup-windows-llvm
      - uses: ./.github/actions/restore-sccache-cache
      - uses: ./.github/actions/setup-windows-vcpkg
        with:
          feed-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: ./.github/actions/restore-ctcache-cache
      - name: Install the Agents' package
        # The interpreter the Agents' module is built against, and pytest: the
        # agent group alone, not the cooker's USD tooling.
        working-directory: tools
        run: uv sync --locked --no-default-groups --group agent
      - name: Configure
        # PYTHON_EXECUTABLE named, so a sync that left no interpreter stops the
        # configure instead of leaving the module out (cmake/AugustaAgentPython.cmake).
        # AUGUSTA_LAVAPIPE: the renderer smoke test's software Vulkan, which a
        # release's build leaves out (CMakeLists.txt).
        run: cmake --preset windows -DAUGUSTA_LAVAPIPE=ON "-DPYTHON_EXECUTABLE=$(cygpath -m "$PWD/tools/.venv/Scripts/python.exe")"
      - name: Build
        # all includes augustad: this job is the build matrix's Windows x64
        # server, the development-only one (NFR-04, cmake/AugustaPlatform.cmake).
        run: cmake --build --preset windows --target all augusta_tests
      - uses: ./.github/actions/save-sccache-cache
      - name: Check augustac's PDB
        # Each release publishes it (ADR-0055): the build leaves it beside
        # augustac.exe, whose debug directory names it. -headers rather than
        # /headers, which Git Bash would rewrite as a path.
        run: |
          test -f build/x64-windows/src/client/augustac.pdb
          dumpbin -nologo -headers build/x64-windows/src/client/augustac.exe | grep -E 'Format: RSDS, .*augustac\.pdb'
      - name: Check the client's zip
        # What each release publishes (release.yml): the folder the client's
        # install rules stage, zipped, with augustac started from its unzipped
        # copy alone. Checked here so a DLL the rules miss fails the pull
        # request that adds it, not the release.
        run: scripts/stage-client.sh build/x64-windows "$RUNNER_TEMP/augustac" "$RUNNER_TEMP/augustac-windows-x64.zip"
      - name: Check the client's SBOM
        # release.yml's SBOM of that folder, and the CPEs nightly-jobs.yml's
        # sbom-scan adds to it: a dependency the build gains with neither a
        # CPE nor a reason fails here rather than the release.
        run: |
          python scripts/vcpkg-sbom.py --name augustac --version "$GITHUB_SHA" \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --git-package third_party/nvtx \
            --msvc-runtime "$RUNNER_TEMP/augustac/bin/vcruntime140.dll" \
            build/x64-windows/vcpkg_installed/x64-windows > "$RUNNER_TEMP/augustac.spdx.json"
          python scripts/sbom-cpes.py "$RUNNER_TEMP/augustac.spdx.json" > /dev/null
      - name: Lint
        id: lint
        # What the server-x64-linux job's Linux build can't lint, as it builds
        # without the client. The client, the Renderer and their tests get
        # .clang-tidy's full profile, from clang-cl's compile commands
        # (tests/.clang-tidy leaves the tests' literals alone); the audio
        # module's output device gets misc-include-cleaner alone (the
        # Makefile's tidy target says why -w). Both run, and the step fails if
        # either does. One file per clang-tidy, as server-x64-linux runs it,
        # through ctcache (restore-ctcache-cache). After Build, which generates
        # the headers the renderer embeds its shaders and font from.
        run: |
          status=0
          git ls-files 'src/client/*.cpp' 'src/modules/renderer/*.cpp' 'tests/client_*.cpp' 'tests/renderer_*.cpp' | xargs -P "$NUMBER_OF_PROCESSORS" -n 1 clang-tidy-cache clang-tidy --quiet -p=build/x64-windows || status=1
          git ls-files 'src/modules/audio/output_miniaudio.cpp' 'src/modules/audio/miniaudio.cpp' | xargs -P "$NUMBER_OF_PROCESSORS" -n 1 clang-tidy-cache clang-tidy --quiet -p=build/x64-windows --checks=-*,misc-include-cleaner --extra-arg=-w || status=1
          exit "$status"
      - uses: ./.github/actions/save-ctcache-cache
        if: ${{ !cancelled() && (steps.lint.outcome == 'success' || steps.lint.outcome == 'failure') }}
      - name: Register lavapipe and the validation layer
        # The Vulkan loader ignores the smoke test's VK_DRIVER_FILES and
        # VK_ADD_LAYER_PATH in an elevated process, which the runner's are, so
        # they're registered as an installed driver and layer would be: the
        # test's copy of lavapipe's manifest (tests/CMakeLists.txt) and vcpkg's
        # layer. MSYS_NO_PATHCONV: Git Bash would otherwise take reg's /v, /t,
        # /d and /f for paths.
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          driver=build/x64-windows/tests/lvp_icd.json
          layer=build/x64-windows/vcpkg_installed/x64-windows/bin/VkLayer_khronos_validation.json
          test -f "$driver"
          test -f "$layer"
          reg add 'HKLM\SOFTWARE\Khronos\Vulkan\Drivers' /v "$(cygpath -wa "$driver")" /t REG_DWORD /d 0 /f
          reg add 'HKLM\SOFTWARE\Khronos\Vulkan\ExplicitLayers' /v "$(cygpath -wa "$layer")" /t REG_DWORD /d 0 /f
      - name: Test
        # The renderer smoke test among them, on lavapipe and under the
        # validation layer, both from vcpkg, as is the Vulkan loader the
        # runner, with no GPU driver, lacks: the test's ctest environment
        # puts the loader on PATH (tests/CMakeLists.txt, ADR-0059). One test
        # per core, as on Linux (docs/ENGINEERING.md).
        run: ctest --preset windows --parallel "$NUMBER_OF_PROCESSORS"
      - name: Test the Agents' package (pytest)
        working-directory: tools/agent
        run: uv run --locked --no-default-groups --group agent pytest
  server-x64-linux:
    needs: [changes, format]
    if: needs.changes.outputs.run_build == 'true'
    # Pinned rather than ubuntu-latest - see the client-x64-windows job. This
    # also makes clang-tidy's version stable without needing to pull it from
    # apt.llvm.org (a stable runner image already gives a stable distro package
    # version).
    runs-on: ubuntu-26.04
    # Overrides the workflow-level NuGet/GitHubPackages default (Windows-only,
    # see the client-x64-windows job): that path runs nuget.exe under Mono here,
    # and Mono's own bundled cert store is untrusted-by-default on a fresh
    # runner image, failing every restore/push with CERTIFICATE_VERIFY_FAILED
    # (silently - vcpkg just rebuilds from source instead of erroring). x-gha
    # (GitHub Actions' own cache backend for vcpkg) would have sidestepped Mono
    # entirely, but it was removed upstream (microsoft/vcpkg-tool#1662);
    # actions/cache over the local files provider is GitHub Actions' own
    # recommended replacement.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/setup-linux-build
        with:
          # The same distro version as the clang the presets compile with.
          extra-packages: clang-tidy
          # It installs the Agents' ports (the manifest's agent feature:
          # pybind11 and Python), which no other Linux job does and whose saves
          # would drop: a cache of its own.
          vcpkg-cache-prefix: vcpkg-bincache-agent-linux-
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: ./.github/actions/restore-ctcache-cache
      - name: Install the Agents' package
        # As the client-x64-windows job does.
        working-directory: tools
        run: uv sync --locked --no-default-groups --group agent
      - name: Configure
        # Without the client: pull requests build and test it on Windows alone,
        # and the Linux client is the nightly's (nightly-jobs.yml,
        # client-x64-linux).
        run: cmake --preset linux -DAUGUSTA_CLIENT=OFF "-DPYTHON_EXECUTABLE=$PWD/tools/.venv/bin/python"
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Lint
        id: lint
        # Both checks run, and the step fails if either does, so one run shows
        # every finding. clang-tidy with .clang-tidy's full profile on src:
        # src/client and the renderer's GPU half build only with the client
        # (AUGUSTA_CLIENT), which this job leaves off, as does the audio
        # module's output device (miniaudio and Steam Audio, built only with
        # AUGUSTA_AUDIO_OUTPUT, which follows it -
        # src/modules/audio/CMakeLists.txt), and aren't part of this configure's build graph
        # at all, so they have no compile_commands.json entry here - excluded
        # rather than linted against the wrong platform's (missing) compile
        # flags. The renderer's vertices.cpp builds here but is skipped too:
        # the client job lints the whole Renderer, from its own build.
        # One file per clang-tidy, on every core: a serial run over the
        # whole list took most of the job. One file per invocation also
        # keeps a stray Windows-only file to its own error, where a multi-file
        # invocation cascades it onto every file after it, and is what ctcache
        # (restore-ctcache-cache), which every clang-tidy runs through, needs:
        # it hashes a multi-file invocation's first file's source alone.
        # The C++ tools (tools/agent) are built with them, so
        # linted alike, and their tests like the runtime's.
        # Then the tests get .clang-tidy's misc-include-cleaner alone, as the
        # Makefile's tidy target runs it (which says why -w); the client tests
        # are the client-x64-windows job's.
        run: |
          status=0
          find src tools/agent -name '*.cpp' -not -path 'tools/*/tests/*' -not -path 'src/client/*' -not -path 'src/modules/renderer/*' -not -path 'src/modules/audio/output_miniaudio.cpp' -not -path 'src/modules/audio/miniaudio.cpp' -print0 | xargs -0 -P "$(nproc)" -n 1 clang-tidy-cache clang-tidy -p build/x64-linux || status=1
          git ls-files 'tests/*.cpp' 'tools/agent/tests/*.cpp' ':!:tests/client_*' | xargs -P "$(nproc)" -n 1 clang-tidy-cache clang-tidy --quiet -p build/x64-linux --checks=-*,misc-include-cleaner --extra-arg=-w || status=1
          exit "$status"
      - uses: ./.github/actions/save-ctcache-cache
        if: ${{ !cancelled() && (steps.lint.outcome == 'success' || steps.lint.outcome == 'failure') }}
      - name: Build
        # all includes augustad: this job is the build matrix's Linux x86-64
        # server, the production one (NFR-04, cmake/AugustaPlatform.cmake).
        run: cmake --build --preset linux --target all augusta_tests
      - uses: ./.github/actions/save-sccache-cache
      - name: Test
        run: ctest --preset linux --parallel "$(nproc)"
      - name: Test the Agents' package (pytest)
        working-directory: tools/agent
        run: uv run --locked --no-default-groups --group agent pytest
      - name: Upload the Agents' native module
        # For the confinement job's Agents, built here with the rest.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agents-native
          path: tools/agent/src/augusta_agent/_native*.so
          retention-days: 1
  tools:
    needs: changes
    if: needs.changes.outputs.run_tools == 'true'
    # Builds and tests the offline tools (tools/), including that each still
    # writes the golden output the runtime's tests load (ADR-0013). A new
    # tool adds steps here, not a job. Windows, where the content authors cook,
    # and Linux, the asset cooker's other platform (tools/README.md): the same
    # pytest suite, golden packs included - a cook gives the same bytes on
    # either platform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            preset: windows
            python: tools/.venv/Scripts/python.exe
          - os: ubuntu-26.04
            preset: linux
            python: tools/.venv/bin/python
    runs-on: ${{ matrix.os }}
    # Git Bash on Windows, as everywhere else: no PowerShell in the repository.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Fetch vcpkg
        # Only vcpkg: the native module builds against no other submodule.
        run: git submodule update --init --depth 1 third_party/vcpkg
      - uses: ./.github/actions/setup-windows-msvc
        if: runner.os == 'Windows'
      - name: Install build tools
        if: runner.os == 'Linux'
        # The LLVM toolchain the linux preset and triplets build with, as
        # setup-linux-build installs it. autoconf/autoconf-archive/
        # automake/libtool: vcpkg's python3 port (pybind11's dependency) builds
        # via autotools on Linux.
        run: sudo apt-get update && sudo apt-get install -y clang-21 clang lld llvm libc++-dev libc++abi-dev libunwind-21-dev libclang-rt-dev ninja-build autoconf autoconf-archive automake libtool
      - uses: ./.github/actions/restore-sccache-cache
      - uses: ./.github/actions/setup-windows-vcpkg
        if: runner.os == 'Windows'
        with:
          feed-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Use a local vcpkg binary cache
        if: runner.os == 'Linux'
        # The local files provider, as the server-x64-linux job does (see there
        # why not the NuGet feed) - but a cache of its own, not
        # setup-linux-build's: tools/pack/native's manifest isn't the root one
        # every job sharing that cache installs, and save-vcpkg-cache drops
        # whatever the root build didn't install. vcpkg's tools pinned as
        # setup-linux-build pins them, for the same reason.
        run: |
          {
            echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/.vcpkg-bincache,readwrite"
            echo "VCPKG_FORCE_DOWNLOADED_BINARIES=1"
            echo "VCPKG_CACHE_KEY=vcpkg-bincache-pack-linux-clang-$(git rev-parse HEAD:third_party/vcpkg)-${{ hashFiles('tools/pack/native/vcpkg.json') }}"
          } >> "$GITHUB_ENV"
      - name: Restore and save vcpkg binaries
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-bincache
          key: ${{ env.VCPKG_CACHE_KEY }}
      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - name: Install the cooker
        working-directory: tools
        run: uv sync --locked
      - name: Build the native module
        # Into tools/pack/src/augusta_pack, against the venv's own interpreter,
        # as tools/pack/scripts/bootstrap.sh does - a mixed-slash path from
        # cygpath on Windows, as is on Linux.
        run: |
          python="$PWD/${{ matrix.python }}"
          [[ "$RUNNER_OS" == Windows ]] && python="$(cygpath -m "$python")"
          cmake --preset ${{ matrix.preset }} -S tools/pack/native "-DPYTHON_EXECUTABLE=$python"
          cmake --build tools/pack/native/build/x64-${{ matrix.preset }}
      - uses: ./.github/actions/save-sccache-cache
      - name: Test (pytest)
        working-directory: tools/pack
        run: uv run pytest
  sanitizers:
    needs: [changes, format]
    if: needs.changes.outputs.run_build == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    # See the server-x64-linux job's env override for why this isn't the
    # workflow-level NuGet default.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/setup-linux-build
      - name: Configure (ASan + UBSan)
        # Without the client, as the server-x64-linux job (which says why).
        run: cmake --preset linux-san -DAUGUSTA_CLIENT=OFF
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux-san --target all augusta_tests
      - uses: ./.github/actions/save-sccache-cache
      - name: Test
        run: ctest --preset linux-san --parallel "$(nproc)"
  fuzz:
    # A short run per fuzz target (ADR-0013): long enough to catch an obvious
    # crash before merge. The long runs, over a corpus kept between them, are
    # the nightly's. tests/fuzz/README.md has what a crash becomes.
    needs: [changes, format]
    if: needs.changes.outputs.run_build == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    # See the server-x64-linux job's env override for why this isn't the
    # workflow-level NuGet default.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # libFuzzer ships with the clang package this installs.
      - uses: ./.github/actions/setup-linux-build
      - name: Configure (libFuzzer + ASan)
        # Without the client, as the server-x64-linux job (which says why).
        run: cmake --preset linux-fuzz -DAUGUSTA_CLIENT=OFF
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux-fuzz --target all augusta_tests
      # Pull requests alone run this job, so no develop entry exists: a pull
      # request's first run restores the nightly's fuzz job's, of the same job
      # id and preset, from main.
      - uses: ./.github/actions/save-sccache-cache
      - name: Fuzz
        # Each target in turn (tests/fuzz/README.md). New inputs go to a scratch
        # directory, never into the committed seeds; a crash lands in
        # fuzz-crashes/ and fails the step, after the other targets have run.
        run: |
          mkdir -p fuzz-crashes
          status=0
          for target in protocol_decode capture_read pack_load; do
            mkdir -p "fuzz-corpus/$target"
            "build/x64-linux-fuzz/tests/fuzz/augusta_${target}_fuzz" \
              -max_total_time=60 -timeout=5 -artifact_prefix="fuzz-crashes/$target-" \
              "fuzz-corpus/$target" "tests/fuzz/corpus/$target" || status=1
          done
          exit "$status"
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz-crashes/
          if-no-files-found: ignore
  manifests:
    # What Flux applies, against the schemas of the Kubernetes version the
    # cluster runs (k3s, bumped with it): helm lint checks the chart's
    # templating, not what it renders. Flux's own resources are checked
    # against the CRDs gotk-components.yaml installs, so a Flux upgrade
    # brings its schemas with it. Then the cluster's Kyverno policies run over
    # all of it (ADR-0057). kubectl and yq come with the runner image.
    needs: changes
    if: needs.changes.outputs.run_manifests == 'true'
    runs-on: ubuntu-26.04
    env:
      KUBERNETES_VERSION: 1.36.4
      # The Kyverno CLI's stand-in for the cluster's NetworkPolicies, which a
      # policy looks up (clusters/onprem/policies): those of the manifests
      # yq reads.
      NETWORK_POLICIES_CONTEXT: |-
        [select(.kind == "NetworkPolicy")]
        | {"apiVersion": "cli.kyverno.io/v1alpha1", "kind": "Context",
           "metadata": {"name": "network-policies"}, "spec": {"resources": .}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the cluster's k3s release
        # The Node's k3s (K3S_VERSION, scripts/bootstrap-node.sh) runs the
        # Kubernetes version the manifests are validated against.
        run: |
          k3s=$(sed -n 's/^readonly K3S_VERSION=v\([^+]*\)+k3s[0-9]*$/\1/p' scripts/bootstrap-node.sh)
          if [ "$k3s" != "$KUBERNETES_VERSION" ]; then
            echo "::error file=scripts/bootstrap-node.sh::K3S_VERSION runs Kubernetes ${k3s:-(not found)}, not KUBERNETES_VERSION's $KUBERNETES_VERSION"
            exit 1
          fi
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install kubeconform
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/kubeconform"
          mkdir -p "$install_dir"
          curl -fsSLo "$install_dir/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          curl -fsSLo "$install_dir/openapi2jsonschema.py" \
            https://raw.githubusercontent.com/yannh/kubeconform/v0.8.0/scripts/openapi2jsonschema.py
          printf '%s  %s\n' \
            '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883' "$install_dir/kubeconform.tar.gz" \
            'd145babfbb765004030764e1b4e518bfb7a4bd7f111691a08fa57983b81881f3' "$install_dir/openapi2jsonschema.py" \
            | sha256sum --check --status
          tar -xzf "$install_dir/kubeconform.tar.gz" -C "$install_dir" kubeconform
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Install the Kyverno CLI
        # The release of the Kyverno the cluster runs
        # (clusters/onprem/infrastructure/kyverno.yaml), bumped with it.
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/kyverno"
          mkdir -p "$install_dir"
          curl -fsSLo "$install_dir/kyverno.tar.gz" \
            https://github.com/kyverno/kyverno/releases/download/v1.19.1/kyverno-cli_v1.19.1_linux_x86_64.tar.gz
          printf '%s  %s\n' \
            'b38228f367fc0fdc2b08f4c83ea50ac5f16c60ff8d62d76a66157c33c47b70ae' "$install_dir/kyverno.tar.gz" \
            | sha256sum --check --status
          tar -xzf "$install_dir/kyverno.tar.gz" -C "$install_dir" kyverno
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Validate the chart, rendered per environment
        # With each HelmRelease's own values, as Flux renders it, and with the
        # chart of the ref its source follows: develop's branch (the chart CI
        # publishes from it), or staging's latest release tag (ADR-0056), whose
        # chart's values can trail develop's until the next release. The
        # branch this run's commit lands on (the pull request's base, or the
        # pushed branch) is checked out already; any other ref is fetched. staging's tag is the newest
        # vX.Y.Z by version, as Flux's semver "*" picks it (no pre-releases);
        # Flux would also take a tag spelt otherwise (1.2.3, v1.3), which
        # releases never are (cut-release.md).
        # bash for pipefail - a render that fails leaves kubeconform nothing
        # to reject.
        # Its ServiceMonitor and PrometheusRule are checked against the CRDs
        # of the kube-prometheus-stack version the cluster installs
        # (clusters/onprem/infrastructure), so a stack upgrade brings its
        # schemas with it. Each render is kept, in its HelmRelease's
        # targetNamespace as Flux applies it, for the policy check below.
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The file holds other releases (Loki, Alloy): pick the stack's by
          # name, and its repository by the release's sourceRef.
          stack=clusters/onprem/infrastructure/monitoring.yaml
          stack_release='select(.kind == "HelmRelease" and .metadata.name == "kube-prometheus-stack")'
          repo=$(yq --no-doc "$stack_release | .spec.chart.spec.sourceRef.name" "$stack")
          schemas="$RUNNER_TEMP/monitoring-crd-schemas"
          mkdir -p "$schemas"
          helm show crds kube-prometheus-stack \
            --repo "$(yq --no-doc "select(.kind == \"HelmRepository\" and .metadata.name == \"$repo\") | .spec.url" "$stack")" \
            --version "$(yq --no-doc "$stack_release | .spec.chart.spec.version" "$stack")" \
            > "$schemas/crds.yaml"
          (cd "$schemas" && FILENAME_FORMAT='{fullgroup}_{kind}_{version}' \
            uv run --no-project --with pyyaml python "$RUNNER_TEMP/kubeconform/openapi2jsonschema.py" \
            crds.yaml >/dev/null)
          mkdir -p "$RUNNER_TEMP/rendered"
          for release in clusters/onprem/apps/*.yaml; do
            grep -q '^kind: HelmRelease$' "$release" || continue
            source=$(yq '.spec.chartRef.name // .spec.chart.spec.sourceRef.name' "$release")
            ref=$(yq --no-doc "select(.metadata.name == \"$source\") | .spec.ref.branch // .spec.ref.tag // \"\"" clusters/onprem/apps/sources.yaml)
            # develop's OCIRepository follows the chart chart-publish pushed
            # for that branch's newest commit, under the tag develop, or a
            # rollback pins the tag <version>_<12> of an older commit's,
            # fetched by its full hash.
            if [[ "$ref" =~ _([0-9a-f]{12})$ ]]; then
              ref=$(gh api "repos/$GITHUB_REPOSITORY/commits/${BASH_REMATCH[1]}" --jq .sha)
            fi
            if [ -z "$ref" ]; then
              ref=$(git ls-remote --tags --refs origin 'v*' | sed 's|.*refs/tags/||' \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            fi
            chart=charts/augustad
            if [ "$ref" != "$TARGET_BRANCH" ]; then
              tree="$RUNNER_TEMP/refs/$ref"
              mkdir -p "$tree"
              git fetch --quiet --depth=1 origin "$ref"
              git archive FETCH_HEAD charts/augustad | tar -x -C "$tree"
              chart="$tree/charts/augustad"
            fi
            echo "$release, with $ref's chart"
            namespace=$(yq '.spec.targetNamespace' "$release")
            rendered="$RUNNER_TEMP/rendered/$namespace.yaml"
            yq '.spec.values' "$release" \
              | helm template augustad "$chart" --namespace "$namespace" --values - \
              | yq "(select(.kind != null) | .metadata.namespace) = \"$namespace\"" \
              > "$rendered"
            kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
              -schema-location default -schema-location "$schemas/{{.Group}}_{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
              "$rendered"
          done
      - name: Validate the dashboards
        # The chart's and the cluster's own (clusters/onprem/infrastructure).
        # Grafana's sidecar skips a dashboard it cannot parse without failing
        # anything, and kubeconform sees only the string it is carried in.
        run: jq empty charts/augustad/dashboards/*.json clusters/onprem/infrastructure/dashboards/*.json
      - name: Validate the cluster's Loki rules
        # Loki's ruler skips a rule file it cannot parse, and kubeconform
        # sees only the string it is carried in: each ConfigMap labelled
        # loki_rule in clusters/onprem/infrastructure (security-alerts.yaml)
        # is parsed with the LogQL of the Loki release the cluster runs
        # (monitoring.yaml there), bumped with it.
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/lokitool"
          mkdir -p "$install_dir"
          curl -fsSLo "$install_dir/lokitool.zip" \
            https://github.com/grafana/loki/releases/download/v3.6.11/lokitool-linux-amd64.zip
          printf '%s  %s\n' \
            '1424b486b2fc1a4fad1de84aa2ad5cda86896da08d5c6be97a210f8f3b22b50e' "$install_dir/lokitool.zip" \
            | sha256sum --check --status
          unzip -q "$install_dir/lokitool.zip" -d "$install_dir"
          rules="$RUNNER_TEMP/loki-rules"
          mkdir -p "$rules"
          rule_maps='select(.kind == "ConfigMap" and .metadata.labels.loki_rule != null)'
          for file in clusters/onprem/infrastructure/*.yaml; do
            for name in $(yq --no-doc "$rule_maps | .metadata.name" "$file"); do
              rule_map="$rule_maps | select(.metadata.name == \"$name\")"
              for key in $(yq --no-doc "$rule_map | .data | keys | .[]" "$file"); do
                yq --no-doc "$rule_map | .data[\"$key\"]" "$file" > "$rules/$name-$key"
              done
            done
          done
          "$install_dir/lokitool-linux-amd64" rules lint --dry-run "$rules"/*
      - name: Validate the cluster's manifests
        # Each path a Flux Kustomization in gotk-sync.yaml applies, built as
        # Flux builds it. CustomResourceDefinitions are skipped: kubeconform's
        # schemas have none for them, and Flux's come generated
        # (flux install --export). Kyverno's policies are checked against the
        # CRDs of the Kyverno chart version the cluster installs. Each build
        # is kept for the policy check below.
        shell: bash
        run: |
          schemas="$RUNNER_TEMP/crd-schemas"
          mkdir -p "$schemas"
          kyverno=clusters/onprem/infrastructure/kyverno.yaml
          helm template kyverno kyverno \
            --repo "$(yq --no-doc 'select(.kind == "HelmRepository") | .spec.url' "$kyverno")" \
            --version "$(yq --no-doc 'select(.kind == "HelmRelease") | .spec.chart.spec.version' "$kyverno")" \
            | yq 'select(.kind == "CustomResourceDefinition")' > "$schemas/kyverno-crds.yaml"
          (cd "$schemas" && FILENAME_FORMAT='{fullgroup}_{kind}_{version}' \
            uv run --no-project --with pyyaml python "$RUNNER_TEMP/kubeconform/openapi2jsonschema.py" \
            "$GITHUB_WORKSPACE/clusters/onprem/flux-system/gotk-components.yaml" kyverno-crds.yaml >/dev/null)
          mkdir -p "$RUNNER_TEMP/rendered"
          for path in $(yq --no-doc 'select(.kind == "Kustomization") | .spec.path' clusters/onprem/flux-system/gotk-sync.yaml); do
            echo "$path"
            rendered="$RUNNER_TEMP/rendered/$(basename "$path").yaml"
            kubectl kustomize "$path" > "$rendered"
            kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" -skip CustomResourceDefinition \
              -schema-location default -schema-location "$schemas/{{.Group}}_{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
              "$rendered"
          done
      - name: Validate the infrastructure's releases
        # Each HelmRelease the infrastructure path applies (Kyverno, the
        # monitoring stack), rendered from its chart repository with its own
        # values, as Flux renders it, against the schemas both steps above
        # generated. Each render is kept for the policy check below, so what
        # these charts run (their images, their Secrets) is held to the
        # cluster's policies as augustad's is.
        shell: bash
        run: |
          infrastructure=(clusters/onprem/infrastructure/*.yaml)
          for name in $(yq --no-doc 'select(.kind == "HelmRelease") | .metadata.name' "${infrastructure[@]}"); do
            release=$(yq ea --no-doc "select(.kind == \"HelmRelease\" and .metadata.name == \"$name\")" "${infrastructure[@]}")
            repo=$(yq '.spec.chart.spec.sourceRef.name' <<< "$release")
            namespace=$(yq '.spec.targetNamespace' <<< "$release")
            echo "$name, from $repo into $namespace"
            rendered="$RUNNER_TEMP/rendered/release-$name.yaml"
            yq '.spec.values // {}' <<< "$release" \
              | helm template "$(yq '.spec.releaseName' <<< "$release")" "$(yq '.spec.chart.spec.chart' <<< "$release")" \
                --repo "$(yq ea --no-doc "select(.kind == \"HelmRepository\" and .metadata.name == \"$repo\") | .spec.url" "${infrastructure[@]}")" \
                --version "$(yq '.spec.chart.spec.version' <<< "$release")" \
                --namespace "$namespace" --values - \
              > "$rendered"
            kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" -skip CustomResourceDefinition \
              -schema-location default \
              -schema-location "$RUNNER_TEMP/crd-schemas/{{.Group}}_{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
              -schema-location "$RUNNER_TEMP/monitoring-crd-schemas/{{.Group}}_{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
              "$rendered"
          done
      - name: Install promtool and amtool
        # The releases of the Prometheus and Alertmanager the cluster runs
        # (clusters/onprem/infrastructure/monitoring.yaml), bumped with them.
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/prometheus"
          mkdir -p "$install_dir"
          curl -fsSLo "$install_dir/prometheus.tar.gz" \
            https://github.com/prometheus/prometheus/releases/download/v3.15.0/prometheus-3.15.0.linux-amd64.tar.gz
          curl -fsSLo "$install_dir/alertmanager.tar.gz" \
            https://github.com/prometheus/alertmanager/releases/download/v0.34.1/alertmanager-0.34.1.linux-amd64.tar.gz
          printf '%s  %s\n' \
            '2a542df32eac02ee17b9d844fb2aa1de00dafa5476579ba8a3ba862e9d572ea0' "$install_dir/prometheus.tar.gz" \
            '265b9d1e55ef0d5306a436018af6d2b686c2ce051f03d968f7464ecb1372a7e8' "$install_dir/alertmanager.tar.gz" \
            | sha256sum --check --status
          tar -xzf "$install_dir/prometheus.tar.gz" -C "$install_dir" --strip-components=1 \
            prometheus-3.15.0.linux-amd64/promtool
          tar -xzf "$install_dir/alertmanager.tar.gz" -C "$install_dir" --strip-components=1 \
            alertmanager-0.34.1.linux-amd64/amtool
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Test the alert rules and Alertmanager's routes
        # A rule kubeconform admits can still never fire, or fire late, and a
        # route can send an alert nowhere. promtool tests the
        # chart's rules, rendered for one server (firebase, in develop) from
        # this commit's chart, against charts/augustad/tests/, and the
        # cluster's Flux rule, as the stack's release above renders it,
        # against clusters/onprem/infrastructure/alert-tests/. amtool checks
        # the Alertmanager configuration that release renders, and that each
        # alert in alert-tests/routes.txt reaches its receiver alone.
        shell: bash
        run: |
          tests="$RUNNER_TEMP/alert-tests"
          mkdir -p "$tests"
          stack="$RUNNER_TEMP/rendered/release-kube-prometheus-stack.yaml"
          helm template augustad charts/augustad --namespace develop \
            --set servers.firebase.packVersion=0123456789ab \
            | yq 'select(.kind == "PrometheusRule") | .spec' > "$tests/prometheusrule.rules.yaml"
          yq 'select(.kind == "PrometheusRule" and .metadata.name == "kube-prometheus-stack-flux") | .spec' \
            "$stack" > "$tests/flux.rules.yaml"
          cp charts/augustad/tests/prometheusrule.test.yaml \
            clusters/onprem/infrastructure/alert-tests/flux.test.yaml "$tests/"
          promtool check rules "$tests"/*.rules.yaml
          (cd "$tests" && promtool test rules ./*.test.yaml)
          config="$tests/alertmanager.yaml"
          yq 'select(.kind == "Secret" and .metadata.name == "alertmanager-kube-prometheus-stack-alertmanager")
            | .data["alertmanager.yaml"] | @base64d' "$stack" > "$config"
          amtool check-config "$config"
          grep -v '^#' clusters/onprem/infrastructure/alert-tests/routes.txt | while read -r -a alert; do
            echo "${alert[*]:1}: ${alert[0]}"
            amtool config routes test --config.file="$config" --verify.receivers="${alert[0]}" "${alert[@]:1}"
          done
      - name: Check the rendered manifests against the cluster's policies
        # The policies Flux applies (clusters/onprem/policies) over every
        # manifest the steps above rendered: what the cluster would refuse
        # fails here before it merges. A policy that looks objects up in
        # the cluster (default-deny-network, its NetworkPolicies) finds the
        # rendered ones, as Flux would apply them. Image signature policies
        # are left to their fixtures below: the chart runs the image of the
        # commit under test, which CI publishes and signs only once it lands
        # on develop or main, so no pull request's render could pass them.
        shell: bash
        run: |
          kubectl kustomize clusters/onprem/policies > "$RUNNER_TEMP/policies.yaml"
          yq 'select(.kind != "ImageValidatingPolicy")' "$RUNNER_TEMP/policies.yaml" \
            > "$RUNNER_TEMP/rendered-policies.yaml"
          yq ea "$NETWORK_POLICIES_CONTEXT" "$RUNNER_TEMP"/rendered/*.yaml > "$RUNNER_TEMP/context.yaml"
          kyverno apply "$RUNNER_TEMP/rendered-policies.yaml" --resource "$RUNNER_TEMP/rendered" \
            --context-file "$RUNNER_TEMP/context.yaml" --remove-color
      - name: Refuse each policy's negative fixtures
        # Every policy refuses each manifest in its fixtures/<name>/: a policy
        # that admits one checks nothing, and a policy with none is unchecked.
        # Read from the report rather than the exit status, which an error
        # loading the policy or the fixture would fail just the same. A
        # fixture's own NetworkPolicies are the cluster's it is judged in. An
        # image signature policy fetches its fixtures' images and signatures
        # from their registries; one it cannot fetch is an error, not a
        # refusal, so its fixtures are real images.
        shell: bash
        run: |
          policies="$RUNNER_TEMP/policies.yaml"
          for name in $(yq --no-doc '.metadata.name' "$policies"); do
            fixtures="clusters/onprem/policies/fixtures/$name"
            if ! compgen -G "$fixtures/*.yaml" >/dev/null; then
              echo "::error::Policy $name has no negative fixture in $fixtures/"
              exit 1
            fi
            policy="$RUNNER_TEMP/policy-$name.yaml"
            yq "select(.metadata.name == \"$name\")" "$policies" > "$policy"
            for fixture in "$fixtures"/*.yaml; do
              yq ea "$NETWORK_POLICIES_CONTEXT" "$fixture" > "$RUNNER_TEMP/context.yaml"
              report=$(kyverno apply "$policy" --resource "$fixture" \
                --context-file "$RUNNER_TEMP/context.yaml" --policy-report || true)
              failed=$(yq eval-all '[.results[] | select(.result == "fail")] | length' <<< "$report")
              if [ "$failed" -eq 0 ]; then
                echo "$report"
                echo "::error file=$fixture::Policy $name admits its negative fixture"
                exit 1
              fi
              echo "$fixture: refused by $name"
            done
          done
  container-verify:
    needs: changes
    # Needs nothing but changes, so on a pull request the image builds and is
    # scanned alongside the server-x64-linux job rather than after it;
    # container-publish-x64-linux waits for both. A push to main/develop always
    # builds (and publishes), since the deployed chart runs the image of its own
    # commit (charts/augustad/values.yaml): a commit with no image would never
    # start. PRs build only when the image or chart changed.
    if: github.event_name == 'push' || needs.changes.outputs.run_container == 'true'
    runs-on: ubuntu-26.04
    # The tag of the image it built, which the confinement job runs and
    # container-publish-x64-linux pushes.
    outputs:
      short-sha: ${{ steps.image.outputs.short-sha }}
    permissions:
      contents: read
      # Writing the registry layer cache, on a push.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint Helm chart
        run: helm lint charts/augustad
      - name: Install hadolint
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/hadolint"
          mkdir -p "$install_dir"
          curl -fsSLo "$install_dir/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          printf '%s  %s\n' \
            'c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507' "$install_dir/hadolint" \
            | sha256sum --check --status
          chmod +x "$install_dir/hadolint"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Lint Dockerfile
        # .hadolint.yaml has the rules it doesn't apply, and why.
        run: hadolint Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        # PRs (including from forks) only validate that the image builds and
        # passes its scan, same reasoning as ADR-0026's decision to keep this
        # pipeline off a self-hosted runner. A PR from this repository logs in
        # only to read the layer cache; a push, to write it.
      - name: Log in to GHCR
        if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only a push writes the layer cache, which the next commits build from.
      - name: Build and scan server image
        id: image
        uses: ./.github/actions/build-server-image
        with:
          cache-to: ${{ github.event_name == 'push' }}
      - name: Save server image
        # For the confinement job, which runs the image this job checked, and
        # container-publish-x64-linux, which pushes it.
        run: >-
          docker save ghcr.io/${{ github.repository_owner }}/augustad:sha-${{ steps.image.outputs.short-sha }} | gzip > "$RUNNER_TEMP/augustad.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-image
          path: ${{ runner.temp }}/augustad.tar.gz
          retention-days: 1
      # On a push, the image's debug info (the Dockerfile's debuginfo stage,
      # from the build stage the image was just built from, so every layer is a
      # hit), which container-publish-x64-linux pushes beside the image and
      # keeps for as long as it: what reads a core dump of it (ADR-0047).
      - name: Build server debug info
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: debuginfo
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/augustad:sha-${{ steps.image.outputs.short-sha }}-debuginfo
          # The vcpkg binaries the image step restored, and the toolchain it
          # installed, or the build stage misses its layers.
          build-contexts: vcpkg-bincache=.vcpkg-bincache
          build-args: ${{ steps.image.outputs.toolchain-args }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/augustad:buildcache
      - name: Save server debug info
        if: github.event_name == 'push'
        run: >-
          docker save ghcr.io/${{ github.repository_owner }}/augustad:sha-${{ steps.image.outputs.short-sha }}-debuginfo | gzip > "$RUNNER_TEMP/augustad-debuginfo.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push'
        with:
          name: server-debuginfo
          path: ${{ runner.temp }}/augustad-debuginfo.tar.gz
          retention-days: 1
  # The image under its own seccomp profile (ADR-0057), as the Node runs it:
  # Agents play full Matches against it, and a syscall outside the profile
  # kills it and fails the job. On a failure it records the profile again
  # (scripts/augustad-seccomp.sh) and uploads it as augustad-seccomp, to
  # commit once the change that needs it is understood. It runs only when
  # both the image and the Agents were built, which every change to the
  # server's sources, the image, the profile or its script asks for
  # (changes above): an image it skips is built from what it last checked.
  confinement:
    needs: [server-x64-linux, container-verify]
    if: needs.server-x64-linux.result == 'success' && needs.container-verify.result == 'success'
    runs-on: ubuntu-26.04
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/augustad:sha-${{ needs.container-verify.outputs.short-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - name: Install the Agents' package
        # As the server-x64-linux job does; its native module is that job's
        # build.
        working-directory: tools
        run: uv sync --locked --no-default-groups --group agent
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agents-native
          path: tools/agent/src/augusta_agent
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-image
          path: ${{ runner.temp }}
      - name: Load server image
        run: gunzip -c "$RUNNER_TEMP/augustad.tar.gz" | docker load
      - name: Check the server's seccomp profile
        id: check
        run: scripts/augustad-seccomp.sh check "$IMAGE"
      - name: Record the server's seccomp profile again
        if: failure() && steps.check.outcome == 'failure'
        run: |
          sudo apt-get update && sudo apt-get install -y auditd
          scripts/augustad-seccomp.sh record "$IMAGE"
      - name: Upload the recorded profile
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: augustad-seccomp
          path: clusters/onprem/node/augustad-seccomp.json
  container-publish-x64-linux:
    needs: [server-x64-linux, container-verify, confinement]
    # Only main/develop pushes publish, and only once both the server's tests
    # and the image's checks passed. The server-x64-linux job only runs when
    # run_build is true (see changes above), so a skipped result there is fine -
    # only an actual failure should block publishing. confinement is skipped
    # with it. !cancelled() rather than always(): a run someone cancelled
    # publishes nothing.
    if: |
      !cancelled() && github.event_name == 'push' &&
      needs.container-verify.result == 'success' &&
      (needs.server-x64-linux.result == 'success' || needs.server-x64-linux.result == 'skipped') &&
      (needs.confinement.result == 'success' || needs.confinement.result == 'skipped')
    runs-on: ubuntu-26.04
    # What container-index merges with main's arm64 image and debug info.
    outputs:
      image: ${{ steps.publish.outputs.digest }}
      debuginfo: ${{ steps.debuginfo.outputs.digest }}
    permissions:
      contents: read
      packages: write
      # Signing the image, and its provenance and SBOM attestations (Sigstore,
      # through the workflow's OIDC token), storing the attestations in the
      # repository and pushing all of them to GHCR beside the image.
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      REPOSITORY: ghcr.io/${{ github.repository_owner }}/augustad
      SHA_TAG: sha-${{ needs.container-verify.outputs.short-sha }}
    steps:
      # For the signing action, and the branch's head, alone: it builds
      # nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/sign-artifact
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image container-verify scanned and confinement ran, not a rebuild
      # of it: a rebuild cuts rootfs anew, so it would be another image, to
      # scan again. And its debug info, from the same build.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-image
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: server-debuginfo
          path: ${{ runner.temp }}
      - name: Load server image and debug info
        run: |
          gunzip -c "$RUNNER_TEMP/augustad.tar.gz" | docker load
          gunzip -c "$RUNNER_TEMP/augustad-debuginfo.tar.gz" | docker load
      - name: Publish server image
        id: publish
        # The digest is read back from GHCR: a loaded image has none of the
        # manifest the registry serves. The sha- tag, which Flux runs, is
        # always pushed; the branch tag is for people. Pushes run side by side
        # (see concurrency), so the branch tag is pushed only from the branch's
        # newest commit: an older run finishing last must not move it back.
        run: |
          docker push "$REPOSITORY:$SHA_TAG"
          head=$(git ls-remote --exit-code origin "$GITHUB_REF")
          if [ "${head%%[[:space:]]*}" = "$GITHUB_SHA" ]; then
            docker tag "$REPOSITORY:$SHA_TAG" "$REPOSITORY:$GITHUB_REF_NAME"
            docker push "$REPOSITORY:$GITHUB_REF_NAME"
          else
            echo "$GITHUB_REF_NAME has moved on to ${head%%[[:space:]]*}: leaving its tag alone"
          fi
          digest=$(docker buildx imagetools inspect "$REPOSITORY:$SHA_TAG" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # What the cluster admits an augustad image by (ADR-0057). Signed before
      # it is attested, so the verify after signing sees the signature alone.
      - name: Sign server image
        uses: ./.github/actions/sign-artifact
        with:
          digest: ${{ steps.publish.outputs.digest }}
      - name: Publish server debug info
        id: debuginfo
        run: |
          docker push "$REPOSITORY:$SHA_TAG-debuginfo"
          digest=$(docker buildx imagetools inspect "$REPOSITORY:$SHA_TAG-debuginfo" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest debug info provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/augustad
          subject-digest: ${{ steps.debuginfo.outputs.digest }}
          push-to-registry: true
      # Every published image is attested here, where it is pushed: release.yml
      # builds none, and the image a release runs is its tag's commit's, pushed
      # to main (docs/ENGINEERING.md, Provenance and SBOMs).
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/augustad
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/augustad@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: augustad-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/augustad
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: augustad-image.spdx.json
          push-to-registry: true
  # main's server image for arm64 too (NFR-04): what a release runs is its
  # tag's commit's image, pushed to main, so main's images are built for both
  # production architectures, natively, on an arm64 runner. develop's and pull
  # requests' stay amd64 alone. Its own build is its check: no
  # container-verify runs on arm64, so it writes its own layer cache.
  container-publish-arm64-linux:
    needs: [server-x64-linux, container-verify, confinement]
    if: |
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.container-verify.result == 'success' &&
      (needs.server-x64-linux.result == 'success' || needs.server-x64-linux.result == 'skipped') &&
      (needs.confinement.result == 'success' || needs.confinement.result == 'skipped')
    runs-on: ubuntu-26.04-arm
    outputs:
      image: ${{ steps.publish.outputs.digest }}
      debuginfo: ${{ steps.debuginfo.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and scan server image
        id: image
        uses: ./.github/actions/build-server-image
        with:
          arch-suffix: -arm64
          cache-to: true
      - name: Publish server image
        id: publish
        run: |
          image=ghcr.io/${{ github.repository_owner }}/augustad
          docker push "$image:sha-${{ steps.image.outputs.short-sha }}-arm64"
          digest=$(docker buildx imagetools inspect "$image:sha-${{ steps.image.outputs.short-sha }}-arm64" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # As container-publish-x64-linux's, before it is attested.
      - name: Sign server image
        uses: ./.github/actions/sign-artifact
        with:
          digest: ${{ steps.publish.outputs.digest }}
      - name: Publish server debug info
        id: debuginfo
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: debuginfo
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/augustad:sha-${{ steps.image.outputs.short-sha }}-arm64-debuginfo
          build-contexts: vcpkg-bincache=.vcpkg-bincache
          build-args: ${{ steps.image.outputs.toolchain-args }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/augustad:buildcache-arm64
      - name: Attest debug info provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/augustad
          subject-digest: ${{ steps.debuginfo.outputs.digest }}
          push-to-registry: true
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/augustad
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/augustad@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: augustad-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/augustad
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: augustad-image.spdx.json
          push-to-registry: true
  # Makes main's sha-<12>, main and sha-<12>-debuginfo tags the index of both
  # architectures' manifests, which the two jobs above signed and attested;
  # the index is signed and its own provenance attested here. A node pulls its
  # own architecture's manifest from it, but the cluster resolves the sha-<12>
  # tag it runs to the index, so the index's signature is the one it checks.
  # Until it runs (or if it fails), those tags are amd64's alone, as
  # container-publish-x64-linux pushed them.
  container-index:
    needs: [container-publish-x64-linux, container-publish-arm64-linux]
    if: |
      !cancelled() && needs.container-publish-x64-linux.result == 'success' &&
      needs.container-publish-arm64-linux.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # For the signing action alone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/actions/sign-artifact
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # By digest, not by tag: the tags are what is being rewritten.
      - name: Create the indexes
        id: index
        run: |
          image=ghcr.io/${{ github.repository_owner }}/augustad
          tag="sha-${GITHUB_SHA::12}"
          docker buildx imagetools create \
            --tag "$image:$tag" --tag "$image:${{ github.ref_name }}" \
            "$image@${{ needs.container-publish-x64-linux.outputs.image }}" \
            "$image@${{ needs.container-publish-arm64-linux.outputs.image }}"
          docker buildx imagetools create --tag "$image:$tag-debuginfo" \
            "$image@${{ needs.container-publish-x64-linux.outputs.debuginfo }}" \
            "$image@${{ needs.container-publish-arm64-linux.outputs.debuginfo }}"
          echo "image=$(docker buildx imagetools inspect "$image:$tag" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
          echo "debuginfo=$(docker buildx imagetools inspect "$image:$tag-debuginfo" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
      - name: Sign image index
        uses: ./.github/actions/sign-artifact
        with:
          digest: ${{ steps.index.outputs.image }}
      - name: Attest image index provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/augustad
          subject-digest: ${{ steps.index.outputs.image }}
          push-to-registry: true
      - name: Attest debug info index provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/augustad
          subject-digest: ${{ steps.index.outputs.debuginfo }}
          push-to-registry: true
  # develop's chart (ADR-0056), published only once its commit's image is
  # published and signed, so develop's OCIRepository
  # (clusters/onprem/apps/sources.yaml) never offers a chart whose image is
  # missing, nor one of a commit any of whose checks failed: develop keeps its
  # previous chart. Each check is waited on here, as container-publish-x64-linux
  # lets a skipped server-x64-linux job through, which a failed format skips.
  # Versioned <chart version>+<12 characters of the commit>, from which the
  # chart takes its image's sha-<12> tag (charts/augustad _helpers.tpl), and
  # pushed under the immutable tag <chart version>_<12> (Helm writes + as _).
  # The cluster follows the tag develop, moved to it only once it is signed, and
  # only from the branch's newest commit, as container-publish-x64-linux moves
  # the image's. main's charts are never published: staging runs its release
  # tag's from Git.
  chart-publish:
    needs: [format, client-x64-windows, tools, manifests, container-publish-x64-linux]
    if: |
      !cancelled() && github.ref == 'refs/heads/develop' &&
      needs.container-publish-x64-linux.result == 'success' &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      # Signing the chart (Sigstore, through the workflow's OIDC token).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
      # Docker's login, which cosign and oras read, and Helm's own.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the chart
        id: publish
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin <<< "$TOKEN"
          version="$(yq '.version' charts/augustad/Chart.yaml)+${GITHUB_SHA::12}"
          helm package charts/augustad --version "$version" --destination "$RUNNER_TEMP/chart"
          helm push "$RUNNER_TEMP/chart/augustad-$version.tgz" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          echo "digest=$(oras resolve "ghcr.io/${{ github.repository_owner }}/charts/augustad:${version/+/_}")" >> "$GITHUB_OUTPUT"
      - name: Sign the chart
        uses: ./.github/actions/sign-artifact
        with:
          digest: ${{ steps.publish.outputs.digest }}
          repository: charts/augustad
          branches: develop
      - name: Tag the chart develop
        run: |
          chart="ghcr.io/${{ github.repository_owner }}/charts/augustad@${{ steps.publish.outputs.digest }}"
          head=$(git ls-remote --exit-code origin "$GITHUB_REF")
          if [ "${head%%[[:space:]]*}" = "$GITHUB_SHA" ]; then
            oras tag "$chart" develop
          else
            echo "develop has moved on to ${head%%[[:space:]]*}: leaving the chart's tag alone"
          fi
