name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHubPackages,readwrite"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      run_build: ${{ steps.filter.outputs.run_build }}
      run_container: ${{ steps.filter.outputs.run_container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
            echo "run_container=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" "${{ github.sha }}")"

          if echo "$changed" \
              | grep -qE '^(src/|tests/|tools/|CMakeLists\.txt$|CMakePresets\.json$|vcpkg\.json$|third_party$|\.clang-format$|\.clang-tidy$|\.github/workflows/ci\.yml$)'; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed" \
              | grep -qE '^(Dockerfile$|\.dockerignore$|charts/|\.github/workflows/ci\.yml$)'; then
            echo "run_container=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_container=false" >> "$GITHUB_OUTPUT"
          fi

  format:
    needs: changes
    if: needs.changes.outputs.run_build == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Check formatting
        run: find src tests \( -name '*.cpp' -o -name '*.h' \) | xargs clang-format --dry-run --Werror

  build-client:
    needs: [changes, format]
    if: needs.changes.outputs.run_build == 'true'
    # Pinned rather than windows-latest, so the toolchain doesn't shift
    # underneath us when GitHub migrates the "latest" runner image.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # recursive, not just true: third_party/falcor (ADR-0009) has its
          # own nested submodules (glfw, imgui, fmt, ...) that need pulling
          # too - see .gitmodules.
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Ninja
        run: choco install ninja -y
        shell: pwsh

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\third_party\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Cache vendored Falcor build (ADR-0009)
        id: falcor-commit
        shell: pwsh
        run: |
          $sha = git -C third_party/falcor rev-parse HEAD
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # C:\packman-repo is packman's own machine-wide download cache
          # (outside the workspace - see third_party/falcor/setup.bat);
          # third_party/falcor/build is its own build tree, produced by
          # src/modules/renderer/CMakeLists.txt's own build step. Building
          # Falcor from scratch is slow, so both are cached and keyed on the
          # pinned submodule commit (ADR-0025-style pinning) rather than
          # rebuilding on every run.
          path: |
            C:\packman-repo
            third_party/falcor/build
          key: falcor-${{ steps.falcor-commit.outputs.sha }}

      - name: Configure vcpkg NuGet cache
        shell: pwsh
        run: |
          $nugetPath = & ".\third_party\vcpkg\vcpkg" fetch nuget | Select-Object -Last 1
          & $nugetPath sources add -Name GitHubPackages -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -Username "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText
          & $nugetPath setapikey "${{ secrets.GITHUB_TOKEN }}" -Source GitHubPackages

      - name: Configure
        # AUGUSTA_BUILD_RUNTIME defaults to ON (the windows preset's own
        # default) which builds the client/server runtime - the offline
        # cooker (tools/) is mutually exclusive with it (see the root
        # CMakeLists.txt's AUGUSTA_BUILD_RUNTIME else() branch) and is
        # only built/tested at release time (release.yml's build-tools
        # job), not on every push/PR here.
        run: cmake --preset windows
        shell: pwsh

      - name: Build
        run: cmake --build --preset windows

      - name: Test
        run: ctest --preset windows

  build-server:
    needs: [changes, format]
    if: needs.changes.outputs.run_build == 'true'
    # Pinned rather than ubuntu-latest - see build-client. This also makes
    # clang-tidy's version stable without needing to pull it from
    # apt.llvm.org (a stable runner image already gives a stable distro
    # package version).
    runs-on: ubuntu-26.04
    # Overrides the workflow-level NuGet/GitHubPackages default (Windows-
    # only, see build-client): that path runs nuget.exe under Mono here,
    # and Mono's own bundled cert store is untrusted-by-default on a
    # fresh runner image, failing every restore/push with
    # CERTIFICATE_VERIFY_FAILED (silently - vcpkg just rebuilds from
    # source instead of erroring). x-gha (GitHub Actions' own cache
    # backend for vcpkg) would have sidestepped Mono entirely, but it was
    # removed upstream (microsoft/vcpkg-tool#1662); actions/cache over
    # the local files provider is GitHub Actions' own recommended
    # replacement.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install clang-tidy
        run: sudo apt-get update && sudo apt-get install -y clang-tidy ninja-build

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-bincache
          key: vcpkg-bincache-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-

      - name: Bootstrap vcpkg
        run: ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure
        # AUGUSTA_BUILD_RUNTIME defaults to ON (builds augustad's runtime)
        # and is mutually exclusive with the offline cooker (tools/) - see
        # the root CMakeLists.txt's AUGUSTA_BUILD_RUNTIME else() branch -
        # which is only built/tested at release time (release.yml's
        # build-tools job), and which the server image (see Dockerfile)
        # never ships either way.
        run: cmake --preset linux

      - name: Lint (clang-tidy)
        # src/client and src/modules/renderer are Windows-only (CMakeLists.txt
        # gates both on WIN32 - the latter since ADR-0009's Falcor backend is
        # Windows-only) and aren't part of this Linux configure's build graph
        # at all, so they have no compile_commands.json entry here - excluded
        # rather than linted against the wrong platform's (missing) compile
        # flags. Note: clang-tidy given multiple files in one invocation
        # cascades a spurious error onto every file *after* the first one
        # missing its compile_commands entry, not just that file itself - so
        # a stray Windows-only file left in this list fails the whole batch.
        run: find src -name '*.cpp' -not -path 'src/client/*' -not -path 'src/modules/renderer/*' | xargs clang-tidy -p build/x64-linux

      - name: Build
        run: cmake --build --preset linux

      - name: Test
        run: ctest --preset linux

  sanitizers:
    needs: [changes, format]
    if: needs.changes.outputs.run_build == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    # See build-server's env override for why this isn't the workflow-
    # level NuGet default.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-bincache
          key: vcpkg-bincache-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-

      - name: Bootstrap vcpkg
        run: ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure (ASan + UBSan)
        run: cmake --preset linux-san

      - name: Build
        run: cmake --build --preset linux-san

      - name: Test
        run: ctest --preset linux-san

  container:
    needs: [changes, build-server]
    # build-server only runs when run_build is true (see changes above), so
    # a skipped result there is fine - only an actual failure should block
    # the image build.
    if: |
      always() &&
      needs.changes.outputs.run_container == 'true' &&
      (needs.build-server.result == 'success' || needs.build-server.result == 'skipped')
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint Helm chart
        run: helm lint charts/augustad

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Only main/develop pushes publish - PRs (including from forks) just
      # validate that the image builds, same reasoning as ADR-0026's decision
      # to keep this pipeline off a self-hosted runner.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build server image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          # github.ref_name is only a plain branch name (safe as a Docker
          # tag) on push - for pull_request it's "<pr-number>/merge", which
          # contains a "/" and Docker rejects as a tag.
          tags: ghcr.io/${{ github.repository_owner }}/augustad:${{ github.event_name == 'push' && github.ref_name || github.sha }}
