name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
  # Deleting superseded cache entries (.github/actions/prune-cache).
  actions: write
env:
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHubPackages,readwrite"
  SCCACHE_GHA_ENABLED: "true"
jobs:
  changes:
    runs-on: ubuntu-26.04
    outputs:
      run_build: ${{ steps.filter.outputs.run_build }}
      run_container: ${{ steps.filter.outputs.run_container }}
      run_manifests: ${{ steps.filter.outputs.run_manifests }}
      run_tools: ${{ steps.filter.outputs.run_tools }}
      run_yaml: ${{ steps.filter.outputs.run_yaml }}
      run_lua: ${{ steps.filter.outputs.run_lua }}
      run_toml: ${{ steps.filter.outputs.run_toml }}
      run_lint: ${{ steps.filter.outputs.run_lint }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            {
              echo "run_build=true"
              echo "run_container=true"
              echo "run_manifests=true"
              echo "run_tools=true"
              echo "run_yaml=true"
              echo "run_lua=true"
              echo "run_toml=true"
              echo "run_lint=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base" "${{ github.sha }}")"

          if echo "$changed" \
              | grep -qE '^(src/|tests/|tools/swarm/|tools/composer/examples/|tools/pack/cpp/|cmake/|config/|CMakeLists\.txt$|CMakePresets\.json$|vcpkg\.json$|third_party/|\.clang-format$|\.clang-tidy$|\.github/workflows/ci\.yml$|\.github/actions/)'; then
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed" \
              | grep -qE '^(Dockerfile$|\.dockerignore$|\.hadolint\.yaml$|chisel/|charts/|\.github/workflows/ci\.yml$|\.github/actions/build-server-image/)'; then
            echo "run_container=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_container=false" >> "$GITHUB_OUTPUT"
          fi

          # What Flux applies to the cluster: its own manifests and the chart
          # the HelmReleases there install.
          if echo "$changed" \
              | grep -qE '^(charts/|clusters/|\.github/workflows/ci\.yml$)'; then
            echo "run_manifests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_manifests=false" >> "$GITHUB_OUTPUT"
          fi

          # The offline tools (tools/pack, tools/composer), and the golden
          # output of theirs the runtime's tests load, which the tools job checks
          # they still write. tools/docs is the docs workflow's, not theirs.
          if echo "$changed" \
              | grep -qE '^(tools/(pack|composer)/|tools/(pyproject\.toml|uv\.lock)$|tests/fixtures/example-packs/|\.github/workflows/ci\.yml$)'; then
            echo "run_tools=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_tools=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed" \
              | grep -qE '(^\.(yamlfmt|yamllint|yamlignore|gitignore)$|(^|/)[^/]+\.ya?ml$)'; then
            echo "run_yaml=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_yaml=false" >> "$GITHUB_OUTPUT"
          fi

          # The scenarios' Lua scripts, and the rules they are formatted and
          # linted by.
          if echo "$changed" \
              | grep -qE '(\.lua$|^(stylua\.toml|\.luacheckrc|\.github/workflows/ci\.yml)$)'; then
            echo "run_lua=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_lua=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed" | grep -qE '(\.toml$|^\.github/workflows/ci\.yml$)'; then
            echo "run_toml=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_toml=false" >> "$GITHUB_OUTPUT"
          fi

          # Python, shell, Markdown, CMake and the workflows, and
          # the rules each is formatted and linted by.
          if echo "$changed" \
              | grep -qE '(\.(py|sh|md|cmake)$|(^|/)CMakeLists\.txt$|^\.githooks/|^\.github/workflows/|^\.github/actionlint\.yaml$|^(ruff\.toml|\.shellcheckrc|\.gersemirc|\.pymarkdown\.json|\.prettierrc\.yaml|\.editorconfig)$)'; then
            echo "run_lint=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_lint=false" >> "$GITHUB_OUTPUT"
          fi
  format:
    needs: changes
    if: >-
      needs.changes.outputs.run_build == 'true' || needs.changes.outputs.run_yaml == 'true' || needs.changes.outputs.run_lua == 'true' || needs.changes.outputs.run_toml == 'true' || needs.changes.outputs.run_lint == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: needs.changes.outputs.run_yaml == 'true' || needs.changes.outputs.run_lint == 'true'
        with:
          enable-cache: true
      - name: Install yamlfmt
        if: needs.changes.outputs.run_yaml == 'true'
        shell: bash
        run: |
          version=0.21.0
          asset="yamlfmt_${version}_Linux_x86_64.tar.gz"
          install_dir="$RUNNER_TEMP/yamlfmt"
          mkdir -p "$install_dir"
          curl -fsSLo "$install_dir/$asset" "https://github.com/google/yamlfmt/releases/download/v${version}/$asset"
          printf '%s  %s\n' \
            '1f300d9257b232bb3b541d7fb1b0e6b3c121bcbab381c86cd38cb8722be8a566' \
            "$install_dir/$asset" | sha256sum --check --status
          tar -xzf "$install_dir/$asset" -C "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Install clang-format
        if: needs.changes.outputs.run_build == 'true'
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check C++ formatting
        if: needs.changes.outputs.run_build == 'true'
        run: find src tests tools \( -name '*.cpp' -o -name '*.h' \) -print0 | xargs -0 clang-format --dry-run --Werror
      - name: Check the tests' requirement markers
        # Every requirement a test names is one docs/REQUIREMENTS.md has, and
        # every marker is directly above a test (ADR-0013).
        if: needs.changes.outputs.run_build == 'true' || needs.changes.outputs.run_lint == 'true'
        run: python3 scripts/requirements-matrix.py --check
      - name: Check YAML formatting and lint
        if: needs.changes.outputs.run_yaml == 'true'
        run: |
          yamlfmt -conf .yamlfmt -lint
          uv tool run --from yamllint==1.37.1 yamllint --strict -c .yamllint .
      - name: Install StyLua and luacheck
        if: needs.changes.outputs.run_lua == 'true'
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/lua-tools"
          mkdir -p "$install_dir"
          curl -fsSLo "$install_dir/stylua.zip" \
            https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          curl -fsSLo "$install_dir/luacheck" \
            https://github.com/lunarmodules/luacheck/releases/download/v1.2.0/luacheck
          printf '%s  %s\n' \
            'bcb0d855e91f102f28a370e850f8566b3b44b79e6274d806ea5246837c0fd5ab' "$install_dir/stylua.zip" \
            'd68da17fca0697d9e2fb04201f3884abd259fa558b3a449bccaed47f1390defc' "$install_dir/luacheck" \
            | sha256sum --check --status
          unzip -q "$install_dir/stylua.zip" -d "$install_dir"
          chmod +x "$install_dir/stylua" "$install_dir/luacheck"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Check Lua formatting and lint
        if: needs.changes.outputs.run_lua == 'true'
        run: |
          git ls-files -z -- '*.lua' | xargs -0 stylua --check
          git ls-files -z -- '*.lua' | xargs -0 luacheck
      - name: Install taplo
        if: needs.changes.outputs.run_toml == 'true'
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/taplo"
          mkdir -p "$install_dir"
          curl -fsSLo "$install_dir/taplo.gz" \
            https://github.com/tamasfe/taplo/releases/download/0.10.0/taplo-linux-x86_64.gz
          printf '%s  %s\n' '8fe196b894ccf9072f98d4e1013a180306e17d244830b03986ee5e8eabeb6156' "$install_dir/taplo.gz" \
            | sha256sum --check --status
          gunzip "$install_dir/taplo.gz"
          chmod +x "$install_dir/taplo"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Check TOML formatting and lint
        if: needs.changes.outputs.run_toml == 'true'
        run: |
          git ls-files -z -- '*.toml' ':!:third_party/*' | xargs -0 taplo fmt --check
          git ls-files -z -- '*.toml' ':!:third_party/*' | xargs -0 taplo lint
      # uv runs the rest at pinned versions, as the Makefile's format-check and
      # the git hooks do.
      - name: Check Python formatting and lint
        if: needs.changes.outputs.run_lint == 'true'
        run: |
          git ls-files -z -- '*.py' ':!:third_party/*' | xargs -0 uv tool run ruff@0.16.10 format --check
          git ls-files -z -- '*.py' ':!:third_party/*' | xargs -0 uv tool run ruff@0.16.10 check
      - name: Check shell formatting and lint
        if: needs.changes.outputs.run_lint == 'true'
        run: |
          git ls-files -z -- '*.sh' '.githooks/*' | xargs -0 uv tool run --from shfmt-py==4.2.0 shfmt -d
          git ls-files -z -- '*.sh' '.githooks/*' | xargs -0 uv tool run --from shellcheck-py==0.11.0.1 shellcheck
      - name: Lint the workflows
        if: needs.changes.outputs.run_lint == 'true'
        run: uv tool run --from actionlint-py==1.7.12.25 --with shellcheck-py==0.11.0.1 actionlint
      - name: Check CMake formatting
        if: needs.changes.outputs.run_lint == 'true'
        run: |
          git ls-files -z -- 'CMakeLists.txt' '*/CMakeLists.txt' '*.cmake' ':!:third_party/*' \
            | xargs -0 uv tool run gersemi@0.29.2 --check
      - name: Check Markdown formatting and lint
        if: needs.changes.outputs.run_lint == 'true'
        run: |
          git ls-files -z -- '*.md' ':!:third_party/*' ':!:CHANGELOG.md' \
            | xargs -0 uv tool run --from nodejs-wheel==24.19.0 npx --yes prettier@3.9.9 --log-level warn --check
          git ls-files -z -- '*.md' ':!:third_party/*' ':!:CHANGELOG.md' \
            | xargs -0 uv tool run --from pymarkdownlnt==0.9.40 pymarkdown --config .pymarkdown.json scan
  client:
    needs: [changes, format]
    if: needs.changes.outputs.run_build == 'true'
    # Pinned rather than windows-latest, so the toolchain doesn't shift
    # underneath us when GitHub migrates the "latest" runner image.
    runs-on: windows-2025
    # Git Bash, as everywhere else: no PowerShell in the repository.
    defaults:
      run:
        shell: bash
    env:
      # packman, which fetches Falcor's binary dependencies when Falcor is built
      # from source, keeps its cache on the drive its own script is on unless
      # told otherwise - the workspace's D: on this runner, where the cache
      # below would never find it.
      PM_PACKAGES_ROOT: C:\packman-repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # recursive, not just true: third_party/falcor (ADR-0009) has its
          # own nested submodules (glfw, imgui, fmt, ...) that need pulling
          # too - see .gitmodules.
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Bootstrap vcpkg
        run: ./third_party/vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Configure vcpkg NuGet cache
        env:
          FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nuget="$(cygpath -u "$(./third_party/vcpkg/vcpkg fetch nuget | tail -n 1 | tr -d '\r')")"
          "$nuget" sources add -Name GitHubPackages -Source "$FEED_URL" -Username "$GITHUB_REPOSITORY_OWNER" -Password "$FEED_TOKEN" -StorePasswordInClearText
          "$nuget" setapikey "$FEED_TOKEN" -Source GitHubPackages
      - name: Configure
        run: cmake --preset windows
        # Configure downloads the prebuilt Falcor published for this Falcor
        # (cmake/FalcorPrebuilt.cmake, falcor-prebuilt.yml). Without one - a pull
        # request that changes Falcor, or before that workflow has published it -
        # the build builds Falcor from source, and only then needs packman's
        # downloads, cached here.
      - name: Check for a prebuilt Falcor
        id: falcor
        run: echo "prebuilt=$(sed -n 's/^AUGUSTA_FALCOR_PREBUILT_USED:INTERNAL=//p' build/x64-windows/CMakeCache.txt)" >> "$GITHUB_OUTPUT"
      - name: Restore packman's downloads
        id: packman-cache
        if: steps.falcor.outputs.prebuilt != 'TRUE'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\packman-repo
          key: falcor-packman-${{ hashFiles('third_party/falcor/dependencies.xml', 'cmake/patches/falcor.patch') }}
      - name: Build
        # all includes augustad: this job is the build matrix's Windows x64
        # server, the development-only one (NFR-04, cmake/AugustaPlatform.cmake).
        run: cmake --build --preset windows --target all augusta_tests
        # Saved right after the Build that downloaded them, so a failing test
        # can't keep it from saving.
      - name: Save packman's downloads
        if: steps.falcor.outputs.prebuilt != 'TRUE' && steps.packman-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: C:\packman-repo
          key: falcor-packman-${{ hashFiles('third_party/falcor/dependencies.xml', 'cmake/patches/falcor.patch') }}
      - if: steps.falcor.outputs.prebuilt != 'TRUE' && steps.packman-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/prune-cache
        with:
          prefix: falcor-packman-
          keep: falcor-packman-${{ hashFiles('third_party/falcor/dependencies.xml', 'cmake/patches/falcor.patch') }}
      - name: Check augustac's PDB
        # Each release publishes it (ADR-0055): the build leaves it beside
        # augustac.exe, whose debug directory names it. -headers rather than
        # /headers, which Git Bash would rewrite as a path.
        run: |
          test -f build/x64-windows/src/client/augustac.pdb
          dumpbin -nologo -headers build/x64-windows/src/client/augustac.exe | grep -E 'Format: RSDS, .*augustac\.pdb'
      - name: Install clang-tidy
        # LLVM 21.1.8, the version the server job's distro package and the
        # Windows bootstrap give, so both platforms agree on which header
        # provides what; the image's own is 20.1.8. Downloaded and checked
        # like the format job's tools, as the image has no winget, the
        # bootstrap's package manager. Installed beside the image's LLVM and
        # put ahead of it on PATH.
        # MSYS_NO_PATHCONV: Git Bash would otherwise take the NSIS installer's
        # /S and /D= for paths and rewrite them.
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          installer="$RUNNER_TEMP/LLVM-21.1.8-win64.exe"
          curl -fsSLo "$installer" https://github.com/llvm/llvm-project/releases/download/llvmorg-21.1.8/LLVM-21.1.8-win64.exe
          printf '%s  %s\n' 7a5386c26497db1691f320121e5b113364dd0274b98e55f15f4dbc00c0450113 \
            "$installer" | sha256sum --check --status
          "$installer" /S "/D=$(cygpath -w "$RUNNER_TEMP/llvm")"
          cygpath -w "$RUNNER_TEMP/llvm/bin" >> "$GITHUB_PATH"
      - name: Lint
        # .clang-tidy's misc-include-cleaner alone (the Makefile's tidy target
        # says why -w) on what the server job's Linux build can't lint: the
        # Windows-only sources and tests. After Build, which generates headers
        # Falcor's own include.
        run: >-
          git ls-files 'src/client/*.cpp' 'src/modules/renderer/*.cpp' 'src/modules/audio/output_miniaudio.cpp' 'src/modules/audio/miniaudio.cpp' 'tests/client_*.cpp' | xargs -P "$NUMBER_OF_PROCESSORS" -n 4 clang-tidy --quiet -p=build/x64-windows --checks=-*,misc-include-cleaner --extra-arg=-w
      - name: Test
        run: ctest --preset windows
  server:
    needs: [changes, format]
    if: needs.changes.outputs.run_build == 'true'
    # Pinned rather than ubuntu-latest - see the client job. This also makes
    # clang-tidy's version stable without needing to pull it from
    # apt.llvm.org (a stable runner image already gives a stable distro
    # package version).
    runs-on: ubuntu-26.04
    # Overrides the workflow-level NuGet/GitHubPackages default (Windows-
    # only, see the client job): that path runs nuget.exe under Mono here,
    # and Mono's own bundled cert store is untrusted-by-default on a
    # fresh runner image, failing every restore/push with
    # CERTIFICATE_VERIFY_FAILED (silently - vcpkg just rebuilds from
    # source instead of erroring). x-gha (GitHub Actions' own cache
    # backend for vcpkg) would have sidestepped Mono entirely, but it was
    # removed upstream (microsoft/vcpkg-tool#1662); actions/cache over
    # the local files provider is GitHub Actions' own recommended
    # replacement.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/setup-linux-build
        with:
          # The same distro version as the clang the presets compile with.
          extra-packages: clang-tidy
      - name: Configure
        run: cmake --preset linux
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Lint
        # Both checks run, and the step fails if either does, so one run shows
        # every finding. clang-tidy with .clang-tidy's full profile on src:
        # src/client and src/modules/renderer are Windows-only (CMakeLists.txt
        # gates both on WIN32 - the latter since ADR-0009's Falcor backend is
        # Windows-only), as is the audio module's output device (miniaudio and
        # Steam Audio, built only with AUGUSTA_AUDIO_OUTPUT, on only on Windows -
        # src/modules/audio/CMakeLists.txt), and aren't part of this Linux configure's build graph
        # at all, so they have no compile_commands.json entry here - excluded
        # rather than linted against the wrong platform's (missing) compile
        # flags. One file per clang-tidy, on every core: a serial run over the
        # whole list took most of the job. One file per invocation also
        # keeps a stray Windows-only file to its own error, where a multi-file
        # invocation cascades it onto every file after it.
        # The C++ tools (tools/swarm) are built with them, so
        # linted alike, and their tests like the runtime's.
        # Then the tests get .clang-tidy's misc-include-cleaner alone, as the
        # Makefile's tidy target runs it (which says why -w); the Windows-only
        # client tests are the client job's.
        run: |
          status=0
          find src tools/swarm -name '*.cpp' -not -path 'tools/*/tests/*' -not -path 'src/client/*' -not -path 'src/modules/renderer/*' -not -path 'src/modules/audio/output_miniaudio.cpp' -not -path 'src/modules/audio/miniaudio.cpp' -print0 | xargs -0 -P "$(nproc)" -n 1 clang-tidy -p build/x64-linux || status=1
          git ls-files 'tests/*.cpp' 'tools/swarm/tests/*.cpp' ':!:tests/client_*' | xargs -P "$(nproc)" -n 8 clang-tidy --quiet -p build/x64-linux --checks=-*,misc-include-cleaner --extra-arg=-w || status=1
          exit "$status"
      - name: Build
        # all includes augustad: this job is the build matrix's Linux x86-64
        # server, the production one (NFR-04, cmake/AugustaPlatform.cmake).
        run: cmake --build --preset linux --target all augusta_tests
      - name: Test
        run: ctest --preset linux --parallel "$(nproc)"
  tools:
    needs: changes
    if: needs.changes.outputs.run_tools == 'true'
    # Builds and tests the offline tools (tools/), including that each still
    # writes the golden output the runtime's tests load (ADR-0013). A new
    # tool adds steps here, not a job. Windows, where the content authors cook,
    # and Linux, the asset cooker's other platform (tools/README.md): the same
    # pytest suite, golden packs included - a cook gives the same bytes on
    # either platform.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            preset: windows
            python: tools/.venv/Scripts/python.exe
          - os: ubuntu-26.04
            preset: linux
            python: tools/.venv/bin/python
    runs-on: ${{ matrix.os }}
    # Git Bash on Windows, as everywhere else: no PowerShell in the repository.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Fetch vcpkg
        # Only vcpkg: the native modules build against no other submodule,
        # and third_party/falcor is large.
        run: git submodule update --init --depth 1 third_party/vcpkg
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
      - name: Install build tools
        if: runner.os == 'Linux'
        # clang: the linux preset compiles with it. autoconf/autoconf-archive/
        # automake/libtool: vcpkg's python3 port (pybind11's dependency) builds
        # via autotools on Linux. libomp-dev: DirectXTex's CMake config finds
        # OpenMP, and clang's runtime isn't on the runner image.
        run: sudo apt-get update && sudo apt-get install -y clang libomp-dev ninja-build autoconf autoconf-archive automake libtool
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        run: ./third_party/vcpkg/bootstrap-vcpkg.bat -disableMetrics
      - name: Configure vcpkg NuGet cache
        if: runner.os == 'Windows'
        env:
          FEED_URL: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          FEED_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          nuget="$(cygpath -u "$(./third_party/vcpkg/vcpkg fetch nuget | tail -n 1 | tr -d '\r')")"
          "$nuget" sources add -Name GitHubPackages -Source "$FEED_URL" -Username "$GITHUB_REPOSITORY_OWNER" -Password "$FEED_TOKEN" -StorePasswordInClearText
          "$nuget" setapikey "$FEED_TOKEN" -Source GitHubPackages
      - name: Use a local vcpkg binary cache
        if: runner.os == 'Linux'
        # The local files provider, as the server job does (see there why not
        # the NuGet feed) - but a cache of its own, not setup-linux-build's:
        # tools/pack/cpp's manifest isn't the root one every job sharing that
        # cache installs, and save-vcpkg-cache drops whatever the root build
        # didn't install.
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;files,$GITHUB_WORKSPACE/.vcpkg-bincache,readwrite" >> "$GITHUB_ENV"
          echo "VCPKG_CACHE_KEY=vcpkg-bincache-pack-linux-clang-$(git rev-parse HEAD:third_party/vcpkg)-${{ hashFiles('tools/pack/cpp/vcpkg.json') }}" >> "$GITHUB_ENV"
      - name: Restore and save vcpkg binaries
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-bincache
          key: ${{ env.VCPKG_CACHE_KEY }}
      - name: Bootstrap vcpkg (Linux)
        if: runner.os == 'Linux'
        run: ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - name: Install the cooker
        working-directory: tools
        run: uv sync --locked
      - name: Build the native modules
        # Into tools/pack/src/pack, against the venv's own interpreter, as
        # tools/pack/scripts/bootstrap.sh does - a mixed-slash path from cygpath
        # on Windows, as is on Linux.
        run: |
          python="$PWD/${{ matrix.python }}"
          [[ "$RUNNER_OS" == Windows ]] && python="$(cygpath -m "$python")"
          cmake --preset ${{ matrix.preset }} -S tools/pack/cpp "-DPYTHON_EXECUTABLE=$python"
          cmake --build tools/pack/cpp/build/x64-${{ matrix.preset }}
      - name: Test (pytest)
        working-directory: tools/pack
        run: uv run pytest
  sanitizers:
    needs: [changes, format]
    if: needs.changes.outputs.run_build == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    # See the server job's env override for why this isn't the workflow-
    # level NuGet default.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: ./.github/actions/setup-linux-build
      - name: Configure (ASan + UBSan)
        run: cmake --preset linux-san
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux-san --target all augusta_tests
      - name: Test
        run: ctest --preset linux-san --parallel "$(nproc)"
  fuzz:
    # A short run per fuzz target (ADR-0013): long enough to catch an obvious
    # crash before merge. The long runs, over a corpus kept between them, are
    # the nightly's. tests/fuzz/README.md has what a crash becomes.
    needs: [changes, format]
    if: needs.changes.outputs.run_build == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    # See the server job's env override for why this isn't the workflow-
    # level NuGet default.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # libFuzzer ships with the clang package this installs.
      - uses: ./.github/actions/setup-linux-build
      - name: Configure (libFuzzer + ASan)
        run: cmake --preset linux-fuzz
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux-fuzz --target all augusta_tests
      - name: Fuzz
        # Each target in turn (tests/fuzz/README.md). New inputs go to a scratch
        # directory, never into the committed seeds; a crash lands in
        # fuzz-crashes/ and fails the step, after the other targets have run.
        run: |
          mkdir -p fuzz-crashes
          status=0
          for target in protocol_decode capture_read pack_load; do
            mkdir -p "fuzz-corpus/$target"
            "build/x64-linux-fuzz/tests/fuzz/augusta_${target}_fuzz" \
              -max_total_time=60 -timeout=5 -artifact_prefix="fuzz-crashes/$target-" \
              "fuzz-corpus/$target" "tests/fuzz/corpus/$target" || status=1
          done
          exit "$status"
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes
          path: fuzz-crashes/
          if-no-files-found: ignore
  manifests:
    # What Flux applies, against the schemas of the Kubernetes version the
    # cluster runs (k3s, bumped with it): helm lint checks the chart's
    # templating, not what it renders. Flux's own resources are checked
    # against the CRDs gotk-components.yaml installs, so a Flux upgrade
    # brings its schemas with it. kubectl and yq come with the runner image.
    needs: changes
    if: needs.changes.outputs.run_manifests == 'true'
    runs-on: ubuntu-26.04
    env:
      KUBERNETES_VERSION: 1.36.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install kubeconform
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/kubeconform"
          mkdir -p "$install_dir"
          curl -fsSLo "$install_dir/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          curl -fsSLo "$install_dir/openapi2jsonschema.py" \
            https://raw.githubusercontent.com/yannh/kubeconform/v0.8.0/scripts/openapi2jsonschema.py
          printf '%s  %s\n' \
            '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883' "$install_dir/kubeconform.tar.gz" \
            'd145babfbb765004030764e1b4e518bfb7a4bd7f111691a08fa57983b81881f3' "$install_dir/openapi2jsonschema.py" \
            | sha256sum --check --status
          tar -xzf "$install_dir/kubeconform.tar.gz" -C "$install_dir" kubeconform
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Validate the chart, rendered per environment
        # With each HelmRelease's own values, as Flux renders it, and with the
        # chart of the branch its GitRepository tracks: staging runs main's
        # chart, whose values can trail develop's until a release. The branch
        # this run's commit lands on (the pull request's base, or the pushed
        # branch) is checked out already; the other one is fetched. bash for
        # pipefail - a render that fails leaves kubeconform nothing to reject.
        # Its ServiceMonitor and PrometheusRule are checked against the CRDs
        # of the kube-prometheus-stack version the cluster installs
        # (clusters/onprem/infrastructure), so a stack upgrade brings its
        # schemas with it.
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          # The file holds other releases (Loki, Alloy): pick the stack's by
          # name, and its repository by the release's sourceRef.
          stack=clusters/onprem/infrastructure/monitoring.yaml
          stack_release='select(.kind == "HelmRelease" and .metadata.name == "kube-prometheus-stack")'
          repo=$(yq --no-doc "$stack_release | .spec.chart.spec.sourceRef.name" "$stack")
          schemas="$RUNNER_TEMP/monitoring-crd-schemas"
          mkdir -p "$schemas"
          helm show crds kube-prometheus-stack \
            --repo "$(yq --no-doc "select(.kind == \"HelmRepository\" and .metadata.name == \"$repo\") | .spec.url" "$stack")" \
            --version "$(yq --no-doc "$stack_release | .spec.chart.spec.version" "$stack")" \
            > "$schemas/crds.yaml"
          (cd "$schemas" && FILENAME_FORMAT='{fullgroup}_{kind}_{version}' \
            uv run --no-project --with pyyaml python "$RUNNER_TEMP/kubeconform/openapi2jsonschema.py" \
            crds.yaml >/dev/null)
          for release in clusters/onprem/apps/*.yaml; do
            grep -q '^kind: HelmRelease$' "$release" || continue
            source=$(yq '.spec.chart.spec.sourceRef.name' "$release")
            branch=$(yq --no-doc "select(.metadata.name == \"$source\") | .spec.ref.branch" clusters/onprem/apps/sources.yaml)
            chart=charts/augustad
            if [ "$branch" != "$TARGET_BRANCH" ]; then
              tree="$RUNNER_TEMP/branches/$branch"
              mkdir -p "$tree"
              git fetch --quiet --depth=1 origin "$branch"
              git archive FETCH_HEAD charts/augustad | tar -x -C "$tree"
              chart="$tree/charts/augustad"
            fi
            echo "$release, with $branch's chart"
            yq '.spec.values' "$release" \
              | helm template augustad "$chart" --values - \
              | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" \
                -schema-location default -schema-location "$schemas/{{.Group}}_{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          done
      - name: Validate the chart's dashboards
        # Grafana's sidecar skips a dashboard it cannot parse without failing
        # anything, and kubeconform sees only the string it is carried in.
        run: jq empty charts/augustad/dashboards/*.json
      - name: Validate the cluster's manifests
        # Each path a Flux Kustomization in gotk-sync.yaml applies, built as
        # Flux builds it. CustomResourceDefinitions are skipped: kubeconform's
        # schemas have none for them, and Flux's come generated
        # (flux install --export).
        shell: bash
        run: |
          schemas="$RUNNER_TEMP/crd-schemas"
          mkdir -p "$schemas"
          (cd "$schemas" && FILENAME_FORMAT='{fullgroup}_{kind}_{version}' \
            uv run --no-project --with pyyaml python "$RUNNER_TEMP/kubeconform/openapi2jsonschema.py" \
            "$GITHUB_WORKSPACE/clusters/onprem/flux-system/gotk-components.yaml" >/dev/null)
          for path in $(yq --no-doc 'select(.kind == "Kustomization") | .spec.path' clusters/onprem/flux-system/gotk-sync.yaml); do
            echo "$path"
            kubectl kustomize "$path" \
              | kubeconform -strict -summary -kubernetes-version "$KUBERNETES_VERSION" -skip CustomResourceDefinition \
                -schema-location default -schema-location "$schemas/{{.Group}}_{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
          done
  container-verify:
    needs: changes
    # Needs nothing but changes, so on a pull request the image builds and is
    # scanned alongside the server job rather than after it; container-publish
    # waits for both. A push to main/develop always builds (and publishes),
    # since the deployed chart runs the image of its own commit
    # (charts/augustad/values.yaml): a commit with no image would never start.
    # PRs build only when the image or chart changed.
    if: github.event_name == 'push' || needs.changes.outputs.run_container == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Writing the registry layer cache, on a push.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Lint Helm chart
        run: helm lint charts/augustad
      - name: Install hadolint
        shell: bash
        run: |
          install_dir="$RUNNER_TEMP/hadolint"
          mkdir -p "$install_dir"
          curl -fsSLo "$install_dir/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          printf '%s  %s\n' \
            'c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507' "$install_dir/hadolint" \
            | sha256sum --check --status
          chmod +x "$install_dir/hadolint"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Lint Dockerfile
        # .hadolint.yaml has the rules it doesn't apply, and why.
        run: hadolint Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        # PRs (including from forks) only validate that the image builds and
        # passes its scan, same reasoning as ADR-0026's decision to keep this
        # pipeline off a self-hosted runner. A PR from this repository logs in
        # only to read the layer cache; a push, to write it.
      - name: Log in to GHCR
        if: github.event_name == 'push' || !github.event.pull_request.head.repo.fork
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only a push writes the layer cache, as only a push publishes:
      # container-publish rebuilds from it.
      - name: Build and scan server image
        uses: ./.github/actions/build-server-image
        with:
          cache-to: ${{ github.event_name == 'push' }}
  container-publish:
    needs: [server, container-verify]
    # Only main/develop pushes publish, and only once both the server's tests
    # and the image's checks passed. The server job only runs when run_build is
    # true (see changes above), so a skipped result there is fine - only an
    # actual failure should block publishing. !cancelled() rather than
    # always(): a run cancelled by a newer push must not publish its older
    # commit's branch tag over the newer one's.
    if: |
      !cancelled() && github.event_name == 'push' &&
      needs.container-verify.result == 'success' &&
      (needs.server.result == 'success' || needs.server.result == 'skipped')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      # Signing the image's provenance and SBOM attestations (Sigstore, through
      # the workflow's OIDC token), storing them in the repository and pushing
      # them to GHCR beside the image.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Rebuilt from the layer cache container-verify just wrote, so every
      # stage but rootfs is a cache hit, and scanned again: rootfs is cut anew,
      # and what is pushed below must be an image that passed the scan.
      - name: Build and scan server image
        id: image
        uses: ./.github/actions/build-server-image
      - name: Publish server image
        id: publish
        # The digest is read back from GHCR: the build only loaded the image,
        # so its own digest output isn't the manifest the registry serves.
        run: |
          image=ghcr.io/${{ github.repository_owner }}/augustad
          docker push --all-tags "$image"
          digest=$(docker buildx imagetools inspect "$image:sha-${{ steps.image.outputs.short-sha }}" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The published binary's debug info (the Dockerfile's debuginfo stage,
      # from the build layer the image was just built from), kept beside the
      # image for as long as it: what reads a core dump of it (ADR-0047).
      - name: Publish server debug info
        id: debuginfo
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: debuginfo
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/augustad:sha-${{ steps.image.outputs.short-sha }}-debuginfo
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/augustad:buildcache
      - name: Attest debug info provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/augustad
          subject-digest: ${{ steps.debuginfo.outputs.digest }}
          push-to-registry: true
      # Every published image is attested here, where it is built: release.yml
      # builds none, and the image a release runs is its tag's commit's, pushed
      # to main (docs/ENGINEERING.md, Provenance and SBOMs).
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/augustad
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
      - name: Image SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository_owner }}/augustad@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: augustad-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/augustad
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: augustad-image.spdx.json
          push-to-registry: true
