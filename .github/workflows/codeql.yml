name: CodeQL
# Documentation can't change what the C++ analysis finds, so a docs-only
# change skips it. Safe only because analyze is not a required check: a
# required check filtered out here would never report and block the merge.
# The weekly schedule still analyzes everything.
on:
  push:
    branches: [main, develop]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    branches: [main, develop]
    paths-ignore: ["docs/**", "**.md"]
  schedule:
    - cron: "0 6 * * 1"
permissions:
  contents: read
  security-events: write
  packages: read
  # Deleting superseded cache entries (.github/actions/prune-cache).
  actions: write
jobs:
  analyze:
    # Pinned rather than ubuntu-latest - see the comment on ci.yml's
    # client-x64-windows job.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # The same toolchain and vcpkg binary cache as ci.yml's Linux jobs: the
      # clang the linux preset compiles with (ADR-0008), so the packages they
      # built are the ones this job needs.
      - uses: ./.github/actions/setup-linux-build
        with:
          sccache: "false"
      # Real CMake/vcpkg build rather than CodeQL's autobuild, which
      # doesn't know how to init the vcpkg submodule or pick our preset.
      # Configured before init, so CodeQL traces only our Build below: under
      # its tracer, building the vcpkg dependencies took over an hour, for
      # third-party code nothing here analyzes.
      - name: Configure
        # Without the client, as ci.yml's server-x64-linux job (which says why).
        run: cmake --preset linux -DAUGUSTA_CLIENT=OFF
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
      - uses: ./.github/actions/save-vcpkg-cache
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        id: init
        with:
          languages: cpp
          build-mode: manual
      - name: Build
        run: cmake --build --preset linux --target all augusta_tests
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
      # Analyzing main, the default branch, analyze saves the TRAP cache (the
      # extracted headers every later analysis restores from main) under a key
      # of this commit, ~1 GB each, and never deletes the one before: only the
      # newest is restored, so the older are deleted. The prefix spans every
      # CodeQL version, whose entries this version never restores either; the
      # "1" is the codeql-action's cache format version, and should it change,
      # keep matches nothing and nothing is pruned.
      - if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/prune-cache
        with:
          prefix: codeql-trap-
          keep: codeql-trap-1-${{ steps.init.outputs.codeql-version }}-cpp-${{ github.sha }}
