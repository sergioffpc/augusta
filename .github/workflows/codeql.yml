name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    # Pinned rather than ubuntu-latest - see ci.yml's build-client comment.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # See ci.yml's build-server for why this is a files-based cache
      # rather than the NuGet/GitHubPackages default: nuget.exe runs
      # under Mono here, and Mono's untrusted-by-default cert store
      # fails every restore/push with CERTIFICATE_VERIFY_FAILED.
      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-bincache
          key: vcpkg-bincache-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-

      - name: Bootstrap vcpkg
        run: ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: cpp
          build-mode: manual

      # Real CMake/vcpkg build rather than CodeQL's autobuild, which
      # doesn't know how to init the vcpkg submodule or pick our preset.
      - name: Configure
        run: cmake --preset linux
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"

      - name: Build
        run: cmake --build --preset linux

      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
