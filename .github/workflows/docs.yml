name: Docs
# The documentation site (ADR-0046): every pull request builds it, so a broken
# build fails before merge, and main, what is released, is published on GitHub
# Pages, on every push or by hand, and again every day, after the nightly, so
# the benchmark history it carries is the latest.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
# One deployment at a time, and none cut off part way.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # Pinned rather than ubuntu-latest - see ci.yml's client job comment.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install --yes doxygen
      - name: Build
        run: make docs
      - name: Add the benchmark history
        # The nightly's chart and results (ADR-0013), from the branch it
        # records them on, under benchmarks/. Absent until the first night has
        # run, and then the site is published without it.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if git ls-remote --exit-code --heads origin benchmarks; then
            git fetch --depth 1 origin benchmarks
            mkdir -p build/docs-site/benchmarks
            git archive FETCH_HEAD nightly | tar -x --strip-components=1 -C build/docs-site/benchmarks
          fi
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs-site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
