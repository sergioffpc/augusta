name: Nightly jobs
# The checks too slow or noisy for every pull request (ADR-0013), called by
# nightly.yml. They live here rather than there so a scheduled run uses
# develop's copy of them: a change to how develop builds or tests lands with
# the jobs that run it, not when main next catches up.
on:
  workflow_call:
    inputs:
      ref:
        description: The branch every job checks out and tests.
        required: true
        type: string
# What every job gets unless it says otherwise: a read of the code, and
# deleting superseded cache entries (.github/actions/prune-cache).
permissions:
  contents: read
  actions: write
env:
  SCCACHE_GHA_ENABLED: "true"
  NIGHTLY_REF: ${{ inputs.ref }}
jobs:
  property-tests:
    runs-on: ubuntu-26.04
    # See ci.yml's server job for why this isn't the NuGet feed.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
          submodules: true
      - uses: ./.github/actions/setup-linux-build
      - name: Configure
        run: cmake --preset linux
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux --target all augusta_tests
      - name: Test (property tests, ~10 000 cases)
        # The same binaries a pull request runs at RapidCheck's default 100
        # cases; only RC_PARAMS differs. A failure prints its seed and shrunk
        # case, for turning into an example-based regression test.
        env:
          RC_PARAMS: max_success=10000
        run: ctest --preset linux --label-regex '^property$' --no-tests=error
  fuzz:
    # Each fuzz target for about 30 minutes (ADR-0013), from the corpus earlier
    # nights grew, kept in the Actions cache rather than the repository.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        target: [protocol_decode, pack_load]
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
      CORPUS: fuzz-corpus/${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
          submodules: true
      - uses: ./.github/actions/setup-linux-build
      - name: Configure (libFuzzer + ASan)
        run: cmake --preset linux-fuzz
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux-fuzz --target all augusta_tests
      - name: Restore the corpus
        # A cache entry can't be overwritten, so each night saves under its own
        # run id and restores the newest one by prefix.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        # New inputs go to the cached corpus, never into the committed seeds;
        # a crash lands in fuzz-crashes/ and fails the job.
        run: |
          mkdir -p "$CORPUS" fuzz-crashes
          "build/x64-linux-fuzz/tests/fuzz/augusta_${{ matrix.target }}_fuzz" \
            -max_total_time=1800 -timeout=5 -artifact_prefix="fuzz-crashes/${{ matrix.target }}-" \
            "$CORPUS" "tests/fuzz/corpus/${{ matrix.target }}"
      - name: Minimize the corpus
        # Keeps only the inputs that add coverage, so the cache stops growing
        # once coverage does. Skipped after a crash: the step above already failed.
        run: |
          mkdir -p minimized
          "build/x64-linux-fuzz/tests/fuzz/augusta_${{ matrix.target }}_fuzz" -merge=1 minimized "$CORPUS"
          rm -rf "$CORPUS"
          mv minimized "$CORPUS"
      - name: Save the corpus
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      # Each night's corpus holds the one before, minimized: the older entries
      # are superseded.
      - if: success()
        uses: ./.github/actions/prune-cache
        with:
          prefix: fuzz-corpus-${{ matrix.target }}-
          keep: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz-crashes/
          if-no-files-found: ignore
  tsan:
    # ctest under ThreadSanitizer, for data races across the threading model's
    # threads (ADR-0005). A report fails the test it came from; known false
    # positives are suppressed in tests/tsan.supp, each with its reason.
    runs-on: ubuntu-26.04
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
          submodules: true
      - uses: ./.github/actions/setup-linux-build
      - name: Lower ASLR entropy
        # TSan's shadow memory layout doesn't fit the kernel's default
        # mmap_rnd_bits on current runner images, and aborts every binary with
        # "unexpected memory mapping" before a test runs.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure (TSan)
        run: cmake --preset linux-tsan
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux-tsan --target all augusta_tests
      - name: Test
        run: ctest --preset linux-tsan
  netcode:
    # Scripted players against an in-process server under the transport's
    # simulated latency, jitter, loss and reordering, from a broadband link to
    # the agreed worst case (ADR-0013): every one plays through, corrections
    # stay bounded and shots within the lag compensation window are confirmed
    # as hits.
    # Minutes of real time a profile, so not on every pull request.
    runs-on: ubuntu-26.04
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
          submodules: true
      - uses: ./.github/actions/setup-linux-build
      - name: Configure
        run: cmake --preset linux
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux --target augusta_tests
      - name: Test (netcode under an impaired link)
        run: ctest --preset linux-netcode --no-tests=error
  coverage:
    # An llvm-cov report of the Linux ctest run, uploaded as a run artifact:
    # a report for finding untested deterministic logic, never a gate
    # (ADR-0013), so no percentage fails anything.
    runs-on: ubuntu-26.04
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
          submodules: true
      - uses: ./.github/actions/setup-linux-build
        with:
          # llvm-profdata and llvm-cov, the same version as the clang.
          extra-packages: llvm
      - name: Configure (coverage)
        run: cmake --preset linux-coverage
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux-coverage --target all augusta_tests
      - name: Test
        run: ctest --preset linux-coverage
      - name: Report
        # Also after a failing test: what ran still counts, and the failure
        # itself is reported by the step above.
        if: success() || failure()
        run: scripts/coverage-report.sh coverage-report
      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: ignore
  benchmarks:
    # The hot-path micro-benchmarks (ADR-0013), compared with the history the
    # nights before kept on the benchmarks branch. A shared runner is noisy, so
    # only a benchmark more than twice as slow as the night before fails the job,
    # which opens the nightly-failure issue like any other; the slower result is
    # recorded all the same, so the next night compares with it.
    runs-on: ubuntu-26.04
    permissions:
      # Pushing the night's results to the benchmarks branch.
      contents: write
      actions: write
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
          submodules: true
      - uses: ./.github/actions/setup-linux-build
      - name: Configure
        run: cmake --preset linux
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux --target augusta_benchmarks
      - name: Benchmark
        # Five repetitions, of which only the median is kept: one slow
        # repetition on a busy runner moves it less than it would a mean.
        run: |
          build/x64-linux/tests/augusta_benchmarks --benchmark_repetitions=5 --benchmark_report_aggregates_only=true \
            --benchmark_out=benchmark-all.json --benchmark_out_format=json
          jq '.benchmarks |= map(select(.aggregate_name == "median"))' benchmark-all.json > benchmark-results.json
      - name: Find the benchmarked commit
        # A scheduled run's own commit is main's, not the one benchmarked.
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Start the history
        # The first night on develop starts the benchmarks branch, with one
        # empty commit, for the step below to record on. A manual run on
        # another branch before then has no history to compare with, and
        # skips it.
        id: history
        run: |
          if git ls-remote --exit-code --heads origin benchmarks > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$NIGHTLY_REF" = develop ]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            commit="$(git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit-tree "$empty_tree" -m "chore: start the benchmark history")"
            git push origin "$commit:refs/heads/benchmarks"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare with the history and record
        if: steps.history.outputs.exists == 'true'
        # Kept on its own branch, not in docs/ (which holds decisions only);
        # the docs site publishes its chart under benchmarks/ (ADR-0046). Only
        # develop's nights are recorded: a manual run on another branch is
        # compared with them and leaves no trace.
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Hot paths
          tool: googlecpp
          output-file-path: benchmark-results.json
          ref: ${{ steps.commit.outputs.sha }}
          gh-repository: github.com/${{ github.repository }}
          gh-pages-branch: benchmarks
          benchmark-data-dir-path: nightly
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ env.NIGHTLY_REF == 'develop' }}
          alert-threshold: "200%"
          fail-on-alert: true
          summary-always: true
  # A new nightly job adds itself to `needs` here, and nothing else: this job
  # reports on every job it waits for.
  report-failure:
    needs: [property-tests, fuzz, tsan, netcode, coverage, benchmarks]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      NEEDS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the nightly-failure issue
        # One open issue at a time: a failure while one is open comments on it,
        # so a check that keeps failing doesn't pile up duplicates. Closing it
        # is left to whoever fixes the failure.
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure") | "- `\(.key)`"' <<< "$NEEDS")"
          body="$(printf 'The nightly on `%s` failed: %s\n\nFailed jobs:\n%s\n' "$NIGHTLY_REF" "$RUN_URL" "$failed")"

          # --force: creates the label on first use, and is a no-op after.
          gh label create nightly-failure --force \
            --color B60205 --description "A nightly workflow run failed"

          open_issue="$(gh issue list --label nightly-failure --state open \
            --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "$body"
          else
            gh issue create --title "Nightly failure" --label nightly-failure --body "$body"
          fi
