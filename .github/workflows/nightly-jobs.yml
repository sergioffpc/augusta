name: Nightly jobs
# The checks too slow or noisy for every pull request (ADR-0013), called by
# nightly.yml every night and by release.yml on every release, which publishes
# only if they all pass. They live here rather than in nightly.yml so a
# scheduled run uses develop's copy of them: a change to how develop builds or
# tests lands with the jobs that run it, not when main next catches up.
on:
  workflow_call:
    inputs:
      ref:
        description: The branch, or a release's commit, every job checks out and tests. Benchmarks are recorded only for develop.
        required: true
        type: string
      release:
        description: Whether release.yml is the caller. Then a failure opens no nightly-failure issue (the release's own run is where it shows), sbom-scan scans the SBOMs the caller uploaded as sbom-<executable> artifacts before the call instead of the latest release's, and the fuzz corpus is not saved.
        required: false
        type: boolean
        default: false
# No workflow-level permissions: in a called workflow they are also the most
# any of its jobs may ask for, which would keep benchmarks from pushing and
# report-failure from writing issues. Each job names its own instead, within
# what the calling job grants: nightly.yml's and release.yml's, each of which
# must grant them all.
env:
  SCCACHE_GHA_ENABLED: "true"
  NIGHTLY_REF: ${{ inputs.ref }}
# Every job but client-linux configures with the client off (AUGUSTA_CLIENT):
# each checks what augustad and the shared core are built from, as ci.yml's
# Linux jobs do, and client-linux alone builds the Linux client.
jobs:
  property-tests:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Deleting superseded cache entries (.github/actions/prune-cache).
      actions: write
    # See ci.yml's server job for why this isn't the NuGet feed.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
          submodules: true
      - uses: ./.github/actions/setup-linux-build
      - name: Configure
        run: cmake --preset linux -DAUGUSTA_CLIENT=OFF
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux --target all augusta_tests
      - name: Test (property tests, ~10 000 cases)
        # The same binaries a pull request runs at RapidCheck's default 100
        # cases; only RC_PARAMS differs. A failure prints its seed and shrunk
        # case, for turning into an example-based regression test.
        env:
          RC_PARAMS: max_success=10000
        run: ctest --preset linux --label-regex '^property$' --no-tests=error --output-junit "$GITHUB_WORKSPACE/junit/property.xml"
      - name: Upload the test results
        # For test-report below, also after a failing test.
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-property
          path: junit/
          if-no-files-found: ignore
  fuzz:
    # Each fuzz target for about 30 minutes (ADR-0013), from the corpus earlier
    # nights grew, kept in the Actions cache rather than the repository.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Deleting superseded cache entries (.github/actions/prune-cache).
      actions: write
    strategy:
      fail-fast: false
      matrix:
        target: [protocol_decode, capture_read, pack_load]
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
      CORPUS: fuzz-corpus/${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
          submodules: true
      - uses: ./.github/actions/setup-linux-build
      - name: Configure (libFuzzer + ASan)
        run: cmake --preset linux-fuzz -DAUGUSTA_CLIENT=OFF
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux-fuzz --target all augusta_tests
      - name: Restore the corpus
        # A cache entry can't be overwritten, so each night saves under its own
        # run id and restores the newest one by prefix.
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        # New inputs go to the cached corpus, never into the committed seeds;
        # a crash lands in fuzz-crashes/ and fails the job.
        run: |
          mkdir -p "$CORPUS" fuzz-crashes
          "build/x64-linux-fuzz/tests/fuzz/augusta_${{ matrix.target }}_fuzz" \
            -max_total_time=1800 -timeout=5 -artifact_prefix="fuzz-crashes/${{ matrix.target }}-" \
            "$CORPUS" "tests/fuzz/corpus/${{ matrix.target }}"
      - name: Minimize the corpus
        # Keeps only the inputs that add coverage, so the cache stops growing
        # once coverage does. Skipped after a crash: the step above already failed.
        run: |
          mkdir -p minimized
          "build/x64-linux-fuzz/tests/fuzz/augusta_${{ matrix.target }}_fuzz" -merge=1 minimized "$CORPUS"
          rm -rf "$CORPUS"
          mv minimized "$CORPUS"
      # Not from a release, tag or dry run: a night restores only main's
      # caches (scheduled runs are on main, the default branch), never a tag's
      # or a branch's, so the entry would be no later night's corpus, only
      # room taken from the caches that are. A release restores main's in turn.
      - name: Save the corpus
        if: success() && !inputs.release
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.CORPUS }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      # Each night's corpus holds the one before, minimized: the older entries
      # are superseded.
      - if: success() && !inputs.release
        uses: ./.github/actions/prune-cache
        with:
          prefix: fuzz-corpus-${{ matrix.target }}-
          keep: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz-crashes/
          if-no-files-found: ignore
  tsan:
    # ctest under ThreadSanitizer, for data races across the threading model's
    # threads (ADR-0005). A report fails the test it came from; known false
    # positives are suppressed in tests/tsan.supp, each with its reason.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Deleting superseded cache entries (.github/actions/prune-cache).
      actions: write
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
          submodules: true
      - uses: ./.github/actions/setup-linux-build
      - name: Lower ASLR entropy
        # TSan's shadow memory layout doesn't fit the kernel's default
        # mmap_rnd_bits on current runner images, and aborts every binary with
        # "unexpected memory mapping" before a test runs.
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure (TSan)
        run: cmake --preset linux-tsan -DAUGUSTA_CLIENT=OFF
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux-tsan --target all augusta_tests
      - name: Test
        run: ctest --preset linux-tsan --output-junit "$GITHUB_WORKSPACE/junit/tsan.xml"
      - name: Upload the test results
        # For test-report below, also after a failing test.
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-tsan
          path: junit/
          if-no-files-found: ignore
  netcode:
    # Agents against an in-process server under the transport's
    # simulated latency, jitter, loss and reordering, from a broadband link to
    # the agreed worst case (ADR-0013): every one plays through, corrections
    # stay bounded and shots within the lag compensation window are confirmed
    # as hits.
    # Minutes of real time a profile, so not on every pull request.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Deleting superseded cache entries (.github/actions/prune-cache).
      actions: write
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
          submodules: true
      - uses: ./.github/actions/setup-linux-build
      - name: Configure
        run: cmake --preset linux -DAUGUSTA_CLIENT=OFF
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux --target augusta_tests
      - name: Test (netcode under an impaired link)
        run: ctest --preset linux-netcode --no-tests=error --output-junit "$GITHUB_WORKSPACE/junit/netcode.xml"
      - name: Upload the test results
        # For test-report below, also after a failing test.
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-netcode
          path: junit/
          if-no-files-found: ignore
  coverage:
    # An llvm-cov report of the Linux ctest run, uploaded as a run artifact
    # and part of test-report below:
    # a report for finding untested deterministic logic, never a gate
    # (ADR-0013), so no percentage fails anything.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Deleting superseded cache entries (.github/actions/prune-cache).
      actions: write
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
          submodules: true
      - uses: ./.github/actions/setup-linux-build
      - name: Configure (coverage)
        run: cmake --preset linux-coverage -DAUGUSTA_CLIENT=OFF
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux-coverage --target all augusta_tests
      - name: Test
        # The whole Linux suite, so its results are test-report's linux column.
        run: ctest --preset linux-coverage --output-junit "$GITHUB_WORKSPACE/junit/linux.xml"
      - name: Upload the test results
        # For test-report below, also after a failing test.
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-linux
          path: junit/
          if-no-files-found: ignore
      - name: Report
        # Also after a failing test: what ran still counts, and the failure
        # itself is reported by the step above.
        if: success() || failure()
        run: scripts/coverage-report.sh coverage-report
      - name: Upload the report
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage-report/
          if-no-files-found: ignore
  client-linux:
    # The Linux client (ADR-0006), which no pull request builds: the linux
    # preset with the client on, as a Linux developer builds it, and its whole
    # ctest suite, the renderer smoke test among it on Ubuntu's lavapipe in a
    # virtual X server. So a change that breaks augustac on Linux, or the shared
    # code under the client's build, surfaces within a night.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Deleting superseded cache entries (.github/actions/prune-cache).
      actions: write
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
          submodules: true
      - uses: ./.github/actions/setup-linux-build
        with:
          # The client's system packages, as scripts/bootstrap/linux.sh
          # installs them (which says why each).
          extra-packages: >-
            libgl-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libvulkan1 mesa-vulkan-drivers xauth xvfb
          # It installs the client's ports, which no other Linux job does and
          # whose saves would drop: a cache of its own.
          vcpkg-cache-prefix: vcpkg-bincache-client-linux-
      - name: Configure
        run: cmake --preset linux
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux --target all augusta_tests
      - name: Check that the smoke test is built
        # tests/CMakeLists.txt leaves it out, with only a configure message,
        # where it finds no lavapipe.
        run: test -x build/x64-linux/tests/augusta_client_renderer_smoke_tests
      - name: Test
        # In a virtual X server, where the smoke test opens its hidden window:
        # GLFW picks X11, as there is no Wayland session.
        run: xvfb-run --auto-servernum ctest --preset linux --output-junit "$GITHUB_WORKSPACE/junit/client-linux.xml"
      - name: Upload the test results
        # For test-report below, also after a failing test.
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-client-linux
          path: junit/
          if-no-files-found: ignore
      - name: Check the client's tarball
        # What each release publishes (release.yml): the folder the client's
        # install rules stage, tarred, with augustac started from its extracted
        # copy with only the system's libraries, what it links held to the
        # allowlist, and its debug info matched by build ID
        # (scripts/stage-client.sh, ADR-0058).
        run: scripts/stage-client.sh build/x64-linux "$RUNNER_TEMP/augustac" "$RUNNER_TEMP/augustac-linux-x64.tar.gz"
      - name: Check the client's SBOM
        # release.yml's SBOM of it, and the CPEs sbom-scan adds to it, as
        # ci.yml checks the Windows client's: a dependency the build gains with
        # neither a CPE nor a reason fails here rather than the release.
        run: |
          python3 scripts/vcpkg-sbom.py --name augustac --version "$GITHUB_SHA" \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --git-package third_party/nvtx \
            build/x64-linux/vcpkg_installed/x64-linux > "$RUNNER_TEMP/augustac.spdx.json"
          python3 scripts/sbom-cpes.py "$RUNNER_TEMP/augustac.spdx.json" > /dev/null
  benchmarks:
    # The hot-path micro-benchmarks (ADR-0013), compared with the history the
    # nights before kept on the benchmarks branch, one history per runner CPU
    # model. A shared runner is noisy, so only a benchmark more than twice as
    # slow as the last night on the same CPU fails the job, which opens the
    # nightly-failure issue like any other; the slower result is recorded all
    # the same, so the next night compares with it. A release's ref is a
    # commit, never develop, so it is compared on the same threshold and
    # recorded nowhere: the history stays develop's nights.
    runs-on: ubuntu-26.04
    permissions:
      # Pushing the night's results to the benchmarks branch.
      contents: write
      actions: write
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
          submodules: true
      - uses: ./.github/actions/setup-linux-build
      - name: Configure
        run: cmake --preset linux -DAUGUSTA_CLIENT=OFF
      - uses: ./.github/actions/save-vcpkg-cache
      - name: Build
        run: cmake --build --preset linux --target augusta_benchmarks
      - name: Benchmark
        # Five repetitions, of which only the median is kept: one slow
        # repetition on a busy runner moves it less than it would a mean.
        run: |
          build/x64-linux/tests/augusta_benchmarks --benchmark_repetitions=5 --benchmark_report_aggregates_only=true \
            --benchmark_out=benchmark-all.json --benchmark_out_format=json
          jq '.benchmarks |= map(select(.aggregate_name == "median"))' benchmark-all.json > benchmark-results.json
      - name: Find the benchmarked commit
        # A scheduled run's own commit is main's, not the one benchmarked.
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Find the runner's CPU
        # GitHub-hosted runners of one label come on several CPU models, the
        # fastest about twice as quick as the slowest at these benchmarks: a
        # night is only compared with the nights before on the same model. No
        # model name fails the step, not lumps every such night together.
        id: cpu
        run: |
          model="$(sed -n 's/^model name[[:space:]]*: *//p' /proc/cpuinfo | head -n 1)"
          test -n "$model"
          echo "model=$model" >> "$GITHUB_OUTPUT"
      - name: Start the history
        # The first night on develop starts the benchmarks branch, with one
        # empty commit, for the step below to record on. A manual run on
        # another branch before then has no history to compare with, and
        # skips it.
        id: history
        run: |
          if git ls-remote --exit-code --heads origin benchmarks > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$NIGHTLY_REF" = develop ]; then
            empty_tree="$(git hash-object -t tree /dev/null)"
            commit="$(git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit-tree "$empty_tree" -m "chore: start the benchmark history")"
            git push origin "$commit:refs/heads/benchmarks"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Compare with the history and record
        if: steps.history.outputs.exists == 'true'
        # Kept on its own branch, not in docs/ (which holds decisions only);
        # the docs site publishes its chart under benchmarks/ (ADR-0046). Only
        # develop's nights are recorded: a manual run on another branch is
        # compared with them and leaves no trace.
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Hot paths (${{ steps.cpu.outputs.model }})
          tool: googlecpp
          output-file-path: benchmark-results.json
          ref: ${{ steps.commit.outputs.sha }}
          gh-repository: github.com/${{ github.repository }}
          gh-pages-branch: benchmarks
          benchmark-data-dir-path: nightly
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ env.NIGHTLY_REF == 'develop' }}
          alert-threshold: "200%"
          fail-on-alert: true
          summary-always: true
  sbom-scan:
    # The latest release's executables, by their SBOMs, against the night's
    # vulnerability data: a CVE published after the release fails here with
    # nothing rebuilt. From a release (inputs.release), the executables that
    # release is about to publish instead, by the SBOMs its own build jobs
    # uploaded. Each SBOM gets its dependencies' CPEs first
    # (scripts/sbom-cpes.py), which grype matches against the NVD; no
    # database has advisories for the vcpkg purls the SBOM names them by.
    # augustad-linux-arm64's SBOM names the same ports at the same versions as
    # augustad-linux-x64's (one vcpkg manifest and baseline), so x64's covers
    # both.
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        executable: [augustac-windows-x64, augustac-linux-x64, augustad-linux-x64]
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
      - name: Download the latest release's SBOM
        # An executable no release has published yet (augustac-linux-x64
        # before the first release that ships it) has nothing to scan: a
        # notice, not a failure. A release publishes all its assets or none,
        # so once one has it, every later one does.
        id: latest
        if: ${{ !inputs.release }}
        run: |
          sbom="${{ matrix.executable }}.spdx.json"
          if ! gh release view --json assets --jq '.assets[].name' | grep -qxF "$sbom"; then
            echo "::notice::The latest release publishes no $sbom: nothing to scan."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download --pattern "$sbom"
      - name: Download this run's SBOM
        if: inputs.release
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-${{ matrix.executable }}
      - name: Add the CPEs
        if: steps.latest.outputs.published != 'false'
        run: python3 scripts/sbom-cpes.py "${{ matrix.executable }}.spdx.json" > sbom.spdx.json
      - name: Scan
        if: steps.latest.outputs.published != 'false'
        # Fails on a high or critical CVE, fixed or not - unlike the server
        # image's scan (ci.yml): a CPE match comes from the NVD, which gives
        # most ranges as "up to and including" with no fixed version, so only
        # fixed CVEs would leave out most of them. .grype.yaml has the CVEs
        # assessed as not reaching an executable, and why.
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.spdx.json
          config: .grype.yaml
          severity-cutoff: high
          output-format: table
  test-report:
    # The nightly's tests in one HTML report (ADR-0013, scripts/test-report.sh):
    # every ctest run above, a row per test and a column per job, and the
    # coverage job's llvm-cov report. Uploaded as a run artifact; the
    # documentation site publishes the latest scheduled night's under tests/
    # (ADR-0046), so a release's stays an artifact of its run. Also after a
    # failing test, which is when it is read.
    needs: [property-tests, tsan, netcode, coverage, client-linux]
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
      # By pattern, so a job that uploaded nothing leaves its part empty
      # rather than failing the download.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: junit
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-report
          path: coverage-report
          merge-multiple: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Render
        run: scripts/test-report.sh junit coverage-report test-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-report
          path: test-report/
  # A new nightly job adds itself to `needs` here, and nothing else: this job
  # reports on every job it waits for, and release.yml waits for the whole
  # call. Not from a release (inputs.release), whose failure fails its run.
  report-failure:
    needs: [property-tests, fuzz, tsan, netcode, coverage, client-linux, benchmarks, sbom-scan, test-report]
    if: always() && !inputs.release && contains(needs.*.result, 'failure')
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      NEEDS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the nightly-failure issue
        # One open issue at a time: a failure while one is open comments on it,
        # so a check that keeps failing doesn't pile up duplicates. Closing it
        # is left to whoever fixes the failure.
        run: |
          # The backticks are Markdown for the issue, not command substitution.
          # shellcheck disable=SC2016
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure") | "- `\(.key)`"' <<< "$NEEDS")"
          # shellcheck disable=SC2016
          body="$(printf 'The nightly on `%s` failed: %s\n\nFailed jobs:\n%s\n' "$NIGHTLY_REF" "$RUN_URL" "$failed")"

          # --force: creates the label on first use, and is a no-op after.
          gh label create nightly-failure --force \
            --color B60205 --description "A nightly workflow run failed"

          open_issue="$(gh issue list --label nightly-failure --state open \
            --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "$body"
          else
            gh issue create --title "Nightly failure" --label nightly-failure --body "$body"
          fi
