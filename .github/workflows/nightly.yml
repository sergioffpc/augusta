name: Nightly
# GitHub runs a schedule from the default branch's copy of this file (main),
# while the nightly tests develop. So a scheduled run calls develop's copy of
# the jobs (nightly-jobs.yml), never main's: main's would build develop the way
# main builds. A manual run calls the copy on the branch it was started on and
# tests that branch, which is how a change to the jobs is tried before merging.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
# One nightly at a time per branch, but never cancel a running one: its result
# is the only report there is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
# A called workflow gets at most what its calling job grants, and
# nightly-jobs.yml narrows that again per job: only the benchmarks job may
# push, and only report-failure may write issues.
jobs:
  scheduled:
    if: github.event_name == 'schedule'
    uses: sergioffpc/augusta/.github/workflows/nightly-jobs.yml@develop
    permissions:
      # Recording the benchmark results on the benchmarks branch.
      contents: write
      # Deleting superseded cache entries (.github/actions/prune-cache).
      actions: write
      # Opening or updating the nightly-failure issue.
      issues: write
    with:
      ref: develop
  manual:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/nightly-jobs.yml
    permissions:
      contents: write
      actions: write
      issues: write
    with:
      ref: ${{ github.ref_name }}
