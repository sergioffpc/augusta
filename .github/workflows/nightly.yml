name: Nightly

# The checks too slow or noisy for every pull request (ADR-0013). GitHub runs a
# schedule from the default branch's copy of this file (main), so each job
# checks out develop explicitly; a manual run tests the branch it was started
# on instead, which is how a change to this workflow is tried before merging.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# One nightly at a time per branch, but never cancel a running one: its result
# is the only report there is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"
  # What every job checks out - see the comment on `on` above.
  NIGHTLY_REF: ${{ github.event_name == 'schedule' && 'develop' || github.ref_name }}

jobs:
  property-tests:
    runs-on: ubuntu-26.04
    # See ci.yml's build-server for why this isn't the NuGet feed.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.NIGHTLY_REF }}
          submodules: true

      - uses: ./.github/actions/setup-linux-build

      - name: Configure
        run: cmake --preset linux

      - name: Build
        run: cmake --build --preset linux

      - name: Test (property tests, ~10 000 cases)
        # The same binaries a pull request runs at RapidCheck's default 100
        # cases; only RC_PARAMS differs. A failure prints its seed and shrunk
        # case, for turning into an example-based regression test.
        env:
          RC_PARAMS: max_success=10000
        run: ctest --preset linux --label-regex '^property$' --no-tests=error

  # A new nightly job adds itself to `needs` here, and nothing else: this job
  # reports on every job it waits for.
  report-failure:
    needs: [property-tests]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-26.04
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      NEEDS: ${{ toJSON(needs) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the nightly-failure issue
        # One open issue at a time: a failure while one is open comments on it,
        # so a check that keeps failing doesn't pile up duplicates. Closing it
        # is left to whoever fixes the failure.
        run: |
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure") | "- `\(.key)`"' <<< "$NEEDS")"
          body="$(printf 'The nightly on `%s` failed: %s\n\nFailed jobs:\n%s\n' "$NIGHTLY_REF" "$RUN_URL" "$failed")"

          # --force: creates the label on first use, and is a no-op after.
          gh label create nightly-failure --force \
            --color B60205 --description "A nightly workflow run failed"

          open_issue="$(gh issue list --label nightly-failure --state open \
            --limit 1 --json number --jq '.[0].number // empty')"
          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --body "$body"
          else
            gh issue create --title "Nightly failure" --label nightly-failure --body "$body"
          fi
