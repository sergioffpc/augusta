name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHubPackages,readwrite"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-client:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Ninja
        run: choco install ninja -y
        shell: pwsh

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\third_party\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure vcpkg NuGet cache
        shell: pwsh
        run: |
          $nugetPath = & ".\third_party\vcpkg\vcpkg" fetch nuget | Select-Object -Last 1
          & $nugetPath sources add -Name GitHubPackages -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -Username "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText
          & $nugetPath setapikey "${{ secrets.GITHUB_TOKEN }}" -Source GitHubPackages

      - name: Configure
        run: cmake --preset windows
        shell: pwsh

      - name: Build
        run: cmake --build --preset windows

      - name: Stage binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\x64-windows\src\client\augustac.exe dist\augustac-windows-x64.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-binary
          path: dist/augustac-windows-x64.exe

  build-server:
    runs-on: ubuntu-26.04
    # See ci.yml's build-server for why this isn't the workflow-level
    # NuGet default: nuget.exe runs under Mono here, and Mono's
    # untrusted-by-default cert store fails every restore/push with
    # CERTIFICATE_VERIFY_FAILED.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache vcpkg binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vcpkg-bincache
          key: vcpkg-bincache-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-

      - name: Bootstrap vcpkg
        run: ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure
        run: cmake --preset linux

      - name: Build
        run: cmake --build --preset linux

      - name: Stage binary
        run: |
          mkdir -p dist
          cp build/x64-linux/src/server/augustad dist/augustad-linux-x64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-binary
          path: dist/augustad-linux-x64

  build-tools:
    runs-on: windows-2025
    # Offline authoring tooling's native support modules
    # (tools/asset-pipeline/cooking, ARCHITECTURE.md "Tooling" section) -
    # never shipped in the client/server binaries above. The asset cooker
    # itself is pure Python (tools/asset-pipeline, ADR-0030); this job only
    # builds its two small native bindings. Also covered path-filtered on
    # every PR by ci.yml's own (identically-named) build-tools job; this is
    # the unconditional release-gate build of the same targets. The
    # windows-tools preset (CMakePresets.json) sets AUGUSTA_BUILD_RUNTIME=
    # OFF/AUGUSTA_BUILD_TOOLS=ON and narrows VCPKG_MANIFEST_FEATURES to
    # just "tools", so this job's vcpkg install skips flecs/
    # GameNetworkingSockets/PhysX entirely.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Ninja
        run: choco install ninja -y
        shell: pwsh

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\third_party\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure vcpkg NuGet cache
        shell: pwsh
        run: |
          $nugetPath = & ".\third_party\vcpkg\vcpkg" fetch nuget | Select-Object -Last 1
          & $nugetPath sources add -Name GitHubPackages -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -Username "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText
          & $nugetPath setapikey "${{ secrets.GITHUB_TOKEN }}" -Source GitHubPackages

      - name: Configure
        run: cmake --preset windows-tools
        shell: pwsh

      - name: Build
        run: cmake --build --preset windows-tools --target augusta_meshoptimizer_py augusta_textconv_py

  publish:
    needs: [build-client, build-server, build-tools]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/client-binary/augustac-windows-x64.exe \
            dist/server-binary/augustad-linux-x64 \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
