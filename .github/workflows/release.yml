name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHubPackages,readwrite"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build-client:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1

      - name: Install Ninja
        run: choco install ninja -y
        shell: pwsh

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\third_party\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Configure vcpkg NuGet cache
        shell: pwsh
        run: |
          $nugetPath = & ".\third_party\vcpkg\vcpkg" fetch nuget | Select-Object -Last 1
          & $nugetPath sources add -Name GitHubPackages -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -Username "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText
          & $nugetPath setapikey "${{ secrets.GITHUB_TOKEN }}" -Source GitHubPackages

      - name: Configure
        run: cmake --preset windows
        shell: pwsh

      - name: Build
        run: cmake --build --preset windows

      - name: Stage binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build-windows\src\client\augusta_client.exe dist\augusta_client-windows-x64.exe

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: client-binary
          path: dist/augusta_client-windows-x64.exe

  build-server:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true

      - name: Install Ninja + mono
        run: sudo apt-get update && sudo apt-get install -y ninja-build mono-complete

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Bootstrap vcpkg
        run: ./third_party/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure vcpkg NuGet cache
        run: |
          nuget_path=$(./third_party/vcpkg/vcpkg fetch nuget | tail -n 1)
          mono "$nuget_path" sources add -Name GitHubPackages -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" -Username "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}" -StorePasswordInClearText
          mono "$nuget_path" setapikey "${{ secrets.GITHUB_TOKEN }}" -Source GitHubPackages

      - name: Configure
        run: cmake --preset linux

      - name: Build
        run: cmake --build --preset linux

      - name: Stage binary
        run: |
          mkdir -p dist
          cp build-linux/src/server/augusta_server dist/augusta_server-linux-x64

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-binary
          path: dist/augusta_server-linux-x64

  publish:
    needs: [build-client, build-server]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/client-binary/augusta_client-windows-x64.exe \
            dist/server-binary/augusta_server-linux-x64 \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
