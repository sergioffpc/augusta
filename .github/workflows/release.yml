name: Release
on:
  push:
    tags: ["v*"]
  # A dry run: started by hand on a branch, it builds, tests and runs the
  # nightly jobs as a tag does, and publishes nothing. How a change to this
  # workflow, or to the nightly jobs it calls, is tried before it merges.
  workflow_dispatch:
# Read-only: a job that needs more declares it, and only it holds it.
permissions:
  contents: read
env:
  VCPKG_BINARY_SOURCES: "clear;nuget,GitHubPackages,readwrite"
# Each build job restores the sccache cache its ci.yml or nightly counterpart
# saved on main, and saves none: an entry on the tag's ref would be read by no
# other ref (save-sccache-cache). Only the nightly's client-x64-linux builds
# the same Shipping build as its counterpart here; ci.yml's are Development
# builds, whose objects a Shipping build, compiled with AUGUSTA_DEBUG_TOOLS=0,
# cannot reuse.
#
# What is published is a Shipping build, by construction (ADR-0074): each build
# job configures, builds, tests and stages with a shipping preset, so no debug
# tool is in a published binary, and a client whose version ends in +dev (a
# Development build) fails the tag's exact --version check.
#
# What is published is tested first (ADR-0013): each build job runs ctest on
# the Shipping binaries it stages, which includes loading the golden packs, and
# the nightly job runs every nightly check on the same commit. publish needs
# them all, so a failing test publishes nothing. The tools, which a release
# publishes none of, are tested by ci.yml's build jobs, the cooker's cook of the
# golden packs among them, on every commit the release branch merged.
#
# The jobs restore the vcpkg and uv caches but save neither, nor do the nightly
# jobs (their release input): an entry saved here is scoped to the tag, which
# only a rerun of the same release restores from, and would only push the
# caches in use out of the repository's 10 GB. A rerun restores main's, as any
# ref does.
jobs:
  client-x64-windows:
    runs-on: windows-2025
    permissions:
      contents: read
      # Pushing the vcpkg binaries it builds to the GitHub Packages NuGet feed
      # (VCPKG_BINARY_SOURCES above, setup-windows-vcpkg).
      packages: write
      # Signing the binaries' provenance and SBOM attestations (Sigstore,
      # through the workflow's OIDC token) and storing them in the repository.
      id-token: write
      attestations: write
    # Git Bash, as everywhere else: no PowerShell in the repository.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the submodules
        # As ci.yml's client-x64-windows job does: vcpkg and NVTX alone.
        run: git submodule update --init --depth 1 third_party/vcpkg third_party/nvtx
      # clang-cl and lld-link, which the windows presets build with (ADR-0008),
      # and, as in ci.yml, no Visual Studio developer environment: the MSVC
      # sysroot comes with the toolchain (ADR-0079), which uv's setup precedes.
      - uses: ./.github/actions/setup-windows-llvm
      - uses: ./.github/actions/restore-sccache-cache
      - uses: ./.github/actions/setup-windows-vcpkg
        with:
          feed-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: tools/uv.lock
      - uses: ./.github/actions/setup-toolchain
      - name: Configure
        run: cmake --preset windows-shipping
      - name: Build
        run: cmake --build --preset windows-shipping --target all augusta_tests
      - name: Test
        run: ctest --preset windows-shipping
      - name: Stage the client
        # Its whole runtime folder, zipped: augustac.exe alone loads nothing.
        # The zip is checked to start on its own and print the tag's version
        # (scripts/stage-client.sh); a dry run's branch names no version, so
        # there any version passes.
        run: |
          version=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          scripts/stage-client.sh build/x64-windows-shipping "$RUNNER_TEMP/augustac" \
            dist/augustac-windows-x64.zip "$version"
          # Its PDB, from this same build, so its GUID and age are the ones
          # the zipped augustac.exe's debug directory names (ADR-0055).
          cp build/x64-windows-shipping/src/client/augustac.pdb dist/augustac-windows-x64.pdb
      # NVTX is a submodule, not a vcpkg port, so it is named by its commit.
      # The zip ships no MSVC runtime, which the player installs (ADR-0079).
      - name: SBOM
        run: |
          python scripts/vcpkg-sbom.py --name augustac --version "$GITHUB_REF_NAME" \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --git-package third_party/nvtx \
            build/x64-windows-shipping/vcpkg_installed/x64-windows > dist/augustac-windows-x64.spdx.json
      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/augustac-windows-x64.zip
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/augustac-windows-x64.zip
          sbom-path: dist/augustac-windows-x64.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-x64-windows-binary
          path: |
            dist/augustac-windows-x64.zip
            dist/augustac-windows-x64.pdb
      # An artifact of its own, named sbom-<executable>, which the nightly
      # jobs' sbom-scan downloads by that name, without the zip.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-augustac-windows-x64
          path: dist/augustac-windows-x64.spdx.json
  client-x64-linux:
    # The Linux client (ADR-0058): built as the nightly's client-x64-linux job
    # builds it, on the runner the server's x64 binary is built on, whose glibc
    # is the oldest the tarball runs on (README).
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # Signing the binaries' provenance and SBOM attestations (Sigstore,
      # through the workflow's OIDC token) and storing them in the repository.
      id-token: write
      attestations: write
    # See ci.yml's server-x64-linux job for why this isn't the NuGet feed.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: ./.github/actions/setup-linux-build
        with:
          # The client's system packages, as nightly-jobs.yml's client-x64-linux
          # job installs them.
          extra-packages: >-
            libgl-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxkbcommon-dev libxrandr-dev libvulkan1 mesa-vulkan-drivers xauth xvfb
          vcpkg-cache-prefix: vcpkg-bincache-client-linux-
      - name: Configure
        run: cmake --preset linux-shipping
      - name: Build
        run: cmake --build --preset linux-shipping --target all augusta_tests
      - name: Test
        # In a virtual X server, for the renderer smoke test's window, as the
        # nightly's client-x64-linux job runs it.
        run: xvfb-run --auto-servernum ctest --preset linux-shipping
      - name: Stage the client
        # Its runtime folder, tarred as one augustac/ folder, checked as the
        # Windows zip is, and for what it links and its debug info
        # (scripts/stage-client.sh); a dry run's branch names no version.
        run: |
          version=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          scripts/stage-client.sh build/x64-linux-shipping "$RUNNER_TEMP/augustac" \
            dist/augustac-linux-x64.tar.gz "$version"
          # Its debug info, split off by this same build, whose build ID the
          # staging check matched to the tarred augustac's (ADR-0055).
          cp build/x64-linux-shipping/src/client/augustac.debug dist/augustac-linux-x64.debug
      - name: Run the client on a clean Ubuntu 26.04
        # The extracted tarball on Ubuntu's base image alone, read-only and
        # offline: none of the runner's own libraries can stand in for one the
        # folder lacks. ubuntu:26.04, by tag, as the Dockerfiles take it.
        run: |
          mkdir "$RUNNER_TEMP/clean"
          tar -C "$RUNNER_TEMP/clean" -xzf dist/augustac-linux-x64.tar.gz
          printed="$(docker run --rm --network none -v "$RUNNER_TEMP/clean/augustac:/augustac:ro" \
            ubuntu:26.04 /augustac/augustac --version)"
          echo "$printed"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$printed" != "augustac ${GITHUB_REF_NAME#v}" ]; then
            echo "augustac prints '$printed', not 'augustac ${GITHUB_REF_NAME#v}'" >&2
            exit 1
          fi
      - name: SBOM
        run: |
          python3 scripts/vcpkg-sbom.py --name augustac --version "$GITHUB_REF_NAME" \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --git-package third_party/nvtx \
            build/x64-linux-shipping/vcpkg_installed/x64-linux > dist/augustac-linux-x64.spdx.json
      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/augustac-linux-x64.tar.gz
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/augustac-linux-x64.tar.gz
          sbom-path: dist/augustac-linux-x64.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-x64-linux-binary
          path: |
            dist/augustac-linux-x64.tar.gz
            dist/augustac-linux-x64.debug
      # As the Windows client's: sbom-<executable>, for the nightly jobs'
      # sbom-scan.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-augustac-linux-x64
          path: dist/augustac-linux-x64.spdx.json
  server:
    # Both production architectures (NFR-04), each built and tested natively.
    name: server-${{ matrix.arch }}-linux
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # Signing the binaries' provenance and SBOM attestations (Sigstore,
      # through the workflow's OIDC token) and storing them in the repository.
      id-token: write
      attestations: write
    # See ci.yml's server-x64-linux job for why this isn't the workflow-level
    # NuGet default: nuget.exe runs under Mono here, and Mono's
    # untrusted-by-default cert store fails every restore/push with
    # CERTIFICATE_VERIFY_FAILED.
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-bincache,readwrite"
      BINARY: augustad-linux-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      # The clang the linux preset compiles with (ADR-0008), and the rest of
      # the Linux toolchain.
      - uses: ./.github/actions/setup-linux-build
        with:
          # x64 compiles what ci.yml's server-x64-linux does, and restores
          # that job's cache from main. The name holds the runner's
          # architecture, so arm64, which no ci.yml job builds outside Docker,
          # restores none.
          sccache-job: server-x64-linux
      - name: Configure
        # augustad and what it is built from, without the client, whose Linux
        # build the nightly jobs below test.
        run: cmake --preset linux-shipping -DAUGUSTA_CLIENT=OFF
      - name: Build
        run: cmake --build --preset linux-shipping --target all augusta_tests
      - name: Test
        run: ctest --preset linux-shipping
      - name: Stage binary
        # The linux-shipping preset builds into build/x64-linux-shipping on
        # either architecture: the directory is the preset's, not the target's.
        run: |
          mkdir -p dist
          cp build/x64-linux-shipping/src/server/augustad "dist/$BINARY"
          # Its debug info, split off by this same build, so it matches this
          # binary's build ID - not the image's (ADR-0047).
          cp build/x64-linux-shipping/src/server/augustad.debug "dist/$BINARY.debug"
      - name: SBOM
        # vcpkg's triplet is the runner's own: x64-linux or arm64-linux.
        run: |
          python3 scripts/vcpkg-sbom.py --name augustad --version "$GITHUB_REF_NAME" \
            --repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            "build/x64-linux-shipping/vcpkg_installed/${{ matrix.arch }}-linux" > "dist/$BINARY.spdx.json"
      - name: Attest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.BINARY }}
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/${{ env.BINARY }}
          sbom-path: dist/${{ env.BINARY }}.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-binary-${{ matrix.arch }}
          path: |
            dist/${{ env.BINARY }}
            dist/${{ env.BINARY }}.debug
      # As the client's: sbom-<executable>, for the nightly jobs' sbom-scan.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ env.BINARY }}
          path: dist/${{ env.BINARY }}.spdx.json
  nightly:
    # Every nightly job on this run's commit, gating publish (ADR-0013), so a
    # job added to the nightly gates releases with nothing changed here. By SHA,
    # not the tag's name, so a tag moved while the run is going doesn't change
    # what later jobs test. After the build jobs because sbom-scan scans
    # their SBOMs, and a called workflow's job can't wait on its caller's. It
    # may overlap a night outside nightly.yml's concurrency group: with release
    # set it records no benchmark and saves no cache, so it writes nothing a
    # night reads.
    needs: [client-x64-windows, client-x64-linux, server]
    uses: ./.github/workflows/nightly-jobs.yml
    # A caller must grant every permission a called job declares, or the run is
    # invalid before it starts, even for a job its inputs skip. So this grants
    # what nightly.yml does, issues: write included for report-failure, which
    # never runs here. The grant is a ceiling, not a token: each called job
    # gets only what it declares, so no job of a release holds issues: write,
    # and benchmarks alone holds contents: write, which pushes only for develop.
    permissions:
      contents: write
      actions: write
      issues: write
    with:
      ref: ${{ github.sha }}
      release: true
  publish:
    # Not on a dry run, which publishes nothing.
    if: github.event_name == 'push'
    needs: [client-x64-windows, client-x64-linux, server, nightly]
    runs-on: ubuntu-26.04
    permissions:
      # Creating the GitHub Release and attaching the binaries to it.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag's CHANGELOG.md section, cut on its release/* or hotfix/* branch
      # (docs/ENGINEERING.md, Git Workflow); a tag without one publishes nothing.
      # Each client's baseline follows them, as the README states it: the
      # Windows client's is the VC++ redistributable versions.env pins
      # (MSVC_REDIST_VERSION), the oldest augustac starts on (ADR-0079).
      - name: Release notes
        run: |
          # shellcheck source=/dev/null
          . scripts/bootstrap/versions.env
          scripts/changelog.sh "${{ github.ref_name }}" --notes > "$RUNNER_TEMP/notes.md"
          printf '\n%s %s\n' \
            "The Windows client (augustac-windows-x64.zip) needs the Microsoft Visual C++ Redistributable (x64) $MSVC_REDIST_VERSION or newer:" \
            "https://learn.microsoft.com/cpp/windows/latest-supported-vc-redist" >> "$RUNNER_TEMP/notes.md"
          printf '\n%s\n' "The Linux client (augustac-linux-x64.tar.gz) runs on the glibc of Ubuntu 26.04 or newer." >> "$RUNNER_TEMP/notes.md"
      # Every artifact of the run, the nightly jobs' reports among them: only
      # the files named below are attached.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/client-x64-windows-binary/augustac-windows-x64.zip \
            dist/client-x64-windows-binary/augustac-windows-x64.pdb \
            dist/sbom-augustac-windows-x64/augustac-windows-x64.spdx.json \
            dist/client-x64-linux-binary/augustac-linux-x64.tar.gz \
            dist/client-x64-linux-binary/augustac-linux-x64.debug \
            dist/sbom-augustac-linux-x64/augustac-linux-x64.spdx.json \
            dist/server-binary-x64/augustad-linux-x64 \
            dist/server-binary-x64/augustad-linux-x64.debug \
            dist/sbom-augustad-linux-x64/augustad-linux-x64.spdx.json \
            dist/server-binary-arm64/augustad-linux-arm64 \
            dist/server-binary-arm64/augustad-linux-arm64.debug \
            dist/sbom-augustad-linux-arm64/augustad-linux-arm64.spdx.json \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
