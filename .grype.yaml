  - vulnerability: CVE-2020-29396
    package:
      name: ^python$
      version: 3.10.21+nv3-windows-x86_64
    reason: >-
      Odoo's safe_eval sandbox, not CPython: the NVD's CPE names every CPython from 3.6 as the platform it ran on. augustac ships no Odoo.
  - vulnerability: CVE-2023-36632
    package:
      name: ^python$
      version: 3.10.21+nv3-windows-x86_64
    reason: >-
      email.utils.parseaddr() recursion. augustac never starts Falcor's embedded interpreter (only Falcor's SampleApp and unit tests call Scripting::start(), and augusta_renderer bypasses SampleApp), so python310.dll is loaded with Falcor.dll but runs no Python code, email's included.
  - vulnerability: CVE-2026-4519
    package:
      name: ^python$
      version: 3.10.21+nv3-windows-x86_64
    reason: >-
      webbrowser.open() taking a leading dash as a browser option, fixed in 3.13.13 and not in 3.10. augustac never starts Falcor's embedded interpreter (only Falcor's SampleApp and unit tests call Scripting::start(), and augusta_renderer bypasses SampleApp), so python310.dll is loaded with Falcor.dll but runs no Python code, webbrowser's included.
