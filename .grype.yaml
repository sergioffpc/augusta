# The CVEs nightly-jobs.yml's sbom-scan doesn't fail on, each assessed as not
# reaching a shipped executable. Each rule names the package's version too, so
# a new version is scanned, and assessed, again.
ignore:
  - vulnerability: CVE-2026-85091
    package:
      name: ^zlib$
      version: 1.3.2#2
    reason: >-
      gz_vacate() is reached only through zlib's gzFile API (gzprintf or gzvprintf after a stalled non-blocking gzwrite). Nothing in augustac calls it: zlib reaches it only through steam-audio's libmysofa, whose one use of zlib (src/hdf/gunzip.c, v1.3.5) is an in-memory inflate(), and through Falcor's own dependency tree (cmake/falcor-deps), where Falcor.dll's one use (Core/Platform/OS.cpp) is an in-memory inflate() too and the loaders that link zlib (assimp, FreeImage, OpenEXR, OpenVDB) are never called.
  - vulnerability: CVE-2019-12211
    package:
      name: ^freeimage$
      version: 3.18.0#27
    # FreeImage's last release, which no newer vcpkg port replaces; these are
    # its CVEs at any severity, so a rescoring doesn't turn the scan red.
    reason: &freeimage-unreached >-
      FreeImage 3.18.0 is Falcor's image loader (Utils/Image/Bitmap.cpp), loaded with Falcor.dll, and augustac never calls it: augusta_renderer bypasses Falcor's SampleApp and loads no image, texture, scene or volume through Falcor - its geometry is built in code (src/modules/renderer/renderer.cpp), and its HUD (debug_hud.cpp) draws no image and has Falcor's TrueType fonts read by ImGui itself. No file reaches a FreeImage plugin.
  - vulnerability: CVE-2019-12212
    package:
      name: ^freeimage$
      version: 3.18.0#27
    reason: *freeimage-unreached
  - vulnerability: CVE-2019-12213
    package:
      name: ^freeimage$
      version: 3.18.0#27
    reason: *freeimage-unreached
  - vulnerability: CVE-2019-12214
    package:
      name: ^freeimage$
      version: 3.18.0#27
    reason: *freeimage-unreached
  - vulnerability: CVE-2020-21426
    package:
      name: ^freeimage$
      version: 3.18.0#27
    reason: *freeimage-unreached
  - vulnerability: CVE-2020-21427
    package:
      name: ^freeimage$
      version: 3.18.0#27
    reason: *freeimage-unreached
  - vulnerability: CVE-2020-21428
