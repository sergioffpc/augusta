apiVersion: v1
kind: Service
metadata:
  name: {{ include "augusta-server.fullname" . }}
  labels:
    {{- include "augusta-server.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "augusta-server.selectorLabels" . | nindent 4 }}
  ports:
    - name: game
      port: {{ .Values.service.port }}
      targetPort: game
      protocol: UDP
