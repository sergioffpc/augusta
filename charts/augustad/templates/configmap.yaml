apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "augustad.fullname" . }}
  labels:
    {{- include "augustad.labels" . | nindent 4 }}
data:
  # The server's startup settings (ADR-0034), as config/augustad.example.yaml
  # documents them. The pack and its key come from this environment's folder
  # of the shared asset-pack volume.
  augustad.yaml: |
    base_dir: {{ .Values.assetPacks.mountPath }}/{{ required "assetPacks.packVersion names the folder holding this environment's signed server.pack" .Values.assetPacks.packVersion }}
    content:
      pack: {{ .Values.assetPacks.pack }}
      public_key: {{ .Values.assetPacks.publicKey }}
    simulation:
      tick_rate_hz: {{ .Values.server.tickRateHz }}
    network:
      listen_address: 0.0.0.0:{{ .Values.service.port }}
    logging:
      level: {{ .Values.server.logLevel }}
