# The Server and Connection health dashboards (ADR-0049), which Grafana's
# sidecar loads from any namespace by their grafana_dashboard label.
{{- if .Values.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "augustad.fullname" . }}-dashboards
  labels:
    {{- include "augustad.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
