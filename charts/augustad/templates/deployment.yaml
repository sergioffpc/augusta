apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "augustad.fullname" . }}
  labels:
    {{- include "augustad.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "augustad.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "augustad.selectorLabels" . | nindent 8 }}
      annotations:
        # Restarts the server when its settings change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # augustad stops within a tick of SIGTERM (src/server/main.cpp), so this
      # is not sized for a match to end: a rollout may cut one (ADR-0026).
      terminationGracePeriodSeconds: 10
      containers:
        - name: augustad
          image: "{{ .Values.image.repository }}:{{ include "augustad.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/augusta/augustad.yaml"]
          ports:
            - name: game
              containerPort: {{ .Values.service.port }}
              protocol: UDP
          # Ready once the game port's UDP socket is bound, which augustad does
          # only after its pack is verified and its content loaded. A UDP port
          # has no tcpSocket check to answer, so the probe looks for the socket
          # in the pod's own socket table, IPv4 or IPv6 (/proc/net/udp6 may be
          # absent, hence -s). No liveness probe (ADR-0026).
          readinessProbe:
            exec:
              command: ["grep", "-qs", "{{ printf ":%04X " (int .Values.service.port) }}", "/proc/net/udp", "/proc/net/udp6"]
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/augusta
              readOnly: true
            - name: asset-packs
              mountPath: {{ .Values.assetPacks.mountPath }}
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "augustad.fullname" . }}
        - name: asset-packs
          hostPath:
            path: {{ .Values.assetPacks.hostPath }}
            type: DirectoryOrCreate
