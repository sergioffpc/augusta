apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "augustad.fullname" . }}
  labels:
    {{- include "augustad.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "augustad.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "augustad.selectorLabels" . | nindent 8 }}
      annotations:
        # Restarts the server when its settings change.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: augustad
          image: "{{ .Values.image.repository }}:{{ include "augustad.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/etc/augusta/augustad.yaml"]
          ports:
            - name: game
              containerPort: {{ .Values.service.port }}
              protocol: UDP
          volumeMounts:
            - name: config
              mountPath: /etc/augusta
              readOnly: true
            - name: asset-packs
              mountPath: {{ .Values.assetPacks.mountPath }}
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "augustad.fullname" . }}
        - name: asset-packs
          hostPath:
            path: {{ .Values.assetPacks.hostPath }}
            type: DirectoryOrCreate
