# The metrics endpoint, for Prometheus inside the cluster only (ADR-0049):
# always a ClusterIP, never exposed on the node as the game port is.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "augustad.metricsName" . }}
  labels:
    {{- include "augustad.labels" . | nindent 4 }}
    {{- include "augustad.metricsLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "augustad.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
