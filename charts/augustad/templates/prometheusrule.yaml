# The servers' alert rules (ADR-0049). They route to no receiver yet, so a
# firing alert shows only in Grafana and Alertmanager. Each server has its own,
# scoped to its metrics Service in this release's namespace, so develop and
# staging, and every scenario in them, alert apart. The capture filesystem
# (ADR-0050) is the node's, shared by every server of every environment, so its
# rules come once, with the release that ships the dashboards (develop's).
{{- if .Values.servers }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "augustad.fullname" . }}
  labels:
    {{- include "augustad.labels" . | nindent 4 }}
spec:
  groups:
    {{- range $scenario, $_ := .Values.servers }}
    {{- $server := dict "root" $ "scenario" $scenario }}
    {{- $matcher := printf "namespace=%q, service=%q" $.Release.Namespace (include "augustad.metricsName" $server) }}
    {{- $where := printf "%s in %s" $scenario $.Release.Namespace }}
    - name: {{ include "augustad.serverName" $server }}
      rules:
        # No scrape has succeeded for 2 minutes: the target is gone (no pod,
        # or no Service endpoint) or down. A liveness restart, which takes
        # less, does not fire it.
        - alert: AugustadDown
          expr: absent(up{ {{- $matcher -}} } == 1)
          for: 2m
          labels:
            severity: critical
            scenario: {{ $scenario }}
          annotations:
            summary: augustad for {{ $where }} is down
            description: Prometheus has scraped no metrics endpoint of augustad for {{ $where }} for 2 minutes.
        # The container restarted in its pod: a crash (which leaves a core on
        # the node, ADR-0047), a hung tick loop the liveness probe killed, or
        # the memory limit. A rollout replaces the pod and starts a new
        # counter, so it does not fire this. kube-state-metrics has no
        # Service label, so the pods are matched by name,
        # augustad-<scenario>-<ReplicaSet hash>-<suffix>: neither hash holds a
        # '-', so one scenario never matches another's pods. Stays firing for
        # the 15 minutes the restart is in the window.
        - alert: AugustadRestarted
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace={{ $.Release.Namespace | quote }}, container="augustad", pod=~{{ printf "%s-[a-z0-9]+-[a-z0-9]+" (include "augustad.serverName" $server) | quote }}}[15m]) > 0
          labels:
            severity: error
            scenario: {{ $scenario }}
          annotations:
            summary: augustad for {{ $where }} restarted
            description: augustad in pod {{ printf "{{ $labels.pod }}" }} for {{ $where }} has restarted in the last 15 minutes. kubectl describe pod gives the reason; a crash leaves its stack in the previous container's log and its core in coredumpctl on the node.
        # More than 1% of ticks overran (took longer than a tick, NFR-01) over
        # 10 minutes running. The loop catches up after an overrun (ADR-0005),
        # so an odd slow tick, from the scheduler or a busy node, is not worth
        # an alert; one in a hundred sustained means the server can no longer
        # keep its tick rate. A share of ticks rather than a rate per second,
        # so it holds at any configured tick rate.
        - alert: AugustadTickOverrunsSustained
          expr: |
            rate(augustad_tick_overruns_total{ {{- $matcher -}} }[5m])
            /
            rate(augustad_ticks_total{ {{- $matcher -}} }[5m])
            > 0.01
          for: 5m
          labels:
            severity: warning
            scenario: {{ $scenario }}
          annotations:
            summary: augustad for {{ $where }} keeps overrunning its tick
            description: '{{ printf "{{ $value | humanizePercentage }}" }} of ticks have taken longer than a tick for 10 minutes.'
        # Connection health: a connection's quality is the share of its
        # packets delivered, so packet loss is what it falls short of 1. The
        # mean over every connection's samples, each direction apart, above 5%
        # for 5 minutes.
        - alert: AugustadPacketLossHigh
          expr: |
            1 - (
              sum by (namespace, scenario, direction) (rate(augustad_connection_quality_ratio_sum{ {{- $matcher -}} }[5m]))
              /
              sum by (namespace, scenario, direction) (rate(augustad_connection_quality_ratio_count{ {{- $matcher -}} }[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: warning
            scenario: {{ $scenario }}
          annotations:
            summary: augustad for {{ $where }} sees high packet loss
            description: '{{ printf "{{ $value | humanizePercentage }}" }} of {{ printf "{{ $labels.direction }}" }} packets have been lost for 5 minutes.'
        # A Match capture stopped before its Match end (ADR-0050): a record
        # too long, a writer queue the disk did not keep up with, a failed
        # write, or the retention budget. The Match went on without it, and
        # the next Match is captured afresh. Stays firing for the 10 minutes
        # the stop is in the window.
        - alert: AugustadCaptureStopped
          expr: increase(augustad_capture_stops_total{ {{- $matcher -}} }[10m]) > 0
          labels:
            severity: warning
            scenario: {{ $scenario }}
          annotations:
            summary: augustad for {{ $where }} stopped a Match capture
            description: augustad for {{ $where }} stopped a Match capture early ({{ printf "{{ $labels.reason }}" }}) in the last 10 minutes. Its capture_stopped log line says which Match and where.
        # Retention has failed to delete captures for 30 minutes: the capture
        # directory grows past its limits until it is fixed.
        - alert: AugustadCaptureRetentionFailing
          expr: increase(augustad_capture_retention_failures_total{ {{- $matcher -}} }[10m]) > 0
          for: 30m
          labels:
            severity: warning
            scenario: {{ $scenario }}
          annotations:
            summary: augustad for {{ $where }} cannot delete old captures
            description: augustad for {{ $where }} has failed to delete captures its retention trims for 30 minutes, so its capture directory is over its limits.
    {{- end }}
    {{- if .Values.dashboards.enabled }}
    {{- $mount := printf "mountpoint=%q" ((.Values.captures | default dict).hostPath | default "/srv/augusta/captures") }}
    - name: augustad-capture-filesystem
      rules:
        # The capture filesystem, as node-exporter sees it at the mount point
        # captures.hostPath names. Past 95% a server's next write may fail,
        # stopping its capture.
        - alert: AugustadCaptureFilesystemAlmostFull
          expr: |
            1 - node_filesystem_avail_bytes{ {{- $mount -}} } / node_filesystem_size_bytes{ {{- $mount -}} } > 0.85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: The capture filesystem is almost full
            description: '{{ printf "{{ $labels.mountpoint }}" }} is {{ printf "{{ $value | humanizePercentage }}" }} full: lower the servers'' retention limits or grow the filesystem.'
        - alert: AugustadCaptureFilesystemAlmostFull
          expr: |
            1 - node_filesystem_avail_bytes{ {{- $mount -}} } / node_filesystem_size_bytes{ {{- $mount -}} } > 0.95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The capture filesystem is almost full
            description: '{{ printf "{{ $labels.mountpoint }}" }} is {{ printf "{{ $value | humanizePercentage }}" }} full: captures will soon fail to write.'
        # At the rate of the last 6 hours, the filesystem is full within 6
        # more. Held for an hour, so a burst of Matches does not fire it.
        - alert: AugustadCaptureFilesystemFillingUp
          expr: |
            predict_linear(node_filesystem_avail_bytes{ {{- $mount -}} }[6h], 6 * 3600) < 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: The capture filesystem fills up within 6 hours
            description: At the rate of the last 6 hours, {{ printf "{{ $labels.mountpoint }}" }} is full within 6 hours.
    {{- end }}
{{- end }}
