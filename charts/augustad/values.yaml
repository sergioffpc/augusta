image:
  repository: ghcr.io/sergioffpc/augustad
  # Left empty to run the image CI built from this chart's own commit: Flux
  # versions a Git-sourced chart <version>+<first 12 characters of the commit>
  # and CI tags every main/develop image sha-<the same 12 characters> (see
  # _helpers.tpl). Both tags are immutable, so IfNotPresent never runs a stale
  # image.
  tag: ""
  pullPolicy: IfNotPresent
service:
  type: NodePort
  # UDP, as GameNetworkingSockets speaks. Every server listens on port; each
  # one's node port is its own (servers below).
  port: 7777
  # The node ports this environment's servers pin theirs in, first to last,
  # so environments sharing the node never collide on one: develop's
  # 30700-30799, staging's 30800-30899. Once set, every server must pin a
  # node port in it; left unset, a server's node port is unchecked.
  #   nodePortRange:
  #     first: 30700
  #     last: 30799
  nodePortRange: {}
# What the server runs with besides its pack (config/augustad.example.yaml).
server:
  tickRateHz: 60
  logLevel: info
# The metrics endpoint (ADR-0049): /metrics, which Prometheus scrapes through
# the chart's ServiceMonitor, and /livez, the Deployment's startup and liveness
# probes.
metrics:
  port: 9464
  scrapeInterval: 15s
  # augustad serves /livez only once its pack is verified and its content
  # loaded, and fails it 5 s after the Simulation thread last finished a tick
  # (ADR-0049). Kubernetes restarts the container at the failureThreshold-th
  # failed check in a row, (failureThreshold - 1) * periodSeconds after the
  # first one.
  # Holds the liveness probe back until /livez first answers, restarting a
  # server that has not within about 5 minutes (59 * 5 s): room for a slow
  # pack load.
  startupProbe:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 60
  # Then restarts a hung tick loop 10 s (2 * 5 s) after the first failed
  # check, itself up to 5 s after /livez starts failing.
  livenessProbe:
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
# The Grafana dashboards in dashboards/ (ADR-0049). Each one has its own
# environment selector, so one release ships them for every environment
# (develop's) and the others turn them off.
dashboards:
  enabled: true
# The k3s node's shared volume of signed server packs (ENGINEERING.md's
# Deployment & CD section), which augusta-publish fills: a folder per scenario,
# and in it one per published pack, named by its version (the first 12 hex
# characters of the server pack's BLAKE3 hash) and holding server.pack and the
# signing.pub it is signed with. Each server mounts its own version's folder
# read-only.
assetPacks:
  hostPath: /srv/augusta/asset-packs
# Match captures (ADR-0050).
captures:
  # What each server keeps its capture directory within, oldest Match first,
  # rendered as simulation.capture_retention (config/augustad.example.yaml):
  # maxFiles captures and maxMiB MiB in all, either alone, each an integer of
  # at least 1. Left unset, nothing is deleted. Every server's maxMiB summed
  # must fit the filesystem the directories share.
  #   retention:
  #     maxFiles: 200
  #     maxMiB: 2048
  retention: {}
# The servers an environment runs, one per scenario (ADR-0026), keyed by the
# scenario's name (ADR-0041): a Deployment, game Service and metrics Service
# each, named augustad-<scenario>. A server serves its scenario's pack and no
# other. Every entry names the pack version it serves, as augusta-publish
# prints it: quoted, since a version of digits alone would otherwise read as a
# number. It may pin its node port (left unset, Kubernetes assigns one), and
# must when the environment sets service.nodePortRange:
#   servers:
#     firebase:
#       packVersion: "3f9a1c0b7e21"
#       nodePort: 30700
servers: {}
# Each server's (ADR-0026): a request that guarantees its
# Simulation and Network I/O threads (ADR-0005) their share of the node, and
# no CPU limit, since a throttled Simulation thread misses ticks (NFR-01).
# Memory is limited at its request: past it the server is killed and
# restarted, never evicted for overrunning its request when the node runs short.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 512Mi
