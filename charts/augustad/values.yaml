image:
  repository: ghcr.io/sergioffpc/augustad
  # Left empty to run the image CI built from this chart's own commit: Flux
  # versions a Git-sourced chart <version>+<first 12 characters of the commit>
  # and CI tags every main/develop image sha-<the same 12 characters> (see
  # _helpers.tpl). Both tags are immutable, so IfNotPresent never runs a stale
  # image.
  tag: ""
  pullPolicy: IfNotPresent
replicaCount: 1
service:
  type: NodePort
  # Left unset by default so Kubernetes assigns the node port, per
  # ADR-0026/ENGINEERING.md; set per-environment (see clusters/onprem/apps)
  # where a stable address is needed. UDP, as GameNetworkingSockets speaks.
  # The server listens on port.
  port: 7777
  nodePort: ""
# What the server runs with besides its pack (config/augustad.example.yaml).
server:
  tickRateHz: 60
  logLevel: info
# The metrics endpoint (ADR-0049): /metrics, which Prometheus scrapes through
# the chart's ServiceMonitor, and /livez, the Deployment's liveness probe.
# Reached only inside the cluster, through its own ClusterIP Service.
metrics:
  port: 9464
  scrapeInterval: 15s
  # augustad serves /livez only once its pack is verified and its content
  # loaded, and fails it 5 s after the Simulation thread last finished a tick
  # (ADR-0026). The first check waits out the loading, and a restart takes
  # failureThreshold failed checks in a row, so a start that is slow but
  # under initialDelaySeconds + failureThreshold * periodSeconds (45 s) is
  # not taken for a hung tick loop.
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
# Shared hostPath volume on the k3s node holding signed asset packs
# (ENGINEERING.md's Deployment & CD section), populated manually after
# signing and mounted read-only into every server pod. Each environment's
# packVersion names its folder on the volume, which holds pack and the
# public key it is signed with.
assetPacks:
  hostPath: /srv/augusta/asset-packs
  mountPath: /srv/augusta/asset-packs
  packVersion: ""
  pack: server.pack
  publicKey: augusta.pub
# One server per environment (ADR-0026): a request that guarantees its
# Simulation and Network I/O threads (ADR-0005) their share of the node, and
# no CPU limit, since a throttled Simulation thread misses ticks (NFR-01).
# Memory is limited at its request: past it the server is killed and
# restarted, never evicted for overrunning its request when the node runs short.
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    memory: 512Mi
