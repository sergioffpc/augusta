# git-cliff: CHANGELOG.md and each GitHub Release's notes, both generated from
# the Conventional Commits history (docs/ENGINEERING.md, Git Workflow). The
# changelog is cut on the release/* branch and release.yml renders the same
# section as the notes, so both read from this one file.

[changelog]
header = """
# Changelog

Generated from the Conventional Commits history by git-cliff (cliff.toml).

"""
body = """
{% if version %}\
  ## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
  ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
  ### {{ group | striptags | trim }}
  {% for commit in commits %}
    - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
      {% if commit.breaking %}**BREAKING** {% endif %}\
      {{ commit.message | split(pat="\n") | first | trim }}\
  {% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
# Merge commits and anything else outside Conventional Commits are dropped.
filter_unconventional = true
# The <!-- n --> prefix orders the groups; the template strips it.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^revert", group = "<!-- 4 -->Reverts" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Tests" },
  { message = "^build", group = "<!-- 7 -->Build" },
  # Noise for a reader of the notes, unless it breaks something.
  { message = "^(chore|ci|style)", skip = true },
]
protect_breaking_commits = true
filter_commits = true
# Release tags only: the falcor-* tags are prebuilt-Falcor assets
# (falcor-prebuilt.yml), not releases.
tag_pattern = "^v[0-9]"
sort_commits = "oldest"
