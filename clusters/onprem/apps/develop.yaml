apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: augustad-develop
  namespace: flux-system
spec:
  interval: 5m
  releaseName: augustad
  targetNamespace: develop
  # Defaults to this HelmRelease's own namespace (flux-system) if unset,
  # which every environment shares - pin it to targetNamespace so each
  # environment gets its own Helm release storage instead of colliding on
  # the same (flux-system, augustad) release record.
  storageNamespace: develop
  # The chart runs the image CI builds from the same commit (charts/augustad
  # values.yaml), which can still be building when Flux picks the commit up:
  # wait for it rather than fail the upgrade.
  timeout: 30m
  install:
    createNamespace: true
  chart:
    spec:
      chart: charts/augustad
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: augusta-develop
  values:
    assetPacks:
      # The folder of /srv/augusta/asset-packs on the node holding server.pack
      # and augusta.pub.
      packVersion: augusta
    service:
      # Pinned (rather than left to Kubernetes to assign) so this
      # environment has a stable address for LAN clients to connect to.
      nodePort: 30777
