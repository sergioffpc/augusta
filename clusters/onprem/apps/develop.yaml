apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: augusta-server-develop
  namespace: flux-system
spec:
  interval: 5m
  releaseName: augusta-server
  targetNamespace: develop
  install:
    createNamespace: true
  chart:
    spec:
      chart: charts/augusta-server
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: augusta-develop
  # See production.yaml - same caveat on image.tag pending the GHCR push step.
  values:
    image:
      tag: develop
