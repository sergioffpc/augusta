apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: augustad-develop
  namespace: flux-system
spec:
  interval: 5m
  releaseName: augustad
  # The namespace in namespaces.yaml, with its Pod Security labels: not one
  # Flux creates.
  targetNamespace: develop
  # Defaults to this HelmRelease's own namespace (flux-system) if unset,
  # which every environment shares - pin it to targetNamespace so each
  # environment gets its own Helm release storage instead of colliding on
  # the same (flux-system, augustad) release record.
  storageNamespace: develop
  # The chart CI published once its commit's image was (sources.yaml): the
  # values below are Git's, so a change to them rolls out without waiting for
  # CI. A value renamed in the chart is set here only once the renamed chart
  # is live (charts/augustad values.yaml).
  chartRef:
    kind: OCIRepository
    name: augustad-develop
  values:
    # develop's node ports (charts/augustad values.yaml), apart from
    # staging's on the same node.
    service:
      nodePortRange:
        first: 30700
        last: 30799
    # develop's own tree of the node's asset-pack volume, where
    # augusta-publish --environment develop puts its packs, signed with
    # develop's key (charts/augustad values.yaml).
    assetPacks:
      hostPath: /srv/augusta/asset-packs/develop
    # A server per scenario (ADR-0026), each running the pack version and
    # pack format augusta-publish printed for it. CI fails a pack format
    # other than the engine's (scripts/check-pack-formats.py).
    servers:
      firebase:
        packVersion: "d5bda568e4f3"
        packFormat: 7
        # Pinned (rather than left to Kubernetes to assign) so this server
        # has a stable address for LAN clients to connect to.
        nodePort: 30700
    # Captures every Match (ADR-0050) into the node's capture volume
    # (docs/runbooks/k3s-node-recovery.md), for debugging what develop runs.
    captures:
      hostPath: /srv/augusta/captures
