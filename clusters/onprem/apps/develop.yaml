apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: augustad-develop
  namespace: flux-system
spec:
  interval: 5m
  releaseName: augustad
  targetNamespace: develop
  # Defaults to this HelmRelease's own namespace (flux-system) if unset,
  # which every environment shares - pin it to targetNamespace so each
  # environment gets its own Helm release storage instead of colliding on
  # the same (flux-system, augustad) release record.
  storageNamespace: develop
  # The chart runs the image CI builds from the same commit (charts/augustad
  # values.yaml), which can still be building when Flux picks the commit up:
  # wait for it rather than fail the upgrade.
  timeout: 30m
  install:
    createNamespace: true
  chart:
    spec:
      chart: charts/augustad
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: augusta-develop
  values:
    # develop's node ports (charts/augustad values.yaml), apart from
    # staging's on the same node.
    service:
      nodePortRange:
        first: 30700
        last: 30799
    # A server per scenario (ADR-0026), each running the pack version
    # augusta-publish printed for it.
    servers:
      firebase:
        packVersion: "9d0c7edd5b34"
        # Pinned (rather than left to Kubernetes to assign) so this server
        # has a stable address for LAN clients to connect to.
        nodePort: 30700
    # Captures every Match (ADR-0050) into the node's capture volume
    # (docs/runbooks/k3s-node-recovery.md), for debugging what develop runs.
    captures:
      hostPath: /srv/augusta/captures
