# The Environments' namespaces, with their Pod Security labels (ADR-0057): not
# ones Flux creates for their HelmReleases. The chart's pods meet restricted
# (non-root, no privilege escalation, every capability dropped, augustad's own
# seccomp profile), and mount their packs and captures from local
# PersistentVolumes rather than hostPath volumes, which restricted forbids.
apiVersion: v1
kind: Namespace
metadata:
  name: develop
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Nothing reaches in or out of the namespace but what a NetworkPolicy allows by
# name (ADR-0057): the chart's own, for its servers (charts/augustad
# networkpolicy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: develop
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# Nothing reaches in or out of the namespace but what a NetworkPolicy allows by
# name (ADR-0057), as in develop.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: staging
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
