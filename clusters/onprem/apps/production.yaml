apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: augusta-server-production
  namespace: flux-system
spec:
  interval: 5m
  releaseName: augusta-server
  targetNamespace: production
  install:
    createNamespace: true
  chart:
    spec:
      chart: charts/augusta-server
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: augusta-main
  # image.tag assumes CI tags GHCR images by branch name (main/develop) - that
  # push step doesn't exist yet (see ROADMAP.md M0b), so this HelmRelease
  # reconciles but the pod can't pull an image until it does.
  values:
    image:
      tag: main
