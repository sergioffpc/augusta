apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: augustad-staging
  namespace: flux-system
spec:
  interval: 5m
  releaseName: augustad
  targetNamespace: staging
  # Defaults to this HelmRelease's own namespace (flux-system) if unset,
  # which every environment shares - pin it to targetNamespace so each
  # environment gets its own Helm release storage instead of colliding on
  # the same (flux-system, augustad) release record.
  storageNamespace: staging
  # The chart runs the image CI builds from the same commit (charts/augustad
  # values.yaml), which can still be building when Flux picks the commit up:
  # wait for it rather than fail the upgrade.
  timeout: 30m
  install:
    createNamespace: true
  chart:
    spec:
      chart: charts/augustad
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: augusta-main
  values:
    # staging's node ports (charts/augustad values.yaml), apart from
    # develop's on the same node.
    service:
      nodePortRange:
        first: 30800
        last: 30899
    # A server per scenario (ADR-0026), each running the pack version
    # augusta-publish printed for it: the release's packs, signed with the
    # release key.
    servers:
      firebase:
        packVersion: "9d0c7edd5b34"
        # Pinned so this server has a stable address for LAN clients.
        nodePort: 30800
    # develop's release ships the dashboards (charts/augustad values.yaml).
    dashboards:
      enabled: false
