apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: augustad-staging
  namespace: flux-system
spec:
  interval: 5m
  releaseName: augustad
  targetNamespace: staging
  # Defaults to this HelmRelease's own namespace (flux-system) if unset,
  # which every environment shares - pin it to targetNamespace so each
  # environment gets its own Helm release storage instead of colliding on
  # the same (flux-system, augustad) release record.
  storageNamespace: staging
  install:
    createNamespace: true
  chart:
    spec:
      chart: charts/augustad
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: augusta-main
  # main's chart still predates running the image of its own commit, so it is
  # pointed at the branch tag. Drop image.tag once main carries develop's
  # chart (and add timeout: 30m, as in develop.yaml).
  values:
    image:
      tag: main
    assetPacks:
      packVersion: augusta
