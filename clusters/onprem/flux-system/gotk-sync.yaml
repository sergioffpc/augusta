apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  ref:
    # `develop` is where feature work actually lands; `main` only advances on
    # a real release cut (see ENGINEERING.md's Git Workflow), so pinning this
    # self-sync to `main` would leave Flux's own config dormant until v1.
    branch: develop
  url: https://github.com/sergioffpc/augusta
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/onprem/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# What the apps run on rather than are: the monitoring stack (ADR-0049).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 10m
  path: ./clusters/onprem/infrastructure
  prune: true
  # Ready only once its HelmReleases are, so apps, which depends on it, finds
  # the monitoring stack's CRDs (ServiceMonitor, PrometheusRule) installed.
  wait: true
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
    - name: infrastructure
  interval: 10m
  path: ./clusters/onprem/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
