# The cluster's monitoring stack (ADR-0049): Prometheus Operator, Prometheus,
# Alertmanager, Grafana, node-exporter and kube-state-metrics, in their own
# namespace. The augustad chart (apps) brings its own ServiceMonitor,
# PrometheusRules and dashboards. Loki keeps every pod's logs and Alloy ships
# them there, so Grafana shows them beside the metrics (ADR-0053).
#
# Its namespace runs under the restricted Pod Security Standard (ADR-0057):
# every pod in it is non-root, escalates no privilege, drops every capability
# and runs under the runtime's seccomp profile, as each chart's values below
# make it where its defaults do not.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
# What reads the Node itself, which no Pod Security level short of privileged
# allows: node-exporter, its /proc, /sys and filesystems from the host's
# network and PID namespaces; alloy-node (below), its security logs; and
# kube-bench (kube-bench/), its k3s against the CIS profile.
# clusters/onprem/policies/privileged-namespace-workloads.yaml admits nothing
# else here.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring-node
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 30m
  releaseName: kube-prometheus-stack
  # The namespace above, with its Pod Security labels, as for Loki and Alloy
  # below: not one Flux creates.
  targetNamespace: monitoring
  # Its own release storage, as each augustad environment has (apps).
  storageNamespace: monitoring
  # The first install pulls every component's image.
  timeout: 15m
  install:
    crds: CreateReplace
  # A chart upgrade brings its operator's CRDs up to date with it.
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 91.9.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  # Every image pinned by digest (ADR-0057), the tag beside it for the reader,
  # as in kyverno.yaml. A chart upgrade brings new images, so these move with
  # its version: for each image the new chart renders (helm template with
  # these values), `crane digest <image>:<tag>` gives the digest of its
  # multi-architecture index. Where the chart reads the tag as the
  # component's version (Prometheus, Alertmanager, the operator's), the
  # digest goes in sha instead.
  values:
    prometheusOperator:
      image:
        tag: v0.94.1
        sha: 7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a
      # The sidecar the operator adds to the Prometheus and Alertmanager
      # pods it runs.
      prometheusConfigReloader:
        image:
          tag: v0.94.1
          sha: 06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b
      # The Jobs that make and install the operator's webhook certificate.
      admissionWebhooks:
        patch:
          image:
            tag: 1.8.9
            sha: 58e4ac2e15bf7785eb00ac90d03f9be1ff3f2fe0add6c71b54af6e5c80031148
    kube-state-metrics:
      image:
        tag: v2.20.0
        sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
      # Beside its own series, the Ready condition of each Flux object the
      # Flux alert below watches, as Flux's monitoring guide names it:
      # gotk_resource_info{namespace, name, ready, suspended}, one series per
      # object, its kind in customresource_kind. Read from the API, as every
      # other object is, rather than scraped from Flux's controllers, which
      # would open flux-system's NetworkPolicies to Prometheus. Each kind at
      # the version gotk-components.yaml stores it in, bumped with Flux.
      rbac:
        extraRules:
          - apiGroups:
              - source.toolkit.fluxcd.io
            resources:
              - gitrepositories
              - ocirepositories
              - helmrepositories
            verbs:
              - list
              - watch
          - apiGroups:
              - kustomize.toolkit.fluxcd.io
            resources:
              - kustomizations
            verbs:
              - list
              - watch
          - apiGroups:
              - helm.toolkit.fluxcd.io
            resources:
              - helmreleases
            verbs:
              - list
              - watch
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: GitRepository
                metricNamePrefix: gotk
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: resource_info
                    help: The Ready condition of a Flux GitRepository.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: OCIRepository
                metricNamePrefix: gotk
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: resource_info
                    help: The Ready condition of a Flux OCIRepository.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: source.toolkit.fluxcd.io
                  version: v1
                  kind: HelmRepository
                metricNamePrefix: gotk
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: resource_info
                    help: The Ready condition of a Flux HelmRepository.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: kustomize.toolkit.fluxcd.io
                  version: v1
                  kind: Kustomization
                metricNamePrefix: gotk
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: resource_info
                    help: The Ready condition of a Flux Kustomization.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
              - groupVersionKind:
                  group: helm.toolkit.fluxcd.io
                  version: v2
                  kind: HelmRelease
                metricNamePrefix: gotk
                labelsFromPath:
                  namespace: [metadata, namespace]
                  name: [metadata, name]
                metrics:
                  - name: resource_info
                    help: The Ready condition of a Flux HelmRelease.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          ready: [status, conditions, "[type=Ready]", status]
                          suspended: [spec, suspend]
    # The one component that cannot meet restricted, alone in its privileged
    # namespace (above). Prometheus still finds its ServiceMonitor, as it
    # watches every namespace's, and its series and their labels but
    # namespace are unchanged, so the dashboards and rules that read them are
    # too.
    prometheus-node-exporter:
      namespaceOverride: monitoring-node
      image:
        tag: v1.12.1
        digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
    # k3s runs the control plane inside its own process, so there are no
    # controller-manager, scheduler, proxy or etcd endpoints to scrape: their
    # targets would only be down and alert forever.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    prometheus:
      prometheusSpec:
        image:
          tag: v3.15.0-distroless
          sha: b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
        retention: 15d
        # Below the volume's size, so the oldest series go before it fills.
        retentionSize: 9GB
        # Scrape and alert on every ServiceMonitor, PodMonitor and
        # PrometheusRule in the cluster - the augustad chart's in develop and
        # staging among them - not only those labelled with this release.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        # On the node's disk, so the series survive the pod's restart.
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 10Gi
    # The cluster's own alert rules: the chart installs them with the
    # PrometheusRule CRD they need, which a manifest beside this file could
    # not count on when the cluster is rebuilt. Flux's objects, from
    # kube-state-metrics (above): one that has not been Ready for 15 minutes
    # applies nothing new, whatever was merged, while what it applied before
    # keeps running and looks healthy. A suspended one is held on purpose
    # (docs/runbooks/flux-rollback.md). Not Ready rather than Ready=False, so
    # an object that keeps retrying, Unknown while it does, alerts as well.
    # Tested in alert-tests/flux.test.yaml.
    additionalPrometheusRulesMap:
      flux:
        groups:
          - name: flux
            rules:
              - alert: FluxObjectNotReady
                expr: |
                  label_replace(
                    max by (customresource_kind, namespace, name) (
                      gotk_resource_info{ready!="True", suspended!="true"}
                    ),
                    "kind", "$1", "customresource_kind", "(.*)"
                  )
                for: 15m
                labels:
                  severity: critical
                annotations:
                  summary: Flux's {{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} has not been Ready for 15 minutes
                  description: Flux applies nothing new from {{ $labels.kind }} {{ $labels.namespace }}/{{ $labels.name }} until it is Ready again. flux get all -A gives its message; docs/runbooks/flux-rollback.md reverts a bad deploy.
    # Where alerts reach the operator (ADR-0049): a Telegram bot posts every
    # critical or error alert, and the two stack rules that catch a server
    # crash-looping or a rollout that never becomes ready, to the operator's
    # chat. Everything else (other warnings, info, Watchdog, InfoInhibitor)
    # stays on the chart's "null" receiver, in Grafana and Alertmanager
    # alone. These keys replace the chart's own route and receivers and keep
    # its inhibit rules. An alert fires a message within group_wait of
    # firing, and again every repeat_interval while it does.
    #
    # The bot's token and the chat's id are the Secret alertmanager-telegram,
    # made by hand, never in Git (ADR-0057,
    # docs/runbooks/alert-notifications.md). Alertmanager's pod does not
    # start without it. Its routes are tested in alert-tests/routes.txt.
    alertmanager:
      enabled: true
      config:
        route:
          group_by:
            - alertname
            - namespace
            - scenario
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
          receiver: "null"
          routes:
            - receiver: "null"
              matchers:
                - alertname = "Watchdog"
            - receiver: telegram
              matchers:
                - severity =~ "critical|error"
            - receiver: telegram
              matchers:
                - alertname =~ "KubeDeploymentRolloutStuck|KubePodCrashLooping"
        receivers:
          - name: "null"
          - name: telegram
            telegram_configs:
              - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
                chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat-id
                send_resolved: true
      alertmanagerSpec:
        image:
          tag: v0.34.1
          sha: e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
        # Mounted at /etc/alertmanager/secrets/alertmanager-telegram/.
        secrets:
          - alertmanager-telegram
    grafana:
      image:
        tag: 13.2.3-distroless@sha256:202e5d5b3f8499e70ccac7991eea6d7da72d2790eb2e0597e7987acf724e7180
      # The pod helm test would run, which Flux does not.
      testFramework:
        enabled: false
      # No credential at all (ADR-0057): anyone on the LAN views every
      # dashboard anonymously, as a Viewer, who can change nothing, and no one
      # can sign in. Dashboards, data sources and alert rules come only from
      # Git. Grafana never creates its admin user, so the chart makes no
      # Secret for its password.
      env:
        GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      grafana.ini:
        auth:
          disable_login_form: true
          disable_signout_menu: true
        auth.basic:
          enabled: false
        auth.anonymous:
          enabled: true
          org_role: Viewer
      service:
        # Pinned, like the game port (apps), so the LAN has a stable address.
        type: NodePort
        nodePort: 30300
      # Dashboards are ConfigMaps labelled grafana_dashboard: "1", in any
      # namespace (the augustad chart ships its own). The sidecars write them
      # and the data sources to files Grafana provisions from; with no admin
      # to call Grafana's reload API as, Grafana rescans the dashboards
      # itself every 30 seconds, and loads the data sources as it starts.
      sidecar:
        image:
          tag: 2.11.2@sha256:2912be006f62f9ea080194cf6d3afcd90daead8d101d0ba686a137a849f6a4f6
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: ALL
          skipReload: true
        # The data sources' sidecar runs as an init container alone, which
        # must list them once and exit: watching, Grafana would never start.
        datasources:
          skipReload: true
          initDatasources: true
          watchMethod: LIST
      # The logs (ADR-0053), beside the chart's own Prometheus data source.
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: flux-system
spec:
  interval: 24h
  url: https://grafana.github.io/helm-charts
---
# One Loki process on the node's disk: the cluster is one node, and its logs
# are a few augustad servers' (ADR-0053).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: flux-system
spec:
  interval: 30m
  releaseName: loki
  targetNamespace: monitoring
  storageNamespace: monitoring
  chart:
    spec:
      chart: loki
      version: 7.3.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    deploymentMode: SingleBinary
    # Pinned by digest, as kube-prometheus-stack's images are. CI parses the
    # cluster's Loki rules with this release's lokitool (ci.yml), bumped with
    # it.
    loki:
      image:
        tag: 3.6.11@sha256:44148ad243c07957113baea950ee5ba9b0c8eff8d7e38ff3cc1c0af705790945
      # One tenant: Grafana and Alloy reach Loki only from inside the cluster.
      auth_enabled: false
      # The chart's pod runs as non-root, escalates nothing and drops every
      # capability; restricted also asks for the runtime's seccomp profile,
      # for Loki and its rules sidecar alike.
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2026-10-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      # As long as Prometheus keeps the series, so a metric's spike still has
      # its log lines.
      limits_config:
        retention_period: 15d
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      # Evaluates the alerting rules the sidecar below loads
      # (security-alerts.yaml) and sends what fires to the stack's
      # Alertmanager. The rules are read from the sidecar's folder, under the
      # one tenant's name, fake; the ruler's own copy of them goes elsewhere.
      rulerConfig:
        storage:
          type: local
          local:
            directory: /rules
        rule_path: /tmp/loki-rules
        alertmanager_url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
    # Loads the alerting rules ConfigMaps labelled loki_rule carry.
    sidecar:
      image:
        tag: 2.5.0@sha256:a6b3f707f883108376514489a94d6629109a327b2978e1d826cd104c4ca436df
      rules:
        folder: /rules/fake
    singleBinary:
      replicas: 1
      # On the node's disk, so the logs survive the pod's restart.
      persistence:
        storageClass: local-path
        size: 10Gi
    # Each of these exists to spread or speed up a Loki that runs as many
    # processes, or to test one; a single process on one node needs none.
    gateway:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
---
# Tails every container's log through the Kubernetes API and pushes it to
# Loki, labelled with its namespace, pod, container and app; and every
# Kubernetes event, job="kubernetes/events", among them Kyverno's policy
# violations and Flux's failed signature checks (security-alerts.yaml).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: flux-system
spec:
  interval: 30m
  releaseName: alloy
  targetNamespace: monitoring
  storageNamespace: monitoring
  dependsOn:
    - name: loki
  chart:
    spec:
      chart: alloy
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    # Pinned by digest, as kube-prometheus-stack's images are, in digest: the
    # chart labels its objects with the tag. Its config reloader comes pinned
    # already.
    image:
      tag: v1.20.0
      digest: sha256:f111cce835516c5f99166342be7038496b52ced16667be5a11e19258a3e4cd30
    # One replica reads the whole cluster's logs from the API, so it needs no
    # host mounts and no clustering.
    controller:
      type: deployment
      replicas: 1
    # The chart sets no security context, and Alloy's image runs as root
    # unless told otherwise. restricted wants a non-root user: the image's
    # own alloy (473) is enough to read the logs through the API and write
    # its data under /tmp. The config reloader beside it meets restricted
    # already.
    global:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        seccompProfile:
          type: RuntimeDefault
    alloy:
      enableReporting: false
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
      configMap:
        content: |
          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pods" {
            targets = discovery.kubernetes.pods.targets

            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
          }

          loki.source.kubernetes "pods" {
            targets    = discovery.relabel.pods.output
            forward_to = [loki.write.default.receiver]
          }

          // Each event's object, reason, type and message as a logfmt line,
          // labelled with its namespace.
          loki.source.kubernetes_events "events" {
            job_name   = "kubernetes/events"
            log_format = "logfmt"
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
---
# The Node's own security logs, which no pod's log holds (ADR-0057): the
# auth facilities of its journal (sshd, sudo, su; Debian 13 keeps no
# auth.log), auditd's log, and the API server's audit log, which k3s writes
# on the Node. One pod on each node, in monitoring-node, as it reads them
# from the Node's filesystem; it reaches nothing in the cluster but Loki.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-node
  namespace: flux-system
spec:
  interval: 30m
  releaseName: alloy-node
  targetNamespace: monitoring-node
  storageNamespace: monitoring-node
  dependsOn:
    - name: loki
  chart:
    spec:
      chart: alloy
      version: 1.13.0
      sourceRef:
        kind: HelmRepository
        name: grafana
  values:
    # As the release above's.
    image:
      tag: v1.20.0
      digest: sha256:f111cce835516c5f99166342be7038496b52ced16667be5a11e19258a3e4cd30
    # The release above installs Alloy's CRDs; this one reads no Kubernetes
    # object, so it has no RBAC, no token and no Service.
    crds:
      create: false
    rbac:
      create: false
    serviceAccount:
      automountServiceAccountToken: false
    service:
      enabled: false
    controller:
      type: daemonset
      volumes:
        extra:
          - name: journal
            hostPath:
              path: /var/log/journal
              type: Directory
          - name: auditd
            hostPath:
              path: /var/log/audit
              type: Directory
          - name: kube-audit
            hostPath:
              path: /var/lib/rancher/k3s/server/logs
              type: Directory
          # Where each source has read up to, so a restarted pod neither
          # ships a log twice nor skips what was written while it was down.
          - name: positions
            hostPath:
              path: /var/lib/alloy-node
              type: DirectoryOrCreate
          - name: tmp
            emptyDir: {}
    global:
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
    alloy:
      enableReporting: false
      storagePath: /var/lib/alloy-node
      # Root, as each log and the directories that hold them are root's
      # alone, but with no capability: root reads what it owns without one.
      # It writes only its positions.
      securityContext:
        runAsUser: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      mounts:
        extra:
          - name: journal
            mountPath: /var/log/journal
            readOnly: true
          - name: auditd
            mountPath: /var/log/audit
            readOnly: true
          - name: kube-audit
            mountPath: /var/lib/rancher/k3s/server/logs
            readOnly: true
          - name: positions
            mountPath: /var/lib/alloy-node
          - name: tmp
            mountPath: /tmp
      configMap:
        content: |
          // The auth and authpriv facilities: every login sshd accepts or
          // refuses, and every sudo and su. job="node/auth", and the program
          // that logged it as identifier.
          loki.source.journal "auth" {
            path          = "/var/log/journal"
            matches       = "SYSLOG_FACILITY=4 SYSLOG_FACILITY=10"
            labels        = {job = "node/auth"}
            relabel_rules = loki.relabel.journal.rules
            forward_to    = [loki.write.default.receiver]
          }

          loki.relabel "journal" {
            forward_to = []

            rule {
              source_labels = ["__journal_syslog_identifier"]
              target_label  = "identifier"
            }
          }

          // auditd's log (clusters/onprem/node/audit.rules), each record at
          // the time auditd stamped it. job="node/auditd".
          loki.source.file "auditd" {
            targets    = [{"__path__" = "/var/log/audit/audit.log", "job" = "node/auditd"}]
            forward_to = [loki.process.auditd.receiver]
          }

          loki.process "auditd" {
            stage.regex {
              expression = `msg=audit\((?P<ts>\d+\.\d+):`
            }
            stage.timestamp {
              source = "ts"
              format = "Unix"
            }
            forward_to = [loki.write.default.receiver]
          }

          // The API server's audit log (clusters/onprem/node/audit-policy.yaml),
          // each event at the time the API server finished it.
          // job="node/kube-audit".
          loki.source.file "kube_audit" {
            targets    = [{"__path__" = "/var/lib/rancher/k3s/server/logs/audit.log", "job" = "node/kube-audit"}]
            forward_to = [loki.process.kube_audit.receiver]
          }

          loki.process "kube_audit" {
            // Without the request's and the response's bodies: at
            // RequestResponse they are a Secret's contents, which stay in the
            // Node's root-only log and never reach Loki, which anything in
            // the cluster can read. An event's fields come in a fixed order,
            // the bodies last but its timestamps and annotations, so this
            // cuts from the first body to the last requestReceivedTimestamp,
            // which no body can outlast.
            stage.replace {
              expression = `(,"(?:requestObject|responseObject)":.*),"requestReceivedTimestamp":`
              replace    = ""
            }
            stage.json {
              expressions = {ts = "stageTimestamp"}
            }
            stage.timestamp {
              source = "ts"
              format = "RFC3339Nano"
            }
            forward_to = [loki.write.default.receiver]
          }

          loki.write "default" {
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
          }
