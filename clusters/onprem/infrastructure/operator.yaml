# The maintainer's day-to-day identity (ADR-0057): a client certificate in the
# group augusta:operators, issued for a day by scripts/operator-kubeconfig.sh
# (docs/runbooks/k3s-node-recovery.md, Cluster access). It reads the cluster,
# Secrets aside, and suspends, resumes and reconciles Flux's objects; it
# changes no workload and no RBAC. cluster-admin stays on the Node.
#
# Reading: Kubernetes' own view role (every namespaced object but Secrets, and
# Flux's, which aggregate into it), and below what view leaves out.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: augusta-operators-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: augusta:operators
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: augusta-operator
rules:
  # The cluster-scoped objects, RBAC, admission, and the CRDs flux check reads.
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - node.k8s.io
      - rbac.authorization.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
    resources: ["*"]
    verbs: [get, list, watch]
  # The CRDs of k3s, Kyverno and the monitoring stack, and kubectl top.
  - apiGroups:
      - helm.cattle.io
      - k3s.cattle.io
      - kyverno.io
      - policies.kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      - monitoring.coreos.com
      - metrics.k8s.io
    resources: ["*"]
    verbs: [get, list, watch]
  # flux suspend, resume and reconcile patch the object itself; the
  # augusta-operator-flux policy below holds the patch to those fields.
  - apiGroups: [source.toolkit.fluxcd.io]
    resources: [buckets, gitrepositories, helmcharts, helmrepositories, ocirepositories]
    verbs: [patch]
  - apiGroups: [kustomize.toolkit.fluxcd.io]
    resources: [kustomizations]
    verbs: [patch]
  - apiGroups: [helm.toolkit.fluxcd.io]
    resources: [helmreleases]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: augusta-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: augusta-operator
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: augusta:operators
---
# A patch is any change: a source's URL, a release's values, which would let
# the operator deploy anything through Flux. From augusta:operators, a Flux
# object may change only in spec.suspend and the reconcile.fluxcd.io/
# annotations. The API server enforces it itself, with Kyverno up or down.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: augusta-operator-flux
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - source.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: ["*"]
  matchConditions:
    - name: operator
      expression: "'augusta:operators' in request.userInfo.groups"
  variables:
    - name: annotations
      expression: "object.metadata.?annotations.orValue({})"
    - name: oldAnnotations
      expression: "oldObject.metadata.?annotations.orValue({})"
  validations:
    - expression: >-
        object.spec.filter(k, k != 'suspend').all(k, k in oldObject.spec && object.spec[k] == oldObject.spec[k]) && oldObject.spec.filter(k, k != 'suspend').all(k, k in object.spec)
      message: augusta:operators may change only spec.suspend of a Flux object.
    - expression: >-
        variables.annotations.filter(k, !k.startsWith('reconcile.fluxcd.io/')).all(k, k in variables.oldAnnotations && variables.annotations[k] == variables.oldAnnotations[k]) && variables.oldAnnotations.filter(k, !k.startsWith('reconcile.fluxcd.io/')).all(k, k in variables.annotations) && object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({})
      message: augusta:operators may change only the reconcile.fluxcd.io/ annotations of a Flux object.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: augusta-operator-flux
spec:
  policyName: augusta-operator-flux
  validationActions: [Deny]
