# The kernel's hardening against a process that escapes augustad's container
# (ADR-0057): /etc/sysctl.d/80-hardening.conf, installed by
# scripts/bootstrap-node.sh.
# Kernel addresses are hidden from anyone without CAP_SYSLOG, so a leak through
# /proc cannot be used to defeat KASLR.
kernel.kptr_restrict=1
# Only root can ptrace: an escaped process cannot attach to another on the
# Node. Crash reports read cores, not live processes (ADR-0047).
kernel.yama.ptrace_scope=2
# Nothing can load a new kernel without a reboot, root included. Holds until
# the Node reboots; there is no kdump to need it.
kernel.kexec_load_disabled=1
# No user namespace for an unprivileged process, the start of many local
# privilege escalations. augustad's own (hostUsers: false) is the container
# runtime's, made as root; podman on the Node runs under sudo.
kernel.unprivileged_userns_clone=0
# BPF programs are JITed with constant blinding, against JIT spraying. Nothing
# on the Node relies on eBPF's speed: flannel and kube-proxy use iptables.
net.core.bpf_jit_harden=1
# The Node forwards for its pods, but is no router to send ICMP redirects, nor
# to take IPv6 ones from a LAN device.
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv6.conf.all.accept_redirects=0
net.ipv6.conf.default.accept_redirects=0
# A packet whose source the Node could not reach back through any interface is
# dropped. Loose, not strict, which would drop flannel's VXLAN.
net.ipv4.conf.all.rp_filter=2
