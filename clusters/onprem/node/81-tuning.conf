# The kernel's tuning for a two-socket, 251 GB, 10 GbE Node running UDP game
# servers: /etc/sysctl.d/81-tuning.conf, installed by scripts/bootstrap-node.sh.
# GameNetworkingSockets asks for 256 KB send and receive buffers on its UDP
# socket; the default ceiling, 208 KB, cut that, and a burst overflowed it. 1 MB
# leaves room should it ask for more. The defaults stay: it asks.
net.core.rmem_max=1048576
net.core.wmem_max=1048576
# Packets queued between the NIC and the network stack, for 10 GbE bursts
# (default 1000).
net.core.netdev_max_backlog=16384
# Dirty pages are written back from 256 MB, and writers wait from 1 GB, not from
# a share of the RAM: 20% of it was 50 GB, whose flush stalled k3s's datastore
# and the servers' ticks for seconds.
vm.dirty_bytes=1073741824
vm.dirty_background_bytes=268435456
# Memory kept free for allocations that cannot wait, the NIC driver's under a
# burst among them (default 88 MB).
vm.min_free_kbytes=1048576
# inotify instances per user, which the monitoring and logging pods' watchers
# run out of at the default 128.
fs.inotify.max_user_instances=8192
# The Node's own TCP (the API server, scrapes, publishing): paced, with BBR's
# congestion control, at full rate again after an idle spell.
net.core.default_qdisc=fq
net.ipv4.tcp_congestion_control=bbr
net.ipv4.tcp_slow_start_after_idle=0
# A CPU stuck in the kernel panics the Node, which then reboots
# (kernel.panic, 90-kubelet.conf) rather than hang.
kernel.softlockup_panic=1
