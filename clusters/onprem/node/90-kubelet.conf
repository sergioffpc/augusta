# The kernel parameters the kubelet expects, which k3s's
# protect-kernel-defaults (config.yaml) refuses to start without:
# /etc/sysctl.d/90-kubelet.conf, installed by scripts/bootstrap-node.sh.
vm.panic_on_oom=0
vm.overcommit_memory=1
# A kernel panic or oops reboots the Node after 10 s rather than hanging it.
kernel.panic=10
kernel.panic_on_oops=1
