# The API server's admission plugin configuration:
# /etc/rancher/k3s/admission.yaml (config.yaml, admission-control-config-file).
# It configures no PodSecurity defaults: each namespace's Pod Security level is
# set by its labels (ADR-0057), and a namespace without them stays privileged.
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  # Bounds the events any one namespace can create, so a pod that floods them
  # cannot slow the API server for the rest. An event over the limit is
  # dropped with a 429; nothing else is refused.
  - name: EventRateLimit
    configuration:
      apiVersion: eventratelimit.admission.k8s.io/v1alpha1
      kind: Configuration
      limits:
        - type: Namespace
          qps: 50
          burst: 100
          cacheSize: 2000
