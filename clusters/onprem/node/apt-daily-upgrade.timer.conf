# /etc/systemd/system/apt-daily-upgrade.timer.d/augusta.conf, written by
# scripts/bootstrap-node.sh: security updates install between 04:00 and 04:30,
# not Debian's 06:00-07:00, so one that needs a reboot takes it at 05:00 that
# same night (unattended-upgrades.conf), not the next.
[Timer]
OnCalendar=
OnCalendar=*-*-* 04:00
RandomizedDelaySec=30m
