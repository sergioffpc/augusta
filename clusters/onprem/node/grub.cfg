# The Node's kernel command line: /etc/default/grub.d/augusta.cfg, installed by
# scripts/bootstrap-node.sh, which runs update-grub when it changes.
#
# Transparent huge pages only where a process asks for them (madvise), not for
# every large allocation: khugepaged's compaction then never stalls a server
# that did not.
GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} transparent_hugepage=madvise"
