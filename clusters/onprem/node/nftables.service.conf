# /etc/systemd/system/nftables.service.d/augusta.conf, written by
# scripts/bootstrap-node.sh. Debian's nftables service stops with
# `nft flush ruleset`, which would delete k3s's tables with the firewall's:
# stopping it removes only the firewall's own.
[Service]
ExecStop=
ExecStop=/usr/sbin/nft delete table inet augusta
