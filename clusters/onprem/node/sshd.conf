# The Node's SSH policy (ADR-0057): /etc/ssh/sshd_config.d/10-augusta.conf,
# written by scripts/bootstrap-node.sh. sshd keeps the first value it reads
# for each keyword, and Debian's sshd_config includes this directory first, so
# these win over it and over any later drop-in (cloud-init's 50-cloud-init.conf
# turns passwords on).
#
# Keys only: a password, or a keyboard-interactive prompt that asks for one,
# is never tried. Which keys are the maintainer's, and how they are protected,
# is k3s-node-recovery.md's SSH keys.
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
# A FIDO2 key (ed25519-sk) needs a touch for every login; a key file copied off
# a workstation without the token is useless.
PubkeyAuthOptions touch-required
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
