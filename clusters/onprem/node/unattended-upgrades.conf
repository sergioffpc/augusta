// The Node's update policy (ADR-0057): /etc/apt/apt.conf.d/52augusta-upgrades,
// written by scripts/bootstrap-node.sh. It loads after Debian's
// 20auto-upgrades and 50unattended-upgrades, so what it sets wins.
//
// Debian's security updates install every day, unattended; nothing else does.
// k3s is not a Debian package and never upgrades here (k3s-node-recovery.md,
// Upgrade k3s).

APT::Periodic::Update-Package-Lists "1";
APT::Periodic::Unattended-Upgrade "1";
APT::Periodic::AutocleanInterval "7";

#clear Unattended-Upgrade::Origins-Pattern;
Unattended-Upgrade::Origins-Pattern {
  "origin=Debian,codename=${distro_codename}-security,label=Debian-Security";
};

// An update that needs a reboot (a kernel, libc) takes effect at the next
// 05:00, whoever is logged in, cutting any Match in progress (ADR-0026 accepts
// a cut Match). k3s, its pods and the capture filesystem start again at boot.
Unattended-Upgrade::Automatic-Reboot "true";
Unattended-Upgrade::Automatic-Reboot-WithUsers "true";
Unattended-Upgrade::Automatic-Reboot-Time "05:00";
