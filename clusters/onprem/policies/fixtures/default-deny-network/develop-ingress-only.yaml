# develop denies ingress by default but not egress: a server that is taken
# over can call out.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: develop
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: augustad-firebase
  namespace: develop
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: augustad
  template:
    metadata:
      labels:
        app.kubernetes.io/name: augustad
    spec:
      containers:
        - name: augustad
          image: ghcr.io/sergioffpc/augustad:sha-0123456789ab
