# A develop server mounting its pack folder straight from the Node, as the
# chart did before its local PersistentVolumes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: augustad-firebase
  namespace: develop
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: augustad
      scenario: firebase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: augustad
        scenario: firebase
    spec:
      containers:
        - name: augustad
          image: ghcr.io/sergioffpc/augustad:2.0.2
          volumeMounts:
            - name: pack
              mountPath: /srv/augusta/pack
              readOnly: true
      volumes:
        - name: pack
          hostPath:
            path: /srv/augusta/asset-packs/develop/firebase/9d0c7edd5b34
            type: Directory
