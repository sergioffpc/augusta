# A develop server pinned to a node port of staging's range.
apiVersion: v1
kind: Service
metadata:
  name: augustad-firebase
  namespace: develop
  labels:
    app.kubernetes.io/name: augustad
    app.kubernetes.io/instance: augustad
    scenario: firebase
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: augustad
    app.kubernetes.io/instance: augustad
    scenario: firebase
  ports:
    - name: game
      port: 7777
      targetPort: game
      protocol: UDP
      nodePort: 30800
