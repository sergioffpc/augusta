# Only a privileged namespace mounts the Node's own files (ADR-0057): a
# hostPath volume elsewhere is refused, so the Servers take their packs and
# captures from local PersistentVolumes (charts/augustad volumes.yaml), and a
# workload that needs the Node's files needs a reviewed change here, not just
# a manifest. Pod Security Admission refuses the same in every namespace that
# enforces baseline or restricted; this holds where one does not yet, and
# reports what one would refuse.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: host-path-volumes
spec:
  # Reported, not refused, until the cluster's policies are enforced.
  validationActions:
    - Audit
  # Kyverno extends a policy on pods to the pod templates of Deployments,
  # DaemonSets, StatefulSets, Jobs and CronJobs, which CI's rendered manifests
  # hold rather than pods.
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    # The namespaces that may, by name rather than by their Pod Security
    # label: CI checks manifests with no Namespace objects to read one from,
    # and a label anyone who can edit a namespace could set is no confinement.
    # kube-system and monitoring-node are the privileged ones (ADR-0057).
    # staging joins them until it runs a release whose chart mounts its packs
    # from local PersistentVolumes, the first tagged after #530: CI checks
    # staging with the latest release's chart, as Flux runs it. staging
    # enforces restricted from then on (clusters/onprem/apps/namespaces.yaml),
    # and leaves this list.
    - name: allowed
      expression: '["kube-system", "monitoring-node", "staging"]'
  validations:
    - expression: |-
        object.metadata.namespace in variables.allowed ||
        !has(object.spec.volumes) ||
        object.spec.volumes.all(volume, !has(volume.hostPath))
      messageExpression: |-
        "a pod in " + object.metadata.namespace +
        " must not mount a hostPath volume: only " +
        variables.allowed.join(", ") + " may (ADR-0057)"
