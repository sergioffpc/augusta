# Kyverno's policies (ADR-0057), which Flux applies to the cluster and CI's
# manifests job runs over every rendered manifest. A policy is a file here,
# listed below, and at least one negative fixture: a manifest it must refuse,
# in fixtures/<the policy's metadata.name>/, one per file. CI fails a policy
# with no fixture, or one that admits any of its fixtures, so a new policy
# needs nothing in CI.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - default-deny-network.yaml
  - host-path-volumes.yaml
  - image-digest.yaml
  - node-port-range.yaml
  - privileged-namespace-workloads.yaml
  - secret-allowlist.yaml
  - server-confinement.yaml
  - verify-image-signatures.yaml
# Kyverno extends a policy on pods to the pod templates of Deployments,
# DaemonSets, StatefulSets, Jobs and CronJobs, but not of ReplicaSets, which
# it would by default: a Deployment's controller scales its old ReplicaSets
# down, and one whose template a policy now refuses would be refused that
# too, its pods left running beside the new ones. A ReplicaSet's pods are
# judged as it creates them.
patches:
  - target:
      group: policies.kyverno.io
    patch: |-
      - op: add
        path: /spec/autogen
        value:
          podControllers:
            controllers: [daemonsets, deployments, statefulsets, jobs, cronjobs]
