# The cluster holds no credential (ADR-0057): the only Secrets are Flux's
# trusted public keys, kept in Git (#525), the release records Flux's
# helm-controller keeps as Helm does, and those the charts and their
# operators make for themselves, listed here by name, so a new one needs a
# decision recorded here first. kube-system and kyverno are exempt, as they
# are from Kyverno's webhooks: k3s and Kyverno keep their own certificates
# and tokens there.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: secret-allowlist
spec:
  # Reported, not refused, until the cluster's policies are enforced.
  validationActions:
    - Audit
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
  matchConditions:
    - name: outside-the-control-plane
      expression: '!(object.metadata.namespace in ["kube-system", "kyverno"])'
  variables:
    # Each namespace's Secrets, by name.
    - name: names
      expression: |-
        {
          "flux-system": ["trusted-signers-develop", "trusted-signers-release"],
          "monitoring": [
            "kube-prometheus-stack-admission",
            "kube-prometheus-stack-prometheus-token"
          ]
        }
    # Each namespace's Secrets, by the prefix of the names a chart's operator
    # gives them: the Prometheus Operator's for its Prometheus and
    # Alertmanager (their configuration, TLS assets and web configuration),
    # and the chart's own Alertmanager configuration.
    - name: prefixes
      expression: |-
        {
          "monitoring": [
            "prometheus-kube-prometheus-stack-prometheus",
            "alertmanager-kube-prometheus-stack-alertmanager"
          ]
        }
    - name: namespace
      expression: object.metadata.namespace
    - name: name
      expression: object.metadata.name
  validations:
    - expression: |-
        (object.?type.orValue("") == "helm.sh/release.v1" && variables.name.startsWith("sh.helm.release.v1.")) ||
        (variables.namespace in variables.names &&
          variables.name in variables.names[variables.namespace]) ||
        (variables.namespace in variables.prefixes &&
          variables.prefixes[variables.namespace].exists(prefix, variables.name.startsWith(prefix)))
      messageExpression: |-
        "Secret " + variables.namespace + "/" + variables.name +
        " is not one the cluster allows (clusters/onprem/policies/secret-allowlist.yaml)"
