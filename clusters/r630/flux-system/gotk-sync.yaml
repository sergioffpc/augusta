---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  ref:
    # `develop` is where feature work actually lands; `main` only advances on
    # a real release cut (see ENGINEERING.md's Git Workflow), so pinning this
    # self-sync to `main` would leave Flux's own config dormant until v1.
    branch: develop
  url: https://github.com/sergioffpc/augusta
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./clusters/r630/flux-system
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: flux-system
  interval: 10m
  path: ./clusters/r630/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
