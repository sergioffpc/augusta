# The client's startup settings (ADR-0034). Copy this next to augustac(.exe) as
# augustac.yaml and edit it, or keep it anywhere and run
# `augustac --config <this file>`. Keys are grouped into sections; an error
# names a key by its path, e.g. network.server_address. `augustac --reenact
# <capture> --player <n>` plays player n of a Match capture again against the
# server below, as that player's Character rather than player.character
# (ADR-0050).
# Where the relative paths below start from (required). A relative value is
# relative to this file's directory, so "." means the directory of this file.
base_dir: .
player:
  # The character to play (required), by its name in the
  # server's scenario's manifest (authoring/scenarios/<scenario>.yaml), e.g.
  # soldier. The server refuses the join
  # otherwise (ADR-0042).
  character: soldier
content:
  # Client pack to load (required).
  pack: packs/firebase/client.apak
  # Ed25519 public key the pack is signed with (required).
  public_key: keys/develop.pub
network:
  # Server to connect to (optional, default 127.0.0.1:27015).
  server_address: 127.0.0.1:27015
logging:
  # Console sink's runtime floor (optional, default debug): one of trace, debug,
  # info, warn, error, critical. Only lowers what the build already compiles in
  # - a Debug build compiles trace and up, a Release build info and up, so this
  # can't raise a Release build back to trace or debug. debug is the heartbeat
  # (once a second: ticks, messages, drops, corrections) without the per-packet
  # trace firehose; set trace when debugging the network layer itself.
  level: debug
input:
  # How far the view turns, in radians, per pixel of mouse movement (optional,
  # default 0.0022).
  mouse_sensitivity: 0.0022
  # Which key triggers each control (optional). Leave a control out to keep its
  # default; no two controls may share a key, Escape is reserved for releasing
  # the cursor and F1 is reserved too. Key names: A-Z, 0-9, Space, Tab, Enter,
  # Backspace, LeftShift, RightShift, LeftControl, RightControl, LeftAlt,
  # RightAlt, Up, Down, Left, Right, F2-F12, MouseLeft, MouseRight,
  # MouseMiddle. The values below are the defaults.
  keys:
    move_forward: W
    move_back: S
    move_left: A
    move_right: D
    sprint: LeftShift
    crouch: LeftControl
    prone: Z
    fire: MouseLeft
    ads: MouseRight
    reload: R
# Which debug tools start on (optional, ADR-0074). The section exists only in a
# Development build; a Shipping build, the one players get, refuses it as an
# unknown key, so it is left commented out here.
# debug:
#   # Whether the Debug HUD - the frame rate and the connection's numbers - is
#   # drawn (optional, default true): true or false.
#   hud: true
#   profiling:
#     # Whether the Profiling Debug panel - a window of frames for Nsight
#     # Systems to capture, and Aftermath's status - is shown (optional, default
#     # false): true or false.
#     panel: false
#   physics:
#     # Whether the Physics Debug panel - the switches of the physics and
#     # collision Debug overlays - is shown (optional, default false): true or
#     # false. Not offered to a Replay viewer.
#     panel: false
#     # Whether the Collision overlay - PhysX's own view of the client's World,
#     # the Map's collision, the player's capsule and the controller volumes,
#     # around the camera - is drawn (optional, default false): true or false.
#     collision: false
#     # Whether the Server bodies overlay - every body as the newest
#     # Authoritative State update put it, the player's own beside its
#     # predicted body - is drawn (optional, default false): true or false.
#     server_bodies: false
#     # Whether the Hitboxes overlay - every other player's Hitboxes where the
#     # client shows that player, placed as the server places them, one colour
#     # per body part - is drawn (optional, default false): true or false.
#     hitboxes: false
#     # Whether the Shot judgements overlay - for each of the player's own
#     # rounds, the Hitboxes the client showed when it fired beside those the
#     # server judged it against, with its flight and the point struck - is
#     # drawn (optional, default false): true or false. The server sends Shot
#     # judgements only with its own `debug.shot_judgements` on.
#     shot_judgements: false
