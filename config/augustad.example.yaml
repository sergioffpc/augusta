# The server's startup settings (ADR-0034). Copy this next to augustad(.exe) as
# augustad.yaml and edit it, or keep it anywhere and run
# `augustad --config <this file>`. Keys are grouped into sections; an error
# names a key by its path, e.g. simulation.tick_rate_hz.
# Where the relative paths below start from (required). A relative value is
# relative to this file's directory, so "." means the directory of this file.
base_dir: .
content:
  # Server pack to load (required). It holds the scenario's map and its Lua
  # scripts, among them the Parameters script the simulation's tunable values
  # (the stamina rules) come from; every client is sent the values when it
  # joins (ADR-0039). See tools/composer/examples/authoring/scripts/parameters/rules_of_engagement.lua.
  # Cook it with `augusta-pack <scenario>` (tools/pack).
  pack: packs/firebase/server.pack
  # Ed25519 public key the pack is signed with (required).
  public_key: keys/signing.pub
simulation:
  # The rate, in Hz, at which the server simulates and every client predicts
  # (required): a whole number from 1 to 255. It is fixed for as long as the server
  # runs and every client is told it when it joins, so no client has a setting
  # for it. NFR-01 asks the server to sustain 60 Hz; a slower rate is accepted
  # so a run can be debugged.
  tick_rate_hz: 60
  # Where to write a recording of every tick the server simulates (optional,
  # default none): the commands each tick ran on and what it resolved, which
  # augusta-replay re-runs to reproduce a match (ADR-0048). The file is
  # replaced each time the server starts, and grows by about 35 KB a second
  # with 8 players at 60 Hz.
  # recording: recordings/match.rec
  # What losing a tick of that recording costs (optional, default optional):
  # optional, for a debugging aid, logs the failure once and records nothing
  # more while the server and its Match go on; strict, for a replay or
  # verification run that needs every tick, stops the server with a failure.
  # recording_mode: optional
  # The directory to capture every Match into (optional, default none), one file
  # each, named by when it started and its number in the server's run: who
  # joined where, the Commands each player sent, who left or died, and how it
  # ended, for augusta-inspect to read and augustac to reenact (ADR-0050). It is
  # created if missing; augustad refuses to start if it cannot be. A capture
  # grows by about 15 KB a second with 8 players at 60 Hz; one that cannot be
  # written stops, logged once, while the server and its Match go on. A
  # debugging setting: never on for a server open to players.
  # capture: captures/firebase
  # Whether a Captured player's Reenact request is admitted (optional, default
  # false): true lets augustac --reenact join and spawn where its capture has
  # it, which the server takes on trust; false refuses it with "reenactments
  # not accepted" (ADR-0050). A debugging setting: never on for a server open
  # to players.
  # reenactments: false
network:
  # Local address to listen on (optional, default 0.0.0.0:27015).
  listen_address: 0.0.0.0:27015
metrics:
  # TCP port the metrics endpoint listens on, on every interface (optional,
  # default 9464): /metrics for Prometheus, /livez for the liveness probe
  # (ADR-0049). It is always on, in a local run too.
  port: 9464
logging:
  # Console sink's runtime floor (optional, default debug): one of trace, debug,
  # info, warn, error, critical. Only lowers what the build already compiles in
  # - a Debug build compiles trace and up, a Release build info and up, so this
  # can't raise a Release build back to trace or debug. debug is the heartbeat
  # (once a second: ticks, messages, drops, corrections) without the per-packet
  # trace firehose; set trace when debugging the network layer itself.
  level: debug
