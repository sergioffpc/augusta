# The documentation site (ADR-0046): docs/ as it is, plus README.md and
# CONTEXT.md, with the C++ API reference Doxygen builds into api/. The navigation
# and the links to files that are not pages come from tools/docs/hooks.py.
# Build it with `make docs`.
site_name: Augusta
site_description: A realistic, physics-driven multiplayer FPS simulator engine.
site_url: https://sergioffpc.github.io/augusta/
repo_url: https://github.com/sergioffpc/augusta
repo_name: sergioffpc/augusta
# No edit button: README.md and CONTEXT.md live outside docs/.
edit_uri: ""
docs_dir: docs
site_dir: build/docs-site
# Instructions for coding agents, not for readers.
exclude_docs: |
  agents/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
hooks:
  - tools/docs/hooks.py
validation:
  # The navigation's API reference entry links to api/, which Doxygen fills
  # after MkDocs has built; every other entry is a page the hook found.
  nav:
    not_found: info
  links:
    anchors: warn
