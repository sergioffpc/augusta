# selene's standard library for the engine's Lua sandbox (lua_sandbox.cpp): the
# base, math, string and table libraries, less what the sandbox takes out, plus
# what the engine gives a script. The engine embeds Lua 5.5, but selene's
# release builds parse only Lua 5.1's syntax, so this starts from 5.1's library
# and makes it the newer one's where a script could tell them apart.
base: lua51
name: selene-sandbox
globals:
  # Taken out by scripting::MakeSandbox: no files, no compiling more code, no
  # output, no garbage collector, no catching the instruction limit's error.
  dofile:
    removed: true
  loadfile:
    removed: true
  load:
    removed: true
  require:
    removed: true
  print:
    removed: true
  collectgarbage:
    removed: true
  pcall:
    removed: true
  xpcall:
    removed: true
  math.random:
    removed: true
  math.randomseed:
    removed: true
  # Lua 5.1's, gone from the Lua the engine embeds.
  setfenv:
    removed: true
  getfenv:
    removed: true
  loadstring:
    removed: true
  module:
    removed: true
  unpack:
    removed: true
  # The newer Lua's, which 5.1's library lacks.
  table.unpack:
    args:
      - type: table
      - required: false
        type: number
      - required: false
        type: number
  warn:
    args:
      - type: "..."
  # Libraries the sandbox never opens. selene removes a library only field by
  # field, so each field is listed.
  coroutine:
    removed: true
  coroutine.create:
    removed: true
  coroutine.resume:
    removed: true
  coroutine.running:
    removed: true
  coroutine.status:
    removed: true
  coroutine.wrap:
    removed: true
  coroutine.yield:
    removed: true
  debug:
    removed: true
  debug.debug:
    removed: true
  debug.getfenv:
    removed: true
  debug.gethook:
    removed: true
  debug.getinfo:
    removed: true
  debug.getlocal:
    removed: true
  debug.getmetatable:
    removed: true
  debug.getregistry:
    removed: true
  debug.getupvalue:
    removed: true
  debug.setfenv:
    removed: true
  debug.sethook:
    removed: true
  debug.setlocal:
    removed: true
  debug.setmetatable:
    removed: true
  debug.setupvalue:
    removed: true
  debug.traceback:
    removed: true
  io:
    removed: true
  io.close:
    removed: true
  io.flush:
    removed: true
  io.input:
    removed: true
  io.lines:
    removed: true
  io.open:
    removed: true
  io.output:
    removed: true
  io.popen:
    removed: true
  io.read:
    removed: true
  io.stderr:
    removed: true
  io.stdin:
    removed: true
  io.stdout:
    removed: true
  io.tmpfile:
    removed: true
  io.type:
    removed: true
  io.write:
    removed: true
  os:
    removed: true
  os.clock:
    removed: true
  os.date:
    removed: true
  os.difftime:
    removed: true
  os.execute:
    removed: true
  os.exit:
    removed: true
  os.getenv:
    removed: true
  os.remove:
    removed: true
  os.rename:
    removed: true
  os.setlocale:
    removed: true
  os.time:
    removed: true
  os.tmpname:
    removed: true
  package:
    removed: true
  package.cpath:
    removed: true
  package.loaded:
    removed: true
  package.loaders:
    removed: true
  package.loadlib:
    removed: true
  package.path:
    removed: true
  package.preload:
    removed: true
  package.seeall:
    removed: true
  # The Parameters script reads the server it is loaded for (ADR-0039).
  server.tick_rate_hz:
    property: read-only
  # The hooks a Game policy script defines and SimulationWorld calls (ADR-0022).
  on_tick:
    property: new-fields
  assign_spawns:
    property: new-fields
