# The augusta scenario's composition manifest (ADR-0041): what the cooker packs
# together into one client/server pack pair, every entry a file path relative
# to authoring/. `augusta-pack augusta` reads this file.
# The one map this scenario cooks (ADR-0015). A scenario always composes
# exactly one.
map: maps/augusta.usda
# Every character this scenario's pack includes (ADR-0040). A client asks for
# one by its path without the extension: characters/player.
characters:
  - characters/player.usda
# The mono PCM WAV sound of every cue the client plays (ADR-0020, ADR-0031),
# by cue. Cooked into the client pack only.
sounds:
  gunshot: sounds/augusta/gunshot.wav
  hit_marker: sounds/augusta/hit_marker.wav
  hit_taken: sounds/augusta/hit_taken.wav
  death: sounds/augusta/death.wav
  match_won: sounds/augusta/match_won.wav
  match_lost: sounds/augusta/match_lost.wav
# The scripts the server runs, by role, cooked into the server pack only:
# parameters (ADR-0039) is required, rules (ADR-0022) optional.
scripts:
  parameters: scripts/parameters/default.lua
  rules: scripts/rules/last_standing.lua
