[project]
name = "augusta-pack"
version = "0.1.0"
description = "Augusta asset-cooking pipeline (ADR-0030): usd-optimize -> usd-validation-nvidia -> pure-Python cook/pack."
requires-python = ">=3.12,<3.13"
dependencies = [
  "usd-optimize>=1.2.1",
  "usd-validation-nvidia>=1.21.0",
  "pynacl>=1.5.0",
  "blake3>=0.4.1",
  "pyyaml>=6.0",
]

[project.scripts]
augusta-pack = "augusta_pack.cli:main"
augusta-keygen = "augusta_pack.keys:main"
augusta-inspect = "augusta_pack.pack_cli:inspect_main"
augusta-verify = "augusta_pack.pack_cli:verify_main"
augusta-publish = "augusta_pack.publish:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/augusta_pack"]
