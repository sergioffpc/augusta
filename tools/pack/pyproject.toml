[project]
name = "augusta-pack"
version = "0.1.0"
description = "Augusta asset-cooking pipeline (ADR-0030): usd-optimize -> usd-validation-nvidia -> cook -> augusta_assets' pack encoder."
requires-python = ">=3.12,<3.13"
dependencies = [
  "usd-optimize>=1.2.1",
  "usd-validation-nvidia>=1.21.0",
  "pyyaml>=6.0",
  # The runtime of the protocol's generated module (augusta_pb2). The code
  # vcpkg's protoc 33.4 generates needs a 6.x runtime no older than 6.33.4.
  "protobuf>=6.33.4,<7",
]

[project.scripts]
augusta-pack = "augusta_pack.cli:main"
augusta-keygen = "augusta_pack.keys:main"
augusta-inspect = "augusta_pack.pack_cli:inspect_main"
augusta-verify = "augusta_pack.pack_cli:verify_main"
augusta-publish = "augusta_pack.publish:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/augusta_pack"]
