# The one Python environment every tool under tools/ shares: `uv sync` here
# creates tools/.venv, with the cooker and the Agents' package installed
# editable, their test runner, and what the documentation site is built with
# (ADR-0046). The agent and pack groups alone are what the C++ CI jobs sync:
# the interpreter the root build builds the tools' modules against, the two
# packages and pytest; the Linux one syncs the wireshark group too.
[project]
name = "augusta-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["augusta-agent", "augusta-pack", "pytest>=8"]
agent = ["augusta-agent", "pytest>=8"]
pack = ["augusta-pack", "pytest>=8"]
# The Wireshark dissector's test, which needs no package (tools/wireshark).
wireshark = ["pytest>=8"]
# The repository's own Python checks and their tests (checks/, scripts/), and
# the CI scripts that read YAML: run from this lock, as CI runs everything
# Python, so no version of theirs is picked at run time.
checks = ["pytest>=8", "pyyaml>=6"]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7"]

[tool.uv]
package = false
default-groups = ["dev", "docs"]

[tool.uv.workspace]
members = ["agent", "pack", "wireshark"]

[tool.uv.sources]
augusta-agent = { workspace = true }
augusta-pack = { workspace = true }
