# The one Python environment every tool under tools/ shares: `uv sync` here
# creates tools/.venv, with the cooker installed editable, its test runner, and
# what the documentation site is built with (ADR-0046).
[project]
name = "augusta-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = ["pack", "pytest>=8"]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.7.7"]

[tool.uv]
package = false
default-groups = ["dev", "docs"]

[tool.uv.workspace]
members = ["pack"]

[tool.uv.sources]
pack = { workspace = true }
